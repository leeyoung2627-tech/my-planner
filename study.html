<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>공부 &amp; 커미션 일정 — 두목의 플래너</title>
<link rel="icon" type="image/x-icon" href="/favicon/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@700&display=swap" rel="stylesheet">
<script>
(function(){
  try{
    const saved=localStorage.getItem('planner_theme_v2');
    if(saved){const t=JSON.parse(saved);if(t.pagebg)document.documentElement.style.setProperty('--page-bg',t.pagebg);}
  }catch(e){}
})();
</script>
<style>
:root{
  --accent:#8C7B6B;
  --accent-light:#EFEAE3;
  --page-bg:#F7F5F2;
  --text-main:#222;
  --border-col:#E4DED4;
  --exam-col:#C1553B;
  --exam-light:#F7E6E0;
  --col-bg:#FBFAF8;
  --today-bg:#F1EBE3;
}
*{box-sizing:border-box;margin:0;padding:0}
button,input,select{font-family:inherit}
body{font-family:'Apple SD Gothic Neo','Malgun Gothic',sans-serif;background:var(--page-bg);color:var(--text-main);
  min-height:100vh;padding:18px 18px 60px;display:flex;flex-direction:column;align-items:center;gap:20px}

.sp-topbar{width:100%;max-width:1180px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sp-back{display:inline-flex;align-items:center;gap:5px;font-size:13px;color:#777;text-decoration:none;padding:7px 12px;
  border-radius:20px;background:#fff;border:1px solid var(--border-col);transition:.15s}
.sp-back:hover{color:var(--accent);border-color:var(--accent)}
.sp-title{font-family:'Nanum Myeongjo',serif;font-size:21px;font-weight:700;color:var(--accent);letter-spacing:-.3px}
.sp-gear-btn{background:#fff;border:1px solid var(--border-col);color:#777;font-size:12.5px;font-weight:700;
  padding:7px 14px;border-radius:20px;cursor:pointer;transition:.15s}
.sp-gear-btn:hover{color:var(--accent);border-color:var(--accent)}

/* ── 섹션(공부 / 커미션) 공통 ── */
.sp-section{width:100%;max-width:1180px;display:flex;flex-direction:column;gap:12px}
.sp-section-head{display:flex;align-items:center;gap:10px}
.sp-section-title{font-family:'Nanum Myeongjo',serif;font-size:17px;font-weight:700;color:var(--text-main)}
.sp-section-line{flex:1;height:1px;background:var(--border-col)}

.sp-material-wrap{display:flex;justify-content:center;width:100%}
.sp-material-btn{position:relative;display:inline-flex;align-items:center;gap:8px;background:#fff;border:1.5px solid var(--accent);
  color:var(--accent);font-weight:700;font-size:13.5px;padding:10px 22px;border-radius:999px;cursor:pointer;
  box-shadow:0 3px 10px rgba(83,74,183,.14);transition:.15s}
.sp-material-btn:hover{background:var(--accent);color:#fff;transform:translateY(-1px)}
.sp-material-dot{position:absolute;top:-3px;right:-3px;width:11px;height:11px;border-radius:50%;background:#3DBE64;
  border:2px solid #fff;display:none}
.sp-material-dot.on{display:block}
.sp-material-meta{font-size:11px;color:#999;text-align:center;margin-top:-4px}

.sp-link-row{display:flex;justify-content:center;gap:10px;width:100%;flex-wrap:wrap}
.sp-link-btn{display:inline-flex;align-items:center;gap:7px;background:#fff;border:1.5px solid var(--accent);
  color:var(--accent);font-weight:700;font-size:13.5px;padding:10px 22px;border-radius:999px;cursor:pointer;
  text-decoration:none;box-shadow:0 3px 10px rgba(83,74,183,.14);transition:.15s}
.sp-link-btn:hover{background:var(--accent);color:#fff;transform:translateY(-1px)}

.sp-layout{width:100%;display:grid;grid-template-columns:1fr 460px;gap:16px;align-items:start}
@media (max-width:880px){.sp-layout{grid-template-columns:1fr}}

.sp-card{background:#fff;border-radius:16px;border:1px solid var(--border-col);box-shadow:0 2px 12px rgba(80,60,160,.06);
  padding:16px}

/* 사이드바: 미니 월간 캘린더 + 목록을 가로로 나란히 */
.sp-sidebar-row{display:flex;gap:14px;align-items:flex-start}
@media (max-width:600px){.sp-sidebar-row{flex-direction:column}}
.sp-mini-card{width:220px;flex-shrink:0}
@media (max-width:600px){.sp-mini-card{width:100%}}
.sp-list-card{flex:1;min-width:200px}

/* 주간 캘린더 헤더 */
.sp-week-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:8px;flex-wrap:wrap}
.sp-week-nav-left{display:flex;align-items:center;gap:6px}
.sp-nav-btn{background:var(--accent-light);color:var(--accent);border:none;width:30px;height:30px;border-radius:9px;
  cursor:pointer;font-size:14px;font-weight:700}
.sp-nav-btn:hover{filter:brightness(.95)}
.sp-week-label{font-size:14.5px;font-weight:700;min-width:150px;text-align:center}
.sp-today-btn{background:#fff;border:1px solid var(--border-col);color:#666;font-size:12px;padding:6px 12px;
  border-radius:8px;cursor:pointer}
.sp-today-btn:hover{border-color:var(--accent);color:var(--accent)}
.sp-add-group{display:flex;gap:6px}
.sp-add-btn{font-size:12px;font-weight:700;border:none;border-radius:9px;padding:8px 13px;cursor:pointer;color:#fff}
.sp-add-btn.study{background:var(--accent)}
.sp-add-btn.exam{background:var(--exam-col)}
.sp-add-btn:hover{filter:brightness(1.08)}

/* 주간 그리드 */
.sp-week-grid{width:100%}
.sp-week-headers{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:6px}
.sp-day-head{text-align:center;padding:8px 2px 6px;border-radius:10px;font-size:12px;color:#888}
.sp-day-head .dnum{font-size:16px;font-weight:800;color:var(--text-main);margin-top:2px}
.sp-day-head.sun{color:#E4572E}
.sp-day-head.sat{color:#3B6FE0}
.sp-day-head.today{background:var(--accent-light)}
.sp-day-head.today .dnum{color:var(--accent)}

.sp-week-exams{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:6px;min-height:8px}
.sp-exam-pill{display:flex;align-items:center;gap:3px;background:var(--exam-light);color:var(--exam-col);font-size:10.5px;
  font-weight:700;padding:3px 6px;border-radius:7px;margin-bottom:3px;cursor:pointer;line-height:1.3;word-break:keep-all}
.sp-exam-pill.done{background:#E9F6EC;color:#2E9E52;text-decoration:line-through;opacity:.75}
.sp-exam-pill.overdue{animation:sp-pulse 1.4s ease-in-out infinite}
@keyframes sp-pulse{0%,100%{box-shadow:0 0 0 0 rgba(228,87,46,.35)}50%{box-shadow:0 0 0 4px rgba(228,87,46,0)}}

.sp-week-body{position:relative;min-height:180px;border-radius:10px;overflow:hidden}
.sp-week-cols-bg{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;position:absolute;inset:0}
.sp-week-col-bg{background:var(--col-bg);border-radius:8px;cursor:pointer;transition:.12s}
.sp-week-col-bg:hover{background:var(--accent-light)}
.sp-week-col-bg.today-col{background:var(--today-bg)}
.sp-week-bars{position:relative;display:grid;grid-template-columns:repeat(7,1fr);gap:6px 6px;grid-auto-rows:30px;padding:4px 0}
.sp-bar{grid-row:span 1;border-radius:8px;padding:5px 9px;font-size:11.5px;font-weight:700;color:#333;cursor:pointer;
  display:flex;align-items:center;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;border:1px solid transparent;
  box-shadow:0 1px 3px rgba(0,0,0,.06)}
.sp-bar.cont-left{border-top-left-radius:2px;border-bottom-left-radius:2px}
.sp-bar.cont-right{border-top-right-radius:2px;border-bottom-right-radius:2px}
.sp-empty-hint{text-align:center;color:#bbb;font-size:12px;padding:30px 0}

/* 미니 월간 캘린더 */
.sp-mini-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.sp-mini-label{font-size:13px;font-weight:700}
.sp-mini-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;font-size:10.5px}
.sp-mini-dow{text-align:center;color:#aaa;padding:3px 0;font-weight:700}
.sp-mini-cell{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:6px;
  cursor:pointer;position:relative;color:#555}
.sp-mini-cell:hover{background:var(--accent-light)}
.sp-mini-cell.dim{color:#ddd}
.sp-mini-cell.today{background:var(--accent);color:#fff;font-weight:800}
.sp-mini-cell.in-week{background:var(--accent-light)}
.sp-mini-dots{display:flex;gap:1px;position:absolute;bottom:2px}
.sp-mini-dot{width:3.5px;height:3.5px;border-radius:50%}

/* 목록(시험/마감) 카드 */
.sp-list-card-title{font-size:13px;font-weight:800;margin-bottom:8px}
.sp-exam-list{display:flex;flex-direction:column;gap:8px}
.sp-exam-item{border:1px solid var(--border-col);border-radius:10px;padding:9px 10px;font-size:12px}
.sp-exam-item .ei-top{display:flex;justify-content:space-between;align-items:center;gap:6px}
.sp-exam-item .ei-title{font-weight:700;color:#333}
.sp-exam-item .ei-date{color:#999;font-size:11px}
.sp-badge{font-size:10px;font-weight:700;padding:2px 7px;border-radius:20px}
.sp-badge.pending{background:#F0F0F0;color:#888}
.sp-badge.overdue{background:var(--exam-light);color:var(--exam-col)}
.sp-badge.done{background:#E9F6EC;color:#2E9E52}
.ei-actions{margin-top:6px;display:flex;gap:6px;align-items:center}
.ei-proof-btn{font-size:11px;background:var(--exam-col);color:#fff;border:none;border-radius:7px;padding:5px 9px;cursor:pointer}
.ei-thumb{width:34px;height:34px;border-radius:6px;object-fit:cover;cursor:pointer;border:1px solid var(--border-col)}
.sp-empty-small{color:#bbb;font-size:11.5px;text-align:center;padding:10px 0}

/* 모달 */
.sp-modal-bg{display:none;position:fixed;inset:0;background:rgba(30,20,50,.4);z-index:9000;align-items:center;justify-content:center;padding:20px}
.sp-modal-bg.open{display:flex}
.sp-modal{background:#fff;border-radius:16px;padding:22px;width:100%;max-width:380px;display:flex;flex-direction:column;gap:11px;
  max-height:88vh;overflow-y:auto}
.sp-modal h3{font-size:15px;font-weight:800;margin-bottom:2px}
.sp-field label{font-size:11.5px;color:#888;display:block;margin-bottom:4px;font-weight:700}
.sp-field input[type=text],.sp-field input[type=date]{width:100%;padding:8px 10px;border:1px solid var(--border-col);
  border-radius:8px;font-size:13px}
.sp-field input:focus{outline:none;border-color:var(--accent)}
.sp-date-row{display:flex;gap:8px}
.sp-date-row .sp-field{flex:1}
.sp-color-row{display:flex;gap:7px;flex-wrap:wrap}
.sp-color-dot{width:26px;height:26px;border-radius:50%;cursor:pointer;border:2px solid transparent}
.sp-color-dot.sel{border-color:#333;box-shadow:0 0 0 2px #fff inset}
.sp-modal-actions{display:flex;justify-content:space-between;margin-top:6px;gap:8px}
.sp-btn{border:none;border-radius:9px;padding:9px 15px;font-size:12.5px;font-weight:700;cursor:pointer}
.sp-btn.primary{background:var(--accent);color:#fff}
.sp-btn.primary.examclr{background:var(--exam-col)}
.sp-btn.ghost{background:#f2f2f2;color:#888}
.sp-btn.danger{background:#fff;color:#E4572E;border:1px solid #F3C9BC}

/* 라이트박스 */
.sp-lightbox-bg{display:none;position:fixed;inset:0;background:rgba(10,8,20,.85);z-index:9500;align-items:center;justify-content:center;
  flex-direction:column;gap:14px;padding:24px}
.sp-lightbox-bg.open{display:flex}
.sp-lightbox-bg img{max-width:92vw;max-height:78vh;border-radius:10px;box-shadow:0 10px 40px rgba(0,0,0,.5)}
.sp-lightbox-actions{display:flex;gap:10px}
.sp-lightbox-actions button{border:none;border-radius:20px;padding:9px 18px;font-size:12.5px;font-weight:700;cursor:pointer}
.sp-lb-close{background:#fff;color:#333}
.sp-lb-replace{background:var(--accent);color:#fff}

.sp-material-empty-note{font-size:11px;color:#aaa}

/* 설정 모달 전용 */
.sp-settings-row{display:flex;align-items:center;gap:12px}
.sp-mascot-preview{width:56px;height:56px;border-radius:12px;background:var(--accent-light);object-fit:contain;padding:5px;
  border:1px solid var(--border-col)}
.sp-settings-btns{display:flex;flex-direction:column;gap:6px}
.sp-mini-btn{font-size:11.5px;border:1px solid var(--border-col);background:#fff;color:#666;border-radius:8px;
  padding:6px 10px;cursor:pointer}
.sp-mini-btn:hover{border-color:var(--accent);color:var(--accent)}
.sp-theme-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sp-theme-swatch{border:2px solid transparent;border-radius:10px;padding:8px 6px;cursor:pointer;text-align:center;
  font-size:10.5px;font-weight:700;color:#555;display:flex;flex-direction:column;align-items:center;gap:5px}
.sp-theme-swatch.sel{border-color:#333}
.sp-theme-dot{width:22px;height:22px;border-radius:50%}
.sp-msg-textarea{width:100%;min-height:88px;border:1px solid var(--border-col);border-radius:8px;padding:8px 10px;
  font-size:12.5px;font-family:inherit;resize:vertical;line-height:1.6}
.sp-msg-textarea:focus{outline:none;border-color:var(--accent)}
</style>
</head>
<body>

<div class="sp-topbar">
  <a class="sp-back" href="index.html">← 플래너로 돌아가기</a>
  <div class="sp-title">📚✏️ 공부 &amp; 커미션 일정</div>
  <button class="sp-gear-btn" onclick="openSettingsModal()" title="캐릭터 & 캘린더 설정">⚙️ 설정</button>
</div>

<!-- ══════════ 섹션: 공부 & 시험 ══════════ -->
<div class="sp-section" id="section-study">
  <div class="sp-section-head"><div class="sp-section-title">📚 공부 &amp; 시험 일정</div><div class="sp-section-line"></div></div>

  <div class="sp-material-wrap">
    <div style="display:flex;flex-direction:column;align-items:center;gap:4px">
      <button class="sp-material-btn" id="materialBtn" onclick="onMaterialBtn('study')">
        <span id="materialBtnIcon">📎</span>
        <span id="materialBtnLabel">이번 주 시험자료 올리기</span>
        <span class="sp-material-dot" id="materialDot"></span>
      </button>
      <div class="sp-material-meta" id="materialMeta"></div>
    </div>
  </div>

  <div class="sp-layout">
    <div class="sp-card">
      <div class="sp-week-nav">
        <div class="sp-week-nav-left">
          <button class="sp-nav-btn" onclick="shiftWeek('study',-1)">‹</button>
          <div class="sp-week-label" id="weekLabel"></div>
          <button class="sp-nav-btn" onclick="shiftWeek('study',1)">›</button>
          <button class="sp-today-btn" onclick="goToday('study')">오늘</button>
        </div>
        <div class="sp-add-group">
          <button class="sp-add-btn study" onclick="openScheduleModal('study')">+ 학습 일정</button>
          <button class="sp-add-btn exam" onclick="openItemModal('study')">+ 시험 등록</button>
        </div>
      </div>
      <div class="sp-week-grid">
        <div class="sp-week-headers" id="weekHeaders"></div>
        <div class="sp-week-exams" id="weekExams"></div>
        <div class="sp-week-body">
          <div class="sp-week-cols-bg" id="weekColsBg"></div>
          <div class="sp-week-bars" id="weekBars"></div>
        </div>
      </div>
    </div>

    <div class="sp-sidebar-row">
      <div class="sp-card sp-mini-card">
        <div class="sp-mini-nav">
          <button class="sp-nav-btn" onclick="shiftMiniMonth('study',-1)">‹</button>
          <div class="sp-mini-label" id="miniLabel"></div>
          <button class="sp-nav-btn" onclick="shiftMiniMonth('study',1)">›</button>
        </div>
        <div class="sp-mini-grid" id="miniGrid"></div>
      </div>
      <div class="sp-card sp-list-card">
        <div class="sp-list-card-title">🎯 시험 목록</div>
        <div class="sp-exam-list" id="examListSide"></div>
      </div>
    </div>
  </div>
</div>

<!-- ══════════ 섹션: 커미션 ══════════ -->
<div class="sp-section" id="section-commission">
  <div class="sp-section-head"><div class="sp-section-title">✏️ 커미션 일정</div><div class="sp-section-line"></div></div>

  <div class="sp-link-row">
    <a class="sp-link-btn" href="https://kre.pe/r2IR" target="_blank" rel="noopener">🔗 크레페</a>
    <a class="sp-link-btn" href="https://www.postype.com/@eclair-22ol/request/22720006" target="_blank" rel="noopener">🔗 포스타입</a>
  </div>

  <div class="sp-layout">
    <div class="sp-card">
      <div class="sp-week-nav">
        <div class="sp-week-nav-left">
          <button class="sp-nav-btn" onclick="shiftWeek('commission',-1)">‹</button>
          <div class="sp-week-label" id="weekLabelC"></div>
          <button class="sp-nav-btn" onclick="shiftWeek('commission',1)">›</button>
          <button class="sp-today-btn" onclick="goToday('commission')">오늘</button>
        </div>
        <div class="sp-add-group">
          <button class="sp-add-btn study" onclick="openScheduleModal('commission')">+ 커미션 일정</button>
          <button class="sp-add-btn exam" onclick="openItemModal('commission')">+ 마감 등록</button>
        </div>
      </div>
      <div class="sp-week-grid">
        <div class="sp-week-headers" id="weekHeadersC"></div>
        <div class="sp-week-exams" id="weekExamsC"></div>
        <div class="sp-week-body">
          <div class="sp-week-cols-bg" id="weekColsBgC"></div>
          <div class="sp-week-bars" id="weekBarsC"></div>
        </div>
      </div>
    </div>

    <div class="sp-sidebar-row">
      <div class="sp-card sp-mini-card">
        <div class="sp-mini-nav">
          <button class="sp-nav-btn" onclick="shiftMiniMonth('commission',-1)">‹</button>
          <div class="sp-mini-label" id="miniLabelC"></div>
          <button class="sp-nav-btn" onclick="shiftMiniMonth('commission',1)">›</button>
        </div>
        <div class="sp-mini-grid" id="miniGridC"></div>
      </div>
      <div class="sp-card sp-list-card">
        <div class="sp-list-card-title">✏️ 커미션 목록</div>
        <div class="sp-exam-list" id="examListSideC"></div>
      </div>
    </div>
  </div>
</div>

<input type="file" id="materialFileInput" accept="image/*" style="display:none">

<!-- 학습/커미션 일정 모달 (공용) -->
<div class="sp-modal-bg" id="scheduleModalBg">
  <div class="sp-modal">
    <h3 id="scheduleModalTitle">일정 추가</h3>
    <div class="sp-field"><label>제목</label><input type="text" id="scheduleTitleInput" placeholder="예: 수학 복습"></div>
    <div class="sp-date-row">
      <div class="sp-field"><label>시작일</label><input type="date" id="scheduleStartInput"></div>
      <div class="sp-field"><label>종료일</label><input type="date" id="scheduleEndInput"></div>
    </div>
    <div class="sp-field">
      <label>색상</label>
      <div class="sp-color-row" id="scheduleColorRow"></div>
    </div>
    <div class="sp-modal-actions">
      <button class="sp-btn danger" id="scheduleDeleteBtn" style="display:none" onclick="deleteScheduleFromModal()">삭제</button>
      <div style="flex:1"></div>
      <button class="sp-btn ghost" onclick="closeModal('scheduleModalBg')">취소</button>
      <button class="sp-btn primary" onclick="saveScheduleFromModal()">저장</button>
    </div>
  </div>
</div>

<!-- 시험/마감 모달 (공용) -->
<div class="sp-modal-bg" id="itemModalBg">
  <div class="sp-modal">
    <h3 id="itemModalTitle">등록</h3>
    <div class="sp-field"><label id="itemTitleLabel">이름</label><input type="text" id="itemTitleInput" placeholder="예: 중간고사"></div>
    <div class="sp-field"><label>날짜</label><input type="date" id="itemDateInput"></div>
    <div class="sp-modal-actions">
      <button class="sp-btn danger" id="itemDeleteBtn" style="display:none" onclick="deleteItemFromModal()">삭제</button>
      <div style="flex:1"></div>
      <button class="sp-btn ghost" onclick="closeModal('itemModalBg')">취소</button>
      <button class="sp-btn primary examclr" onclick="saveItemFromModal()">저장</button>
    </div>
  </div>
</div>

<!-- 설정 모달 (마스코트 이미지 / 말풍선 색 / 대사 / 캘린더 테마) -->
<div class="sp-modal-bg" id="settingsModalBg">
  <div class="sp-modal">
    <h3>⚙️ 캐릭터 &amp; 캘린더 설정</h3>

    <div class="sp-field">
      <label>떠다니는 마스코트 이미지</label>
      <div class="sp-settings-row">
        <img class="sp-mascot-preview" id="mascotPreview" src="" alt="마스코트 미리보기">
        <div class="sp-settings-btns">
          <button class="sp-mini-btn" onclick="document.getElementById('mascotFileInput').click()">이미지 변경</button>
          <button class="sp-mini-btn" onclick="resetMascotImage()">기본 이미지로 되돌리기</button>
        </div>
      </div>
    </div>
    <input type="file" id="mascotFileInput" accept="image/*" style="display:none">

    <div class="sp-field">
      <label>말풍선 색상</label>
      <div class="sp-settings-row">
        <div style="display:flex;flex-direction:column;gap:3px;font-size:11px;color:#888">
          배경색
          <input type="color" id="bubbleBgInput" value="#ffffff">
        </div>
        <div style="display:flex;flex-direction:column;gap:3px;font-size:11px;color:#888">
          글자색
          <input type="color" id="bubbleTextInput" value="#333333">
        </div>
      </div>
    </div>

    <div class="sp-field">
      <label>마스코트 대사 (한 줄에 하나씩)</label>
      <textarea class="sp-msg-textarea" id="messagesTextarea" placeholder="오늘 공부는 했나요?&#10;오늘 진도 나갔어요?"></textarea>
    </div>

    <div class="sp-field">
      <label>캘린더 색상 테마</label>
      <div class="sp-theme-grid" id="themeGrid"></div>
    </div>

    <div class="sp-modal-actions">
      <div style="flex:1"></div>
      <button class="sp-btn ghost" onclick="cancelSettingsModal()">취소</button>
      <button class="sp-btn primary" onclick="saveSettingsFromModal()">저장</button>
    </div>
  </div>
</div>

<!-- 라이트박스 (시험/커미션 자료 · 인증사진 공용) -->
<div class="sp-lightbox-bg" id="lightboxBg">
  <img id="lightboxImg" src="" alt="">
  <div class="sp-lightbox-actions">
    <button class="sp-lb-close" onclick="closeLightbox()">닫기</button>
    <button class="sp-lb-replace" id="lightboxReplaceBtn" style="display:none">다시 업로드</button>
  </div>
</div>

function pad(n){return String(n).padStart(2,'0');}
function fmtDate(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function parseDate(s){const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);}
function todayStr(){return fmtDate(new Date());}
function getWeekStart(d){const s=new Date(d);s.setDate(d.getDate()-d.getDay());s.setHours(0,0,0,0);return s;}
function addDays(d,n){const r=new Date(d);r.setDate(r.getDate()+n);return r;}
function diffDays(a,b){return Math.round((b-a)/86400000);}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function hexToRgba(hex,a){
  const h=hex.replace('#','');
  const r=parseInt(h.substring(0,2),16),g=parseInt(h.substring(2,4),16),b=parseInt(h.substring(4,6),16);
  return `rgba(${r},${g},${b},${a})`;
}

function applyTheme(key){
  const t = THEME_PRESETS[key] || THEME_PRESETS.warmgray;
  const r = document.documentElement.style;
  r.setProperty('--accent', t.accent);
  r.setProperty('--accent-light', t.accentLight);
  r.setProperty('--page-bg', t.pageBg);
  r.setProperty('--border-col', t.border);
  r.setProperty('--col-bg', t.colBg);
  r.setProperty('--today-bg', t.todayBg);
  r.setProperty('--exam-col', t.examCol);
  r.setProperty('--exam-light', t.examLight);
}

onAuthStateChanged(auth, async (user)=>{
  if(!user){ location.href='index.html'; return; }
  currentUser = user;

  const setSnap = await getDoc(doc(db,'users',currentUser.uid,'settings','studySettings'));
  studySettings = setSnap.exists()? setSnap.data() : {};
  applyTheme(studySettings.theme || 'warmgray');

  await Promise.all(Object.keys(SECTIONS).map(loadAllFor));
  Object.keys(SECTIONS).forEach(renderAllFor);

  Object.keys(SECTIONS).forEach(key=>{
    const S=SECTIONS[key];
    onSnapshot(collection(db,'users',currentUser.uid,S.scheduleCollection),(snap)=>{
      S.state.scheduleEvents = snap.docs.map(d=>({id:d.id,...d.data()}));
      renderWeek(key); renderMini(key);
    });
    onSnapshot(collection(db,'users',currentUser.uid,S.itemCollection),(snap)=>{
      S.state.items = snap.docs.map(d=>({id:d.id,...d.data()}));
      renderWeek(key); renderMini(key); renderListSide(key);
    });
    if(S.hasMaterial){
      onSnapshot(doc(db,'users',currentUser.uid,'settings',S.materialDocId),(snap)=>{
        S.state.materialDoc = snap.exists()? snap.data() : null;
        renderMaterialBtn(key);
      });
    }
  });

  onSnapshot(doc(db,'users',currentUser.uid,'settings','studySettings'),(snap)=>{
    studySettings = snap.exists()? snap.data() : {};
    applyTheme(studySettings.theme || 'warmgray');
  });
});

async function loadAllFor(key){
  const S=SECTIONS[key];
  const [schSnap, itemSnap, matSnap] = await Promise.all([
    getDocs(collection(db,'users',currentUser.uid,S.scheduleCollection)),
    getDocs(collection(db,'users',currentUser.uid,S.itemCollection)),
    S.hasMaterial ? getDoc(doc(db,'users',currentUser.uid,'settings',S.materialDocId)) : Promise.resolve(null)
  ]);
  S.state.scheduleEvents = schSnap.docs.map(d=>({id:d.id,...d.data()}));
  S.state.items = itemSnap.docs.map(d=>({id:d.id,...d.data()}));
  S.state.materialDoc = (S.hasMaterial && matSnap && matSnap.exists())? matSnap.data() : null;
}
function renderAllFor(key){ renderWeek(key); renderMini(key); renderListSide(key); if(SECTIONS[key].hasMaterial)renderMaterialBtn(key); }

/* ---------------- 주간 캘린더 ---------------- */
window.shiftWeek=function(key,dir){ const st=SECTIONS[key].state; st.weekStart=addDays(st.weekStart,dir*7); renderWeek(key); renderMini(key); };
window.goToday=function(key){
  const st=SECTIONS[key].state;
  st.weekStart=getWeekStart(new Date());
  st.miniMonth=new Date(new Date().getFullYear(),new Date().getMonth(),1);
  renderWeek(key); renderMini(key);
};

function renderWeek(key){
  const S=SECTIONS[key], st=S.state, d=S.dom;
  const weekStart=st.weekStart, weekEnd=addDays(weekStart,6);
  const weekDates = Array.from({length:7},(_,i)=>addDays(weekStart,i));
  document.getElementById(d.weekLabel).textContent =
    `${weekStart.getMonth()+1}.${weekStart.getDate()} - ${weekEnd.getMonth()+1}.${weekEnd.getDate()}`;

  const today = todayStr();
  document.getElementById(d.weekHeaders).innerHTML = weekDates.map((dt,i)=>{
    const k=fmtDate(dt);
    const cls = ['sp-day-head'];
    if(i===0)cls.push('sun'); if(i===6)cls.push('sat'); if(k===today)cls.push('today');
    return `<div class="${cls.join(' ')}"><div>${DAYS[i]}</div><div class="dnum">${dt.getDate()}</div></div>`;
  }).join('');

  document.getElementById(d.weekColsBg).innerHTML = weekDates.map((dt)=>{
    const k=fmtDate(dt);
    const isToday = k===today;
    return `<div class="sp-week-col-bg${isToday?' today-col':''}" onclick="openScheduleModal('${key}',null,'${k}','${k}')"></div>`;
  }).join('');

  document.getElementById(d.weekExams).innerHTML = weekDates.map((dt)=>{
    const k=fmtDate(dt);
    const items = st.items.filter(e=>e.date===k);
    if(items.length===0) return `<div></div>`;
    return `<div>${items.map(it=>{
      const overdue = !it.taken && it.date<today;
      const cls=['sp-exam-pill']; if(it.taken)cls.push('done'); if(overdue)cls.push('overdue');
      return `<div class="${cls.join(' ')}" onclick="openItemModal('${key}','${it.id}')">📌 ${escapeHtml(it.title)}${it.taken?' ✓':''}</div>`;
    }).join('')}</div>`;
  }).join('');

  const relevant = st.scheduleEvents.filter(e=>{
    return !(parseDate(e.end) < weekStart || parseDate(e.start) > weekEnd);
  }).sort((a,b)=> a.start<b.start?-1:1);

  const lanes = [];
  const placed = [];
  relevant.forEach(ev=>{
    const s = parseDate(ev.start), e = parseDate(ev.end);
    const startIdx = Math.max(0, diffDays(weekStart, s));
    const endIdx = Math.min(6, diffDays(weekStart, e));
    let laneIdx = lanes.findIndex(l=>l < startIdx);
    if(laneIdx===-1){ laneIdx = lanes.length; lanes.push(endIdx); }
    else lanes[laneIdx]=endIdx;
    placed.push({ev,startIdx,endIdx,laneIdx,contLeft: s<weekStart, contRight: e>weekEnd});
  });

  const barsEl = document.getElementById(d.weekBars);
  if(placed.length===0){
    barsEl.innerHTML = `<div style="grid-column:1/-1" class="sp-empty-hint">이 주에는 등록된 ${S.scheduleLabel}이 없어요. 빈 칸을 눌러 추가해보세요.</div>`;
  } else {
    barsEl.innerHTML = placed.map(p=>{
      const cls=['sp-bar']; if(p.contLeft)cls.push('cont-left'); if(p.contRight)cls.push('cont-right');
      const bg = hexToRgba(p.ev.color||SCHEDULE_COLORS[0], BAR_ALPHA);
      const border = p.ev.color||SCHEDULE_COLORS[0];
      return `<div class="${cls.join(' ')}" style="grid-column:${p.startIdx+1} / ${p.endIdx+2};grid-row:${p.laneIdx+1};background:${bg};border-color:${border}"
        onclick="openScheduleModal('${key}','${p.ev.id}')">${p.contLeft?'◂ ':''}${escapeHtml(p.ev.title)}${p.contRight?' ▸':''}</div>`;
    }).join('');
  }
}

/* ---------------- 미니 월간 캘린더 ---------------- */
window.shiftMiniMonth=function(key,dir){
  const st=SECTIONS[key].state;
  st.miniMonth=new Date(st.miniMonth.getFullYear(),st.miniMonth.getMonth()+dir,1);
  renderMini(key);
};

function renderMini(key){
  const S=SECTIONS[key], st=S.state, d=S.dom;
  document.getElementById(d.miniLabel).textContent = `${st.miniMonth.getFullYear()}.${pad(st.miniMonth.getMonth()+1)}`;
  const first = new Date(st.miniMonth.getFullYear(),st.miniMonth.getMonth(),1);
  const startPad = first.getDay();
  const gridStart = addDays(first,-startPad);
  const today = todayStr();
  const wkStartStr = fmtDate(st.weekStart), wkEndStr = fmtDate(addDays(st.weekStart,6));

  let html = DAYS.map(dd=>`<div class="sp-mini-dow">${dd}</div>`).join('');
  for(let i=0;i<42;i++){
    const dt = addDays(gridStart,i);
    const k = fmtDate(dt);
    const dim = dt.getMonth()!==st.miniMonth.getMonth();
    const cls=['sp-mini-cell']; if(dim)cls.push('dim'); if(k===today)cls.push('today');
    if(k>=wkStartStr && k<=wkEndStr && k!==today)cls.push('in-week');
    const hasItem = st.items.some(e=>e.date===k);
    const hasSchedule = st.scheduleEvents.some(e=>k>=e.start && k<=e.end);
    let dots='';
    if(hasItem || hasSchedule){
      dots = `<div class="sp-mini-dots">${hasItem?'<div class="sp-mini-dot" style="background:var(--exam-col)"></div>':''}${hasSchedule?'<div class="sp-mini-dot" style="background:var(--accent)"></div>':''}</div>`;
    }
    html += `<div class="${cls.join(' ')}" onclick="jumpToDate('${key}','${k}')">${dt.getDate()}${dots}</div>`;
  }
  document.getElementById(d.miniGrid).innerHTML = html;
}
window.jumpToDate=function(key,k){
  const st=SECTIONS[key].state;
  st.weekStart = getWeekStart(parseDate(k));
  st.miniMonth = new Date(parseDate(k).getFullYear(), parseDate(k).getMonth(),1);
  renderWeek(key); renderMini(key);
};

/* ---------------- 사이드 목록(시험/마감) ---------------- */
function renderListSide(key){
  const S=SECTIONS[key], st=S.state, d=S.dom;
  const today = todayStr();
  const sorted = [...st.items].sort((a,b)=> a.date<b.date?-1:1);
  const el = document.getElementById(d.listSide);
  if(sorted.length===0){ el.innerHTML = `<div class="sp-empty-small">등록된 ${S.itemLabel} 항목이 없어요</div>`; return; }
  el.innerHTML = sorted.map(e=>{
    const overdue = !e.taken && e.date<today;
    const badge = e.taken? `<span class="sp-badge done">인증완료</span>` : overdue? `<span class="sp-badge overdue">미인증</span>` : `<span class="sp-badge pending">예정</span>`;
    return `<div class="sp-exam-item">
      <div class="ei-top">
        <div>
          <div class="ei-title" style="cursor:pointer" onclick="openItemModal('${key}','${e.id}')">${escapeHtml(e.title)}</div>
          <div class="ei-date">${e.date}</div>
        </div>
        ${badge}
      </div>
      <div class="ei-actions">
        ${e.taken
          ? `<img class="ei-thumb" src="${e.proofImg}" onclick="openLightbox('${e.proofImg}',null)">`
          : `<button class="ei-proof-btn" onclick="uploadProof('${key}','${e.id}')">🖼 ${S.proofLabel} 업로드</button>`}
      </div>
    </div>`;
  }).join('');
}

window.openScheduleModal=function(key, id, start, end){
  activeSectionKey = key;
  const S = SECTIONS[key];

  const startInput=document.getElementById('scheduleStartInput');

    const ev = S.state.scheduleEvents.find(e=>e.id===id);
    document.getElementById('scheduleModalTitle').textContent = S.scheduleLabel+' 수정';
    titleInput.value = ev.title; startInput.value=ev.start; endInput.value=ev.end;
    selectedScheduleColor = ev.color||SCHEDULE_COLORS[0];
    delBtn.style.display='';
  } else {
    document.getElementById('scheduleModalTitle').textContent = S.scheduleLabel+' 추가';
    titleInput.value='';
    startInput.value = start || todayStr();
    endInput.value = end || start || todayStr();
    selectedScheduleColor = SCHEDULE_COLORS[0];
    delBtn.style.display='none';
  }
  document.getElementById('scheduleColorRow').innerHTML = SCHEDULE_COLORS.map(c=>
    `<div class="sp-color-dot${c===selectedScheduleColor?' sel':''}" data-color="${c}" style="background:${c}" onclick="pickScheduleColor('${c}')"></div>`
  ).join('');

window.saveScheduleFromModal=async function(){

  const id = editingScheduleId || (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()));
  const data = {title,start,end,color:selectedScheduleColor};
  await setDoc(doc(db,'users',currentUser.uid,S.scheduleCollection,id), data);

/* ---------------- 이미지 압축 ---------------- */
function compressImage(file,maxDim=1400,quality=0.8){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=(e)=>{
      const img=new Image();
      img.onload=()=>{
        let w=img.width,h=img.height;
        if(w>h){ if(w>maxDim){h=Math.round(h*maxDim/w);w=maxDim;} }
        else { if(h>maxDim){w=Math.round(w*maxDim/h);h=maxDim;} }
        const canvas=document.createElement('canvas');
        canvas.width=w;canvas.height=h;
        const ctx=canvas.getContext('2d');
        ctx.drawImage(img,0,0,w,h);
        let dataUrl=canvas.toDataURL('image/jpeg',quality);
        if(dataUrl.length>1800000){ dataUrl=canvas.toDataURL('image/jpeg',0.5); }
        resolve(dataUrl);
      };
      img.onerror=reject;
      img.src=e.target.result;
    };
    reader.onerror=reject;
    reader.readAsDataURL(file);
  });
}

    .split('\n').map(s=>s.trim()).filter(Boolean);
