<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>포트폴리오</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #FFFFFF;
    --sidebar: #F7F6F4;
    --placeholder: #F7F6F4;
    --ink: #1C1C1C;
    --ink-dim: #767267;
    --line: #E7E4DD;
    --accent: #C4622D;
    --sidebar-text: #1C1C1C;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:'Pretendard', sans-serif;
    color: var(--ink);
    background: var(--bg);
  }
  .app{ display:flex; min-height:100vh; }

  /* ================= SIDEBAR ================= */
  .sidebar{
    width: 240px; flex-shrink:0;
    background: var(--sidebar);
    border-right: 1px solid var(--line);
    padding: 28px 0 0;
    position: sticky; top:0; height:100vh; overflow-y:auto;
    display:flex; flex-direction:column;
  }
  .sidebar-nav{ flex:1; }
  .sidebar-settings{
    margin-top: auto; padding: 14px 24px;
    display:flex; justify-content:flex-start; position:relative;
  }
  .gear-btn{
    width: 30px; height: 30px; border-radius: 6px;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; color: color-mix(in srgb, var(--sidebar-text) 65%, transparent); font-size:15px;
  }
  .gear-btn:hover{ background: #EFECE4; color: var(--sidebar-text); }
  .save-btn{
    width: 30px; height: 30px; border-radius: 6px;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; color: color-mix(in srgb, var(--sidebar-text) 65%, transparent); font-size:14px; margin-left:6px;
  }
  .save-btn:hover{ background: #EFECE4; color: var(--sidebar-text); }
  .settings-popover{
    display:none; position:absolute; left:24px; bottom:calc(100% + 8px);
    background:#fff; border:1px solid var(--line); border-radius:12px;
    padding:12px; box-shadow:0 6px 20px rgba(0,0,0,.15);
    min-width:180px; z-index:50;
  }
  body.is-owner .settings-popover.open{ display:flex; flex-direction:column; gap:10px; }
  .settings-row{ display:flex; align-items:center; justify-content:space-between; gap:12px; font-size:13px; color: var(--ink); }
  .settings-row input[type="color"]{
    width:28px; height:28px; padding:0; border:1px solid var(--line); border-radius:6px; cursor:pointer; background:none;
  }
  .owner-only{ display:none; }
  body.is-owner .owner-only{ display:flex; }
  body.is-owner #login-btn{ display:none; }
  .sidebar .name{
    font-size:16px; font-weight:600; padding: 0 24px 24px;
    border-bottom: 1px solid var(--line); margin-bottom: 12px;
    color: var(--sidebar-text);
  }
  .nav-item{
    display:flex; justify-content:space-between; align-items:center;
    padding: 11px 24px; font-size:14px; cursor:pointer; color: var(--sidebar-text);
    font-weight: 500;
  }
  .nav-item:hover{ background: color-mix(in srgb, var(--sidebar-text) 12%, transparent); }
  .nav-item.active{ color: var(--accent); }
  .nav-item .arrow{ font-size:11px; color: color-mix(in srgb, var(--sidebar-text) 60%, transparent); transition: transform 0.15s; }
  .nav-item.open .arrow{ transform: rotate(90deg); }

  .submenu{ display:none; padding: 2px 0 10px; }
  .submenu.open{ display:block; }
  .sub-item{
    display:flex; align-items:center; justify-content:space-between;
    padding: 8px 12px 8px 38px; font-size:13px; color: color-mix(in srgb, var(--sidebar-text) 65%, transparent); cursor:pointer;
  }
  .sub-item:hover{ color: var(--sidebar-text); }
  .sub-item.active{ color: var(--accent); font-weight:500; }
  .sub-item .sub-item-title{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .sub-item-del{
    opacity:0; pointer-events:none; transition:opacity .15s;
    color: color-mix(in srgb, var(--sidebar-text) 55%, transparent); font-size:13px; padding:2px 6px; flex-shrink:0;
  }
  body.is-owner .sub-item:hover .sub-item-del{ opacity:1; pointer-events:auto; }
  .sub-item-del:hover{ color: var(--accent); }
  .sub-item-add{
    padding: 8px 24px 8px 38px; font-size:14px; color: color-mix(in srgb, var(--sidebar-text) 50%, transparent); cursor:pointer;
  }
  .sub-item-add:hover{ color: var(--accent); }

  /* ---- Editable text ---- */
  .editable{ cursor: text; border-radius:3px; }
  .editable:hover{ outline: 1px dashed var(--line); outline-offset:2px; }
  .editable[contenteditable="true"]{
    outline: 1px dashed var(--accent); outline-offset:2px;
    background: rgba(196,98,45,0.06);
  }
  .edit-toast{
    position:fixed; bottom:24px; left:50%; transform: translateX(-50%);
    background: var(--ink); color:#fff; font-size:12px; padding:9px 16px;
    border-radius:20px; opacity:0; pointer-events:none; transition: opacity 0.2s;
    z-index:10;
  }
  .edit-toast.show{ opacity:1; }

  /* ================= MAIN ================= */
  .main{ flex:1; min-width:0; }
  .view{ display:none; }
  .view.active{ display:block; }

  /* ---- Page title row (제목 + 이미지 추가 버튼) ---- */
  .title-row{ display:flex; align-items:center; gap:10px; }
  .add-img-btn{
    width: 26px; height: 26px; border-radius: 50%;
    border: 1px solid var(--line); background: #fff;
    display:flex; align-items:center; justify-content:center;
    font-size:16px; line-height:1; color: var(--ink-dim); cursor:pointer; flex-shrink:0;
  }
  .add-img-btn:hover{ background:#F0ECE4; color:var(--accent); border-color:var(--accent); }

  /* ---- About view: hero image (업로드 / 드래그 이동 / 휠 확대) ---- */
  .hero-img-wrap{
    height: 340px; background: var(--placeholder);
    border-bottom: 1px solid var(--line);
    position: relative; overflow: hidden;
  }
  .hero-img-empty{
    position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px;
    color: var(--ink-dim); font-size:13px; pointer-events:none;
  }
  .hero-img-wrap.has-image .hero-img-empty{ display:none; }
  .hero-img-el{
    width:100%; height:100%; object-fit:contain; display:none;
    transform-origin:center center; touch-action:none;
  }
  .hero-img-wrap.has-image .hero-img-el{ display:block; }

  .hero-btn-row{
    position:absolute; top:12px; right:12px; z-index:5; gap:8px;
    opacity:0; pointer-events:none; transition:opacity .15s;
  }
  body.is-owner .hero-img-wrap:hover .hero-btn-row{ opacity:1; pointer-events:auto; }
  .hero-img-wrap.adjusting .hero-btn-row{ display:none; }
  .hero-mini-btn{
    background: rgba(255,255,255,.92); border:1px solid var(--line); border-radius:16px;
    font-size:11px; font-weight:700; color: var(--ink-dim); padding:5px 11px;
    cursor:pointer; user-select:none; white-space:nowrap;
  }
  .hero-mini-btn:hover{ background:#fff; color:var(--accent); }

  .hero-img-wrap.adjusting{ cursor:grab; }
  .hero-img-wrap.adjusting.dragging{ cursor:grabbing; }

  .hero-adjust-hint{
    position:fixed; top:16px; left:16px; z-index:9999; display:none;
    background:rgba(0,0,0,.6); color:#fff; font-size:11px; padding:6px 12px; border-radius:14px; pointer-events:none;
  }
  .hero-adjust-hint.open{ display:block; }
  .hero-adjust-panel{
    position:fixed; left:16px; bottom:16px; z-index:9999; width:280px; max-width:calc(100vw - 32px);
    display:none; align-items:center; gap:8px;
    background:rgba(255,255,255,.97); border:1px solid var(--line); border-radius:12px; padding:9px 11px;
    box-shadow:0 4px 18px rgba(0,0,0,.15);
  }
  .hero-adjust-panel.open{ display:flex; }
  .hero-zoom-label{ font-size:11px; color:var(--ink-dim); white-space:nowrap; }
  .hero-adjust-panel input[type=range]{ flex:1; accent-color:var(--accent); cursor:pointer; }
  .hero-adjust-done{
    background:var(--accent); color:#fff; border:none; border-radius:8px;
    font-size:12px; font-weight:700; padding:7px 14px; cursor:pointer; white-space:nowrap;
  }

  .info{ max-width: 960px; margin: 0 auto; padding: 40px 48px; }
  .info-top{ text-align:center; margin: 0 auto 36px; max-width: 640px; }
  .info h1{ font-size: 22px; margin-bottom: 6px; }
  .info .role{ font-size:14px; color: var(--ink-dim); margin-bottom: 24px; }
  .info .bio{ font-size:14px; line-height:1.75; color: var(--ink); white-space: pre-line; }

  .career-contact-row{ display:flex; gap:40px; align-items:flex-start; }
  .career{ flex:0 0 auto; }
  .career .title-row{ margin-bottom:14px; }
  .career h2{ font-size:14px; color: var(--ink-dim); font-weight:600; }
  .career .add-img-btn{ width:20px; height:20px; font-size:13px; }

  #careerRows{
    display:grid; grid-template-columns: 110px max-content 22px;
    column-gap:20px; border-bottom:1px solid var(--line);
  }
  .career-row{ display:contents; }
  #careerRows .period{ color: var(--ink-dim); font-size:13px; border-top:1px solid var(--line); padding:12px 0; align-self:center; }
  #careerRows .text{ font-size:14px; white-space:nowrap; border-top:1px solid var(--line); padding:12px 0; align-self:center; }
  #careerRows .career-del-btn{
    border-top:1px solid var(--line); padding:12px 0; align-self:center;
    cursor:pointer; color: var(--ink-dim); font-size:14px; text-align:center;
  }
  #careerRows .career-del-btn:hover{ color: var(--accent); }

  .contact-links{
    padding-left:40px; border-left:1px solid var(--line);
    min-width:170px; display:flex; flex-direction:column; gap:14px; flex-shrink:0;
  }
  .contact-links h2{ font-size:14px; color: var(--ink-dim); font-weight:600; }
  .contact-mail-row{ display:flex; align-items:center; gap:8px; font-size:13px; color: var(--ink); }
  .mail-icon{ display:flex; align-items:center; color: var(--ink-dim); flex-shrink:0; }
  .copy-btn{
    width:26px; height:26px; border-radius:6px; border:1px solid var(--line); background:#fff;
    display:flex; align-items:center; justify-content:center; cursor:pointer; color: var(--ink-dim); flex-shrink:0;
  }
  .copy-btn:hover{ background:#F0ECE4; color:var(--accent); border-color:var(--accent); }
  .contact-icons{ display:flex; gap:12px; }
  .contact-icon-wrap{ position:relative; }
  .contact-icon{
    width:40px; height:40px; border-radius:10px; border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center; color:var(--ink);
    text-decoration:none; transition: all .15s;
  }
  .contact-icon:hover{ background:#F0ECE4; border-color:var(--accent); color:var(--accent); }
  .contact-edit-btn{
    position:absolute; top:-6px; right:-6px; width:18px; height:18px; border-radius:50%;
    background:var(--accent); color:#fff; font-size:10px; align-items:center; justify-content:center;
    opacity:0; pointer-events:none; transition:opacity .15s; cursor:pointer;
  }
  body.is-owner .contact-icon-wrap:hover .contact-edit-btn{ opacity:1; pointer-events:auto; }

  /* ---- Webtoon view (long vertical scroll, 690px 고정폭) ---- */
  .work-header{
    padding: 28px 48px; border-bottom: 1px solid var(--line);
    display:flex; justify-content:space-between; align-items:center;
    position:sticky; top:0; background: var(--bg); z-index:2;
  }
  .work-header h1{ font-size:17px; }

  .panel-scroll{ width: 690px; max-width: 100%; margin: 0 auto; padding: 0 0 60px; }
  .panel-img-wrap{ position:relative; border-bottom: 1px solid var(--line); }
  .panel-img-wrap img{ width:100%; display:block; cursor: zoom-in; }
  .panel-empty-hint{ padding: 60px 20px; text-align:center; color: var(--ink-dim); font-size:13px; }

  .img-action-btn{
    position:absolute; top:10px; width:26px; height:26px; border-radius:50%;
    background:rgba(0,0,0,.55); color:#fff; display:flex; align-items:center; justify-content:center;
    font-size:13px; cursor:pointer; opacity:0; pointer-events:none; transition:opacity .15s;
  }
  .img-delete-btn{ right:10px; }
  .img-edit-btn{ right:44px; }
  body.is-owner .panel-img-wrap:hover .img-action-btn{ opacity:1; pointer-events:auto; }

  /* ---- Illustration / 기타 작업 view (grid) ---- */
  .grid-view{ padding: 40px 48px; }
  .grid-view h1{ font-size:17px; }
  .illust-grid{ display:grid; grid-template-columns: repeat(6, 1fr); gap: 12px; margin-top:24px; }
  .illust-grid .img-item{
    position:relative; aspect-ratio: 4/5; border-radius:8px; overflow:hidden; border:1px solid var(--line);
    background: var(--placeholder);
  }
  .illust-grid .img-item img{ width:100%; height:100%; object-fit:cover; display:block; cursor:zoom-in; }
  .illust-grid .img-item .img-delete-btn{ top:8px; right:8px; }
  .illust-grid .img-item .img-edit-btn{ top:8px; right:38px; }
  body.is-owner .illust-grid .img-item:hover .img-action-btn{ opacity:1; pointer-events:auto; }

  /* ================= LIGHTBOX (웹툰 이미지 크게 보기) ================= */
  .lightbox{
    position:fixed; inset:0; background:rgba(0,0,0,.88); z-index:99999;
    display:none; align-items:center; justify-content:center; overflow:hidden;
  }
  .lightbox.open{ display:flex; }
  .lightbox-img{
    max-width:90vw; max-height:85vh; transform-origin:center center;
    touch-action:none; cursor:grab; user-select:none;
  }
  .lightbox-img.dragging{ cursor:grabbing; }
  .lightbox-close{
    position:absolute; top:20px; right:28px; color:#fff; font-size:30px; cursor:pointer; line-height:1;
  }
  .lightbox-controls{
    position:absolute; bottom:26px; left:50%; transform:translateX(-50%);
    display:flex; gap:6px; align-items:center; background:rgba(255,255,255,.12);
    padding:8px 10px; border-radius:24px;
  }
  .lb-btn{
    color:#fff; font-size:14px; cursor:pointer; padding:6px 12px; user-select:none;
    min-width:36px; text-align:center; border-radius:16px;
  }
  .lb-btn:hover{ background:rgba(255,255,255,.18); }

  /* ---- 초기 로딩 화면 (깜빡임 방지) ---- */
  .page-loader{
    position:fixed; inset:0; background:var(--bg); z-index:100000;
    display:flex; align-items:center; justify-content:center;
    transition: opacity .25s ease;
  }
  .page-loader.hide{ opacity:0; pointer-events:none; }
  .page-loader-spinner{
    width:26px; height:26px; border-radius:50%;
    border:3px solid var(--line); border-top-color:var(--accent);
    animation: page-loader-spin 0.8s linear infinite;
  }
  @keyframes page-loader-spin{ to{ transform:rotate(360deg); } }
</style>
</head>
<body>

<div class="page-loader" id="pageLoader"><div class="page-loader-spinner"></div></div>

<div class="app">

  <!-- ================= SIDEBAR ================= -->
  <aside class="sidebar">
    <div class="name editable" data-field="sidebarName">두목</div>

    <div class="sidebar-nav">
      <div class="nav-item active" data-view="about"><span class="editable" data-field="navAbout">소개</span></div>

      <div class="nav-item" id="webtoon-toggle">
        <span class="editable" data-field="navWebtoon">웹툰 작업</span> <span class="arrow">▸</span>
      </div>
      <div class="submenu" id="webtoon-submenu">
        <div class="sub-item-add owner-only" id="workAddBtn" title="작품 추가">＋</div>
      </div>

      <div class="nav-item" data-view="illust"><span class="editable" data-field="navIllust">일러스트 작업</span></div>
      <div class="nav-item" data-view="character"><span class="editable" data-field="navCharacter">기타 작업</span></div>
    </div>

    <div class="sidebar-settings">
      <div class="gear-btn" id="login-btn" title="관리자 로그인">🔒</div>
      <div class="gear-btn owner-only" id="gear-btn" title="설정">⚙</div>
      <div class="save-btn owner-only" id="save-btn" title="Firestore에 저장 (Ctrl+S)">☁</div>

      <div class="settings-popover" id="settingsPopover">
        <div class="settings-row">
          <span>배경색</span>
          <input type="color" id="sidebar-color" value="#F7F6F4">
        </div>
        <div class="settings-row">
          <span>글자색</span>
          <input type="color" id="sidebar-text-color" value="#1C1C1C">
        </div>
        <div class="settings-row">
          <span>포인트색</span>
          <input type="color" id="accent-color" value="#C4622D">
        </div>
      </div>
    </div>
  </aside>

  <!-- ================= MAIN ================= -->
  <main class="main">

    <!-- 소개 -->
    <section class="view active" data-view="about">
      <div class="hero-img-wrap" id="heroImgWrap">
        <div class="hero-img-empty" id="heroImgEmpty">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8.5" cy="10" r="1.5"/><path d="M21 16l-5.5-5.5L9 17"/></svg>
          <div>대표 이미지</div>
        </div>
        <img class="hero-img-el" id="heroImgEl" alt="대표 이미지">
        <div class="hero-btn-row owner-only" id="heroBtnRow">
          <div class="hero-mini-btn" id="heroAdjustBtn">배치수정</div>
          <div class="hero-mini-btn" id="heroUploadBtn">이미지 변경</div>
        </div>
        <div class="hero-adjust-hint" id="heroAdjustHint">드래그로 이동 · 휠로 확대/축소</div>
        <div class="hero-adjust-panel" id="heroAdjustPanel">
          <span class="hero-zoom-label">크기</span>
          <input type="range" id="heroZoomSlider" min="100" max="400" value="100">
          <button class="hero-adjust-done" id="heroAdjustDone">완료</button>
        </div>
        <input type="file" id="heroImgInput" accept="image/*" style="display:none">
      </div>
      <div class="info">
        <div class="info-top">
          <h1 class="editable" data-field="aboutName">두목</h1>
          <div class="role editable" data-field="role">웹툰 작가 · 일러스트레이터</div>
          <div class="bio editable" data-field="bio">여기에 간단한 소개글을 적습니다.
예: 웹툰 3편 연재, 프리랜서 일러스트 작업 병행.</div>
        </div>

        <div class="career-contact-row">
          <div class="career">
            <div class="title-row">
              <h2>경력</h2>
              <div class="add-img-btn owner-only" id="careerAddBtn" title="경력 추가">+</div>
            </div>
            <div id="careerRows"></div>
          </div>

          <div class="contact-links">
            <h2>연락처</h2>
            <div class="contact-mail-row">
              <span class="mail-icon">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>
              </span>
              <span class="editable" data-field="contactEmailText">work@example.com</span>
              <div class="copy-btn" id="copyEmailBtn" title="이메일 복사">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
              </div>
            </div>
            <div class="contact-icons">
              <div class="contact-icon-wrap">
                <a class="contact-icon" id="contactInstaLink" href="https://instagram.com/username" target="_blank" title="인스타그램">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.3" cy="6.7" r="0.7" fill="currentColor" stroke="none"/></svg>
                </a>
                <div class="contact-edit-btn owner-only" id="contactInstaEdit" title="인스타그램 링크 수정">✎</div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- 웹툰 작업 페이지들 (동적으로 생성됨) -->
    <div id="workSectionsContainer"></div>

    <!-- 일러스트 작업 -->
    <section class="view" data-view="illust">
      <div class="grid-view">
        <div class="title-row">
          <h1 class="editable" data-field="illustTitle">일러스트 작업</h1>
          <div class="add-img-btn owner-only" data-page="illust" title="이미지 추가">+</div>
        </div>
        <div class="illust-grid" data-page-container="illust"></div>
        <input type="file" class="img-input-hidden" data-page="illust" accept="image/*" multiple style="display:none">
      </div>
    </section>

    <!-- 기타 작업 -->
    <section class="view" data-view="character">
      <div class="grid-view">
        <div class="title-row">
          <h1 class="editable" data-field="characterTitle">기타 작업</h1>
          <div class="add-img-btn owner-only" data-page="character" title="이미지 추가">+</div>
        </div>

<script>
  const OWNER_UID = "JuEfafmoqkc2PsXpMmw4rbc56t12";

  const navItems = document.querySelectorAll('.nav-item[data-view]');
  const webtoonToggle = document.getElementById('webtoon-toggle');
  const webtoonSubmenu = document.getElementById('webtoon-submenu');

  function showView(viewName, work){
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    if(viewName === 'webtoon'){
      const target = document.querySelector(`.view[data-view="webtoon"][data-work="${work}"]`);
      if(target) target.classList.add('active');
    } else {
      const target = document.querySelector(`.view[data-view="${viewName}"]`);
      if(target) target.classList.add('active');
    }
    navItems.forEach(n => n.classList.remove('active'));
    document.querySelectorAll('.sub-item').forEach(s => s.classList.remove('active'));
  }

  navItems.forEach(item => {
    item.addEventListener('click', () => {
      const view = item.getAttribute('data-view');
      showView(view);
      item.classList.add('active');
    });
  });

  webtoonToggle.addEventListener('click', () => {
    webtoonToggle.classList.toggle('open');
    webtoonSubmenu.classList.toggle('open');
  });

  // 기본으로 웹툰 메뉴 펼쳐두기
  webtoonToggle.classList.add('open');
  webtoonSubmenu.classList.add('open');

  // 설정(⚙) 팝오버 열기/닫기
  const gearBtn = document.getElementById('gear-btn');
  const settingsPopover = document.getElementById('settingsPopover');
  gearBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    settingsPopover.classList.toggle('open');
  });
  document.addEventListener('click', (e) => {
    if(settingsPopover.classList.contains('open') && !settingsPopover.contains(e.target) && e.target !== gearBtn){
      settingsPopover.classList.remove('open');
    }
  });
  document.addEventListener('keydown', (e) => {
    if(e.key === 'Escape') settingsPopover.classList.remove('open');
  });

  // 포인트색(액센트) 변경
  document.getElementById('accent-color').addEventListener('input', (e) => {
    document.documentElement.style.setProperty('--accent', e.target.value);
  });

  // 사이드바 배경색 변경 — 배경이 어두우면 글자색을 밝게, 밝으면 어둡게 자동 반전
  function relativeLuminance(hex){
    const c = hex.replace('#', '');
    const r = parseInt(c.substring(0, 2), 16) / 255;
    const g = parseInt(c.substring(2, 4), 16) / 255;
    const b = parseInt(c.substring(4, 6), 16) / 255;
    const lin = v => (v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4));
    return 0.2126 * lin(r) + 0.7152 * lin(g) + 0.0722 * lin(b);
  }
  function contrastTextColor(bgHex){
    return relativeLuminance(bgHex) > 0.5 ? '#1C1C1C' : '#F5F4F1';
  }
  document.getElementById('sidebar-color').addEventListener('input', (e) => {
    const bg = e.target.value;
    document.documentElement.style.setProperty('--sidebar', bg);
    const textColor = contrastTextColor(bg);
    document.documentElement.style.setProperty('--sidebar-text', textColor);
    document.getElementById('sidebar-text-color').value = textColor;
  });

  // 사이드바 글자색 변경
  document.getElementById('sidebar-text-color').addEventListener('input', (e) => {
    document.documentElement.style.setProperty('--sidebar-text', e.target.value);
  });

  // 텍스트 더블클릭으로 수정 (관리자로 로그인했을 때만 동작) — 나중에 추가되는 요소에도 재사용
  let isOwner = false;
  function makeEditable(el){
    el.classList.add('editable');
    el.addEventListener('dblclick', (e) => {
      if(!isOwner) return;
      e.stopPropagation();
      el.setAttribute('contenteditable', 'true');
      el.focus();
      document.execCommand('selectAll', false, null);
    });
    el.addEventListener('blur', () => {
      el.removeAttribute('contenteditable');
    });
    el.addEventListener('keydown', (e) => {
      if(e.key === 'Enter' && !el.classList.contains('bio')){
        e.preventDefault();
        el.blur();
      }
    });
  }
  document.querySelectorAll('.editable').forEach(makeEditable);

  // 사이드바 메뉴 제목 ↔ 해당 페이지 상단 제목: 한쪽을 고치면 다른 쪽도 같이 바뀌게 연동
  function linkTitles(elA, elB){
    if(!elA || !elB) return;
    elA.addEventListener('blur', () => { elB.textContent = elA.textContent; });
    elB.addEventListener('blur', () => { elA.textContent = elB.textContent; });
  }
  linkTitles(document.querySelector('[data-field="navIllust"]'), document.querySelector('[data-field="illustTitle"]'));
  linkTitles(document.querySelector('[data-field="navCharacter"]'), document.querySelector('[data-field="characterTitle"]'));

  const toast = document.createElement('div');
  toast.className = 'edit-toast';
  document.body.appendChild(toast);
  function showToast(msg){
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2200);
  }

  // ---- 경력: 추가 / 삭제 ----
  const careerRowsEl = document.getElementById('careerRows');
  const careerAddBtn = document.getElementById('careerAddBtn');
  const DEFAULT_CAREER = [
    { period: '2023–2024', text: '그 마을엔 축복이 연재' },
    { period: '2024–2025', text: '이시하 · 유봄 연재' },
    { period: '진행중', text: '프리랜서 일러스트 어시스트' }
  ];

  function createCareerRow(period, text){
    const row = document.createElement('div');
    row.className = 'career-row';

    const periodEl = document.createElement('div');
    periodEl.className = 'period';
    periodEl.textContent = period;
    makeEditable(periodEl);

    const textEl = document.createElement('div');
    textEl.className = 'text';
    textEl.textContent = text;
    makeEditable(textEl);

    const delBtn = document.createElement('div');
    delBtn.className = 'career-del-btn owner-only';
    delBtn.title = '삭제';
    delBtn.textContent = '×';
    delBtn.addEventListener('click', () => row.remove());

    row.appendChild(periodEl);
    row.appendChild(textEl);
    row.appendChild(delBtn);
    return row;
  }

  function renderCareerList(list){
    careerRowsEl.innerHTML = '';
    list.forEach(item => careerRowsEl.appendChild(createCareerRow(item.period, item.text)));
  }
  renderCareerList(DEFAULT_CAREER);

  careerAddBtn.addEventListener('click', () => {
    if(!isOwner) return;
    const row = createCareerRow('기간', '내용을 입력하세요');
    careerRowsEl.appendChild(row);
    const textEl = row.querySelector('.text');
    textEl.setAttribute('contenteditable', 'true');
    textEl.focus();
    document.execCommand('selectAll', false, null);
  });

  // ---- 라이트박스 (웹툰 이미지 크게 보기) ----
  const lightbox = document.getElementById('lightbox');
  const lightboxImg = document.getElementById('lightboxImg');
  const lightboxClose = document.getElementById('lightboxClose');
  let lbScale = 1, lbPos = { x: 0, y: 0 }, lbDrag = null;

  function applyLbTransform(){
    lightboxImg.style.transform = `translate(${lbPos.x}px, ${lbPos.y}px) scale(${lbScale})`;
  }
  function openLightbox(src){
    lightboxImg.src = src;
    lbScale = 1; lbPos = { x: 0, y: 0 };
    applyLbTransform();
    lightbox.classList.add('open');
  }
  function closeLightbox(){
    lightbox.classList.remove('open');
  }
  lightboxClose.addEventListener('click', closeLightbox);
  lightbox.addEventListener('click', (e) => { if(e.target === lightbox) closeLightbox(); });
  document.addEventListener('keydown', (e) => {
    if(e.key === 'Escape' && lightbox.classList.contains('open')) closeLightbox();
  });
  document.getElementById('lbZoomIn').addEventListener('click', () => {
    lbScale = Math.min(4, lbScale + 0.25); applyLbTransform();
  });
  document.getElementById('lbZoomOut').addEventListener('click', () => {
    lbScale = Math.max(1, lbScale - 0.25);
    if(lbScale === 1) lbPos = { x: 0, y: 0 };
    applyLbTransform();
  });
  document.getElementById('lbZoomReset').addEventListener('click', () => {
    lbScale = 1; lbPos = { x: 0, y: 0 }; applyLbTransform();
  });
  lightbox.addEventListener('wheel', (e) => {
    if(!lightbox.classList.contains('open')) return;
    e.preventDefault();
    lbScale = Math.max(1, Math.min(4, lbScale + (e.deltaY < 0 ? 0.2 : -0.2)));
    if(lbScale === 1) lbPos = { x: 0, y: 0 };
    applyLbTransform();
  }, { passive: false });
  lightboxImg.addEventListener('pointerdown', (e) => {
    if(lbScale <= 1) return;
    lbDrag = { startX: e.clientX, startY: e.clientY, startPosX: lbPos.x, startPosY: lbPos.y };
    lightboxImg.classList.add('dragging');
    lightboxImg.setPointerCapture(e.pointerId);
  });
  lightboxImg.addEventListener('pointermove', (e) => {
    if(!lbDrag) return;
    lbPos.x = lbDrag.startPosX + (e.clientX - lbDrag.startX);
    lbPos.y = lbDrag.startPosY + (e.clientY - lbDrag.startY);
    applyLbTransform();
  });
  function endLbDrag(e){
    if(!lbDrag) return;
    lightboxImg.classList.remove('dragging');
    try{ lightboxImg.releasePointerCapture(e.pointerId); }catch(err){}
    lbDrag = null;
  }
  lightboxImg.addEventListener('pointerup', endLbDrag);
  lightboxImg.addEventListener('pointercancel', endLbDrag);
</script>

<script type="module">
  import { initializeApp, getApps, getApp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
  import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-auth.js";
  import { getFirestore, doc, setDoc, onSnapshot, collection, addDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";

  // my-planner 프로젝트와 동일한 Firebase 설정 (index.html의 firebaseConfig를 그대로 복사)
  const firebaseConfig = {
    apiKey: "AIzaSyBkSmyAwRUlpgZBUz0kXqCVoS29dYht7No",
    authDomain: "my-planner-3728c.firebaseapp.com",
    projectId: "my-planner-3728c",
    storageBucket: "my-planner-3728c.firebasestorage.app",
    messagingSenderId: "179812397978",
    appId: "1:179812397978:web:3525714542291e818e0023"
  };

  const app = getApps().length ? getApp() : initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  const provider = new GoogleAuthProvider();

  const CONTENT_DOC = doc(db, 'users', OWNER_UID, 'settings', 'portfolioContent');
  const IMAGES_COLL = collection(db, 'users', OWNER_UID, 'settings', 'portfolioContent', 'images');

  function hidePageLoader(){
    const loader = document.getElementById('pageLoader');
    if(!loader) return;
    loader.classList.add('hide');
    setTimeout(() => loader.remove(), 300);
  }
  setTimeout(hidePageLoader, 4000); // Firestore 응답이 너무 늦을 때를 대비한 안전장치
  const imagesByPage = {};

  function isWebtoonPage(page){
    const container = document.querySelector(`[data-page-container="${page}"]`);
    return !!(container && container.classList.contains('panel-scroll'));
  }

  function renderPageImages(page){
    const container = document.querySelector(`[data-page-container="${page}"]`);
    if(!container) return;
    container.innerHTML = '';
    const list = imagesByPage[page] || [];
    const isGrid = container.classList.contains('illust-grid');
    list.forEach(item => {
      const wrap = document.createElement('div');
      wrap.className = isGrid ? 'img-item' : 'panel-img-wrap';

      const img = document.createElement('img');
      img.src = item.src;
      img.alt = '';
      img.addEventListener('click', () => openLightbox(item.src));

      const editBtn = document.createElement('div');
      editBtn.className = 'img-action-btn img-edit-btn owner-only';
      editBtn.title = '이미지 수정';
      editBtn.textContent = '✎';
      editBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        const input = document.createElement('input');
        input.type = 'file';
        input.accept = 'image/*';
        input.addEventListener('change', async (ev) => {
          const file = ev.target.files && ev.target.files[0];
          if(!file) return;
          try{
            const dataUrl = isWebtoonPage(item.page)
              ? await compressImageOriginal(file, 0.85, 700000)
              : await compressImage(file, 1400, 0.82, 500000);
            await setDoc(doc(IMAGES_COLL, item.id), { src: dataUrl }, { merge: true });
            showToast('이미지가 수정되었습니다.');
          }catch(err){
            console.error(err);
            alert('이미지를 수정하지 못했어요.');
          }
        });
        input.click();
      });

      const delBtn = document.createElement('div');
      delBtn.className = 'img-action-btn img-delete-btn owner-only';
      delBtn.title = '삭제';
      delBtn.textContent = '×';
      delBtn.addEventListener('click', async (e) => {
        e.stopPropagation();
        if(!isOwner){ showToast('로그인이 필요해요.'); return; }
        try{
          await deleteDoc(doc(IMAGES_COLL, item.id));
          showToast('삭제되었습니다.');
        }catch(err){
          console.error('[portfolio] 이미지 삭제 실패:', err);
          showToast('삭제 실패: ' + (err.code || err.message || err));
        }
      });

      wrap.appendChild(img);
      wrap.appendChild(editBtn);
      wrap.appendChild(delBtn);
      container.appendChild(wrap);
    });
  }

  const FIELD_IDS = [
    'sidebarName','navAbout','navWebtoon',
    'navIllust','navCharacter','aboutName','role','bio',
    'illustTitle','characterTitle','contactEmailText'
  ];

  const DEFAULT_WORKS = [
    { id: 'work1', title: '그 마을엔 축복이' },
    { id: 'work2', title: '이시하 · 유봄' },
    { id: 'work3', title: '작품 3' }
  ];

  // ---- 웹툰 작품 섹션/서브메뉴 동적 생성 ----
  const workSectionsContainer = document.getElementById('workSectionsContainer');
  const workAddBtn = document.getElementById('workAddBtn');

  function createWorkSubItem(work){
    const item = document.createElement('div');
    item.className = 'sub-item';
    item.dataset.work = work.id;

    const span = document.createElement('span');
    span.className = 'sub-item-title';
    span.textContent = work.title;
    makeEditable(span);

    const delBtn = document.createElement('span');
    delBtn.className = 'sub-item-del owner-only';
    delBtn.title = '작품 삭제';
    delBtn.textContent = '×';
    delBtn.addEventListener('click', async (e) => {
      e.stopPropagation();
      if(!isOwner) return;
      if(!confirm(`"${span.textContent.trim()}" 작품을 삭제할까요? 업로드된 이미지도 함께 삭제됩니다.`)) return;
      const imgs = imagesByPage[work.id] || [];
      for(const img of imgs){
        try{ await deleteDoc(doc(IMAGES_COLL, img.id)); }
        catch(err){ console.error(err); }
      }
      const list = getCurrentWorksFromDOM().filter(w => w.id !== work.id);
      renderWorks(list);
      showView('about');
      document.querySelector('.nav-item[data-view="about"]')?.classList.add('active');
      saveAll();
    });

    item.appendChild(span);
    item.appendChild(delBtn);
    item.addEventListener('click', () => {
      showView('webtoon', work.id);
      item.classList.add('active');
      window.scrollTo(0, 0);
    });
    return item;
  }

  function createWorkSection(work){
    const section = document.createElement('section');
    section.className = 'view';
    section.dataset.view = 'webtoon';
    section.dataset.work = work.id;

    const header = document.createElement('div');
    header.className = 'work-header';

    const titleRow = document.createElement('div');
    titleRow.className = 'title-row';
    const h1 = document.createElement('h1');
    h1.textContent = work.title;
    makeEditable(h1);
    const addBtn = document.createElement('div');
    addBtn.className = 'add-img-btn owner-only';
    addBtn.dataset.page = work.id;
    addBtn.title = '이미지 추가';
    addBtn.textContent = '+';
    titleRow.appendChild(h1);
    titleRow.appendChild(addBtn);

    header.appendChild(titleRow);

    const scroll = document.createElement('div');
    scroll.className = 'panel-scroll';
    scroll.dataset.pageContainer = work.id;

    const fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.className = 'img-input-hidden';
    fileInput.dataset.page = work.id;
    fileInput.accept = 'image/*';
    fileInput.multiple = true;
    fileInput.style.display = 'none';

    section.appendChild(header);
    section.appendChild(scroll);
    section.appendChild(fileInput);
    return section;
  }

  function renderWorks(list){
    workSectionsContainer.querySelectorAll('.sub-item').forEach(el => el.remove());
    webtoonSubmenu.querySelectorAll('.sub-item').forEach(el => el.remove());
    list.forEach(work => webtoonSubmenu.insertBefore(createWorkSubItem(work), workAddBtn));

    workSectionsContainer.innerHTML = '';
    list.forEach(work => workSectionsContainer.appendChild(createWorkSection(work)));

    list.forEach(work => {
      const subItemSpan = webtoonSubmenu.querySelector(`.sub-item[data-work="${work.id}"] .editable`);
      const h1 = workSectionsContainer.querySelector(`.view[data-work="${work.id}"] h1`);
      linkTitles(subItemSpan, h1);
    });

    list.forEach(work => renderPageImages(work.id));
  }
  renderWorks(DEFAULT_WORKS);

  function getCurrentWorksFromDOM(){
    return Array.from(webtoonSubmenu.querySelectorAll('.sub-item')).map(item => {
      const id = item.dataset.work;
      const titleEl = item.querySelector('.editable');
      return { id, title: titleEl.textContent.trim() };
    });
  }

  workAddBtn.addEventListener('click', () => {
    if(!isOwner) return;
    const list = getCurrentWorksFromDOM();
    const newId = 'work_' + Date.now();
    list.push({ id: newId, title: '새 작품' });
    renderWorks(list);
    showView('webtoon', newId);
    document.querySelector(`#webtoon-submenu .sub-item[data-work="${newId}"]`)?.classList.add('active');
    window.scrollTo(0, 0);
    const h1 = document.querySelector(`.view[data-view="webtoon"][data-work="${newId}"] h1`);
    if(h1){
      h1.setAttribute('contenteditable', 'true');
      h1.focus();
      document.execCommand('selectAll', false, null);
    }
  });

  // ---- Firestore에서 콘텐츠 불러오기 (방문자 포함 모두에게 적용) ----
  onSnapshot(CONTENT_DOC, (snap) => {
    if(!snap.exists()) return;
    const data = snap.data();
    FIELD_IDS.forEach(field => {
      if(data[field] === undefined) return;
      const el = document.querySelector(`[data-field="${field}"]`);
      if(el) el.textContent = data[field];
    });
    if(Array.isArray(data.career) && data.career.length){
      renderCareerList(data.career);
    }
    if(Array.isArray(data.works) && data.works.length){
      renderWorks(data.works);
    }
    if(data.sidebarColor){
      document.documentElement.style.setProperty('--sidebar', data.sidebarColor);
      document.getElementById('sidebar-color').value = data.sidebarColor;
    }
    if(data.sidebarTextColor){
      document.documentElement.style.setProperty('--sidebar-text', data.sidebarTextColor);
      document.getElementById('sidebar-text-color').value = data.sidebarTextColor;
    }
    if(data.accentColor){
      document.documentElement.style.setProperty('--accent', data.accentColor);
      document.getElementById('accent-color').value = data.accentColor;
    }
    if(data.contactInstaHref){
      document.getElementById('contactInstaLink').href = data.contactInstaHref;
    }
    if(data.heroImg){
      heroImgEl.src = data.heroImg;
      heroImgWrap.classList.add('has-image');
    }
    if(data.heroImgPos){
      heroImgPos = data.heroImgPos;
      applyHeroTransform();
    }
    hidePageLoader();
  }, (err) => {
    console.error('[portfolio] 콘텐츠 불러오기 실패:', err.code || err);
    hidePageLoader();
  });

  // ---- 로그인 상태 ----
  document.getElementById('login-btn').addEventListener('click', async () => {
    try{
      await signInWithPopup(auth, provider);
    }catch(err){
      console.error('[portfolio] 로그인 실패:', err.code || err);
    }
  });

  onAuthStateChanged(auth, (user) => {
    isOwner = !!(user && user.uid === OWNER_UID);
    document.body.classList.toggle('is-owner', isOwner);
  });

  // ---- 저장 (텍스트 + 경력 + 작품 목록 + 사이드바 색상) ----
  async function saveAll(){
    if(!isOwner) return;
    const data = {};
    FIELD_IDS.forEach(field => {
      const el = document.querySelector(`[data-field="${field}"]`);
      if(el) data[field] = el.textContent.trim();
    });
    data.career = Array.from(document.querySelectorAll('#careerRows .career-row')).map(row => ({
      period: row.querySelector('.period').textContent.trim(),
      text: row.querySelector('.text').textContent.trim()
    }));
    data.works = getCurrentWorksFromDOM();
    data.sidebarColor = getComputedStyle(document.documentElement).getPropertyValue('--sidebar').trim();
    data.sidebarTextColor = getComputedStyle(document.documentElement).getPropertyValue('--sidebar-text').trim();
    data.accentColor = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim();
    try{
      await setDoc(CONTENT_DOC, data, { merge: true });
      showToast('저장되었습니다.');
    }catch(err){
      console.error('[portfolio] 저장 실패:', err.code || err);
      showToast('저장 실패 — 콘솔을 확인해주세요.');
    }
  }
  document.getElementById('save-btn').addEventListener('click', saveAll);

  // Ctrl+S / Cmd+S로 저장
  document.addEventListener('keydown', (e) => {
    if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's'){
      e.preventDefault();
      if(isOwner) saveAll();
    }
  });

  // ---- 이메일 복사 ----
  document.getElementById('copyEmailBtn').addEventListener('click', async () => {
    const text = document.querySelector('[data-field="contactEmailText"]').textContent.trim();
    try{
      await navigator.clipboard.writeText(text);
      showToast('이메일이 복사되었습니다.');
    }catch(err){
      showToast('복사에 실패했어요.');
    }
  });

  // ---- 인스타그램 링크 수정 ----
  document.getElementById('contactInstaEdit').addEventListener('click', async () => {
    const linkEl = document.getElementById('contactInstaLink');
    const val = prompt('인스타그램 URL을 입력하세요', linkEl.href);
    if(val === null) return;
    linkEl.href = val.trim();
    try{
      await setDoc(CONTENT_DOC, { contactInstaHref: val.trim() }, { merge: true });
      showToast('저장되었습니다.');
    }catch(err){ console.error(err); }
  });

  // ---- 대표 이미지: 업로드 / 드래그 이동 / 휠·슬라이더 확대 ----
  const heroImgWrap = document.getElementById('heroImgWrap');
  const heroImgEl = document.getElementById('heroImgEl');
  const heroImgInput = document.getElementById('heroImgInput');
  const heroAdjustBtn = document.getElementById('heroAdjustBtn');
  const heroUploadBtn = document.getElementById('heroUploadBtn');
  const heroAdjustHint = document.getElementById('heroAdjustHint');
  const heroAdjustPanel = document.getElementById('heroAdjustPanel');
  const heroZoomSlider = document.getElementById('heroZoomSlider');
  const heroAdjustDone = document.getElementById('heroAdjustDone');

  let heroImgPos = { xp: 0, yp: 0, scale: 1 };
  let heroAdjusting = false;
  let heroDrag = null;
  let heroPosSaveTimer = null;

  function applyHeroTransform(){
    const w = heroImgWrap.clientWidth || 1, h = heroImgWrap.clientHeight || 1;
    const xpx = (heroImgPos.xp / 100) * w;
    const ypx = (heroImgPos.yp / 100) * h;
    heroImgEl.style.transform = `translate(${xpx}px, ${ypx}px) scale(${heroImgPos.scale || 1})`;
  }

  function toggleHeroAdjustMode(){
    if(!heroImgWrap.classList.contains('has-image')) return;
    heroAdjusting = !heroAdjusting;
    heroImgWrap.classList.toggle('adjusting', heroAdjusting);
    heroAdjustPanel.classList.toggle('open', heroAdjusting);
    heroAdjustHint.classList.toggle('open', heroAdjusting);
    heroZoomSlider.value = Math.round((heroImgPos.scale || 1) * 100);
    if(!heroAdjusting) saveHeroPos();
  }

  function setHeroZoom(val){
    heroImgPos.scale = Math.max(1, Math.min(4, Number(val) / 100));
    applyHeroTransform();
    scheduleHeroPosSave();
  }

  function scheduleHeroPosSave(){
    clearTimeout(heroPosSaveTimer);
    heroPosSaveTimer = setTimeout(saveHeroPos, 600);
  }

  async function saveHeroPos(){
    if(!isOwner) return;
    try{
      await setDoc(CONTENT_DOC, { heroImgPos }, { merge: true });
    }catch(err){ console.error('[portfolio] 이미지 위치 저장 실패:', err); }
  }

  function compressImage(file, maxDim, quality, maxBytes){
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onerror = () => reject(new Error('파일을 읽지 못했어요'));
      reader.onload = () => {
        const img = new Image();
        img.onerror = () => reject(new Error('이미지를 열지 못했어요'));
        img.onload = () => {
          let { width, height } = img;
          if(width > maxDim || height > maxDim){
            if(width >= height){ height = Math.round(height * maxDim / width); width = maxDim; }
            else{ width = Math.round(width * maxDim / height); height = maxDim; }
          }
          const canvas = document.createElement('canvas');
          canvas.width = width; canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(0, 0, width, height);
          ctx.drawImage(img, 0, 0, width, height);
          let q = quality;
          let dataUrl = canvas.toDataURL('image/jpeg', q);
          while(dataUrl.length > maxBytes * 1.37 && q > 0.4){
            q -= 0.1;
            dataUrl = canvas.toDataURL('image/jpeg', q);
          }
          resolve(dataUrl);
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }

  // 웹툰 컷 전용: 가로×세로 전체 픽셀 수를 기준으로 리사이즈.
  // 세로로 아주 긴 컷도 항상 용량 안에 들어오도록, 폭이 아니라 총 픽셀 수 기준으로 계산함.
  function compressImageOriginal(file, quality, maxBytes){
    const MAX_PIXELS = 3000000; // 약 300만 화소 — 690px 폭 기준 리더 화면에서 충분히 선명한 수준
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onerror = () => reject(new Error('파일을 읽지 못했어요'));
      reader.onload = () => {
        const img = new Image();
        img.onerror = () => reject(new Error('이미지를 열지 못했어요'));
        img.onload = () => {
          let width = img.width, height = img.height;
          const pixels = width * height;
          if(pixels > MAX_PIXELS){
            const scale = Math.sqrt(MAX_PIXELS / pixels);
            width = Math.max(1, Math.round(width * scale));
            height = Math.max(1, Math.round(height * scale));
          }
          const canvas = document.createElement('canvas');
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(0, 0, width, height);
          ctx.drawImage(img, 0, 0, width, height);
          let q = quality;
          let dataUrl = canvas.toDataURL('image/jpeg', q);
          while(dataUrl.length > maxBytes * 1.37 && q > 0.3){
            q -= 0.1;
            dataUrl = canvas.toDataURL('image/jpeg', q);
          }
          if(dataUrl.length > maxBytes * 1.37){
            reject(new Error('이미지 용량이 너무 커서 저장할 수 없어요. 파일 용량을 줄여서 다시 시도해주세요.'));
            return;
          }
          resolve(dataUrl);
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }

  // 파일명에 포함된 숫자를 순서 값으로 사용 (001, 002 ... 형태를 위에서 아래로 정렬)
  function extractOrderNumber(filename, fallbackIndex){
    const match = filename.match(/(\d+)/);
    if(match) return parseInt(match[1], 10);
    return 1000000 + fallbackIndex;
  }

  // file.type이 비어있는 드문 경우(일부 브라우저/도구에서 내보낸 PNG 등)에도
  // 파일 확장자로 한 번 더 확인해서 이미지 업로드가 조용히 무시되지 않게 함
  function isImageFile(file){
    if(file.type && file.type.startsWith('image/')) return true;
    return /\.(png|jpe?g|gif|webp|bmp|svg)$/i.test(file.name || '');
  }

  async function handleHeroUpload(file){
    if(!file) return;
    if(!isImageFile(file)){ alert('이미지 파일만 선택할 수 있어요'); return; }
    try{
      const dataUrl = await compressImage(file, 1400, 0.85, 700000);
      heroImgPos = { xp: 0, yp: 0, scale: 1 };
      heroImgEl.src = dataUrl;
      heroImgWrap.classList.add('has-image');
      applyHeroTransform();
      heroZoomSlider.value = 100;
      if(isOwner){
        await setDoc(CONTENT_DOC, { heroImg: dataUrl, heroImgPos }, { merge: true });
        showToast('이미지가 저장되었습니다.');
      }
    }catch(err){
      console.error(err);
      alert('이미지를 적용하지 못했어요. 다른 이미지로 시도해주세요.');
    }
  }

  heroImgInput.addEventListener('change', (e) => {
    const file = e.target.files && e.target.files[0];
    handleHeroUpload(file);
    e.target.value = '';
  });

  heroAdjustBtn.addEventListener('click', (e) => { e.stopPropagation(); toggleHeroAdjustMode(); });
  heroUploadBtn.addEventListener('click', (e) => { e.stopPropagation(); heroImgInput.click(); });
  heroAdjustDone.addEventListener('click', toggleHeroAdjustMode);
  heroZoomSlider.addEventListener('input', (e) => setHeroZoom(e.target.value));

  heroImgEl.addEventListener('pointerdown', (e) => {
    if(!heroAdjusting) return;
    e.preventDefault();
    const w = heroImgWrap.clientWidth || 1, h = heroImgWrap.clientHeight || 1;
    heroDrag = { startX: e.clientX, startY: e.clientY, startXp: heroImgPos.xp, startYp: heroImgPos.yp, w, h };
    heroImgWrap.classList.add('dragging');
    heroImgEl.setPointerCapture(e.pointerId);
  });
  heroImgEl.addEventListener('pointermove', (e) => {
    if(!heroDrag) return;
    const dxp = ((e.clientX - heroDrag.startX) / heroDrag.w) * 100;
    const dyp = ((e.clientY - heroDrag.startY) / heroDrag.h) * 100;
    heroImgPos.xp = Math.max(-100, Math.min(100, heroDrag.startXp + dxp));
    heroImgPos.yp = Math.max(-100, Math.min(100, heroDrag.startYp + dyp));
    applyHeroTransform();
  });
  function endHeroDrag(e){
    if(!heroDrag) return;
    heroImgWrap.classList.remove('dragging');
    try{ heroImgEl.releasePointerCapture(e.pointerId); }catch(err){}
    heroDrag = null;
    scheduleHeroPosSave();
  }
  heroImgEl.addEventListener('pointerup', endHeroDrag);
  heroImgEl.addEventListener('pointercancel', endHeroDrag);

  heroImgWrap.addEventListener('wheel', (e) => {
    if(!heroAdjusting) return;
    e.preventDefault();
    const cur = heroImgPos.scale || 1;
    const next = Math.max(1, Math.min(4, cur + (e.deltaY < 0 ? 0.1 : -0.1)));
    heroImgPos.scale = next;
    heroZoomSlider.value = Math.round(next * 100);
    applyHeroTransform();
    scheduleHeroPosSave();
  }, { passive: false });

  document.addEventListener('keydown', (e) => {
    if(e.key === 'Escape' && heroAdjusting) toggleHeroAdjustMode();
  });

  // ---- 페이지별 이미지 불러오기 (웹툰 작품들 + 일러스트 + 기타 작업) ----
  onSnapshot(IMAGES_COLL, (snap) => {
    const grouped = {};
    snap.forEach(d => {
      const data = d.data();
      if(!grouped[data.page]) grouped[data.page] = [];
      grouped[data.page].push({ id: d.id, ...data });
    });
    Object.keys(imagesByPage).forEach(k => delete imagesByPage[k]);
    Object.assign(imagesByPage, grouped);
    Object.keys(imagesByPage).forEach(p => {
      imagesByPage[p].sort((a, b) => (a.order || 0) - (b.order || 0));
      renderPageImages(p);
    });
  }, (err) => {
    console.error('[portfolio] 이미지 불러오기 실패:', err.code || err);
  });

  async function addImagesForPage(page, fileList){
    if(!isOwner || !fileList || !fileList.length) return;
    const webtoon = isWebtoonPage(page);
    const files = Array.from(fileList).filter(isImageFile);
    const failed = [];
    await Promise.all(files.map(async (file, i) => {
      try{
        const dataUrl = webtoon
          ? await compressImageOriginal(file, 0.85, 700000)
          : await compressImage(file, 1400, 0.82, 500000);
        const order = extractOrderNumber(file.name, i);
        await addDoc(IMAGES_COLL, { page, src: dataUrl, order, filename: file.name });
      }catch(err){
        console.error(err);
        failed.push(file.name + (err && err.message ? (': ' + err.message) : ''));
      }
    }));
    if(failed.length){
      alert('다음 이미지는 추가하지 못했어요:\n' + failed.join('\n'));
    } else {
      showToast('이미지가 추가되었습니다.');
    }
  }

  // 이미지 추가(+) 버튼과 숨김 파일 입력은 동적으로 생기므로 이벤트 위임 방식으로 처리
  document.addEventListener('click', (e) => {
    const btn = e.target.closest('.add-img-btn[data-page]');
    if(btn){
      const page = btn.getAttribute('data-page');
      const input = document.querySelector(`.img-input-hidden[data-page="${page}"]`);
      if(input) input.click();
    }
  });
  document.addEventListener('change', (e) => {
    if(e.target.matches && e.target.matches('.img-input-hidden')){
      const page = e.target.getAttribute('data-page');
      addImagesForPage(page, e.target.files);
      e.target.value = '';
    }
  });
</script>

</body>
