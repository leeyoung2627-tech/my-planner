<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>자산관리</title>
<style>
:root{
  --paper:#FAF5EA; --card:#FFFDF8; --ink:#382E24; --accent:#4F7965; --accent-soft:#DCE6DE; --line:#E4D9C5;
  --warn:#D68C45; --info:#5B8DB8; --danger:#B5654A;
  --ink-soft:color-mix(in srgb,var(--ink) 58%,var(--card));
  --ink-faint:color-mix(in srgb,var(--ink) 38%,var(--card));
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic','Pretendard',sans-serif;font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
textarea{resize:vertical;min-height:64px}
h1{font-size:20px;margin:0 0 2px;font-weight:700}
h2{font-size:15px;margin:0 0 10px;font-weight:700}
.muted{color:var(--ink-soft)} .faint{color:var(--ink-faint)}
.hide{display:none!important}

/* 로그인 */
#loginWrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:28px 26px;max-width:360px;width:100%;text-align:center}
.login-card h1{margin-bottom:6px}

/* 전체 레이아웃: 왼쪽 사이드바 + 본문 (폭이 좁아지면 아래쪽 메뉴로) */
.app{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;background:var(--card);border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:4px}
.brand{font-size:16px;font-weight:700;padding:2px 10px 14px}
.nav-btn{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:none;border-radius:10px;padding:10px 12px;font-size:14px;color:var(--ink-soft)}
.nav-btn:hover{background:var(--paper)}
.nav-btn.active{background:var(--accent-soft);color:var(--accent);font-weight:700}
.nav-ico{width:20px;text-align:center}
.side-foot{margin-top:auto;border-top:1px solid var(--line);padding:12px 10px 0}
.side-foot .nw{font-size:15px;font-weight:700}
.side-foot a,.side-foot button{display:block;background:none;border:none;padding:6px 0 0;font-size:12px;color:var(--ink-soft);text-decoration:none;text-align:left}
.main{padding:26px 30px 70px;max-width:1000px;width:100%}
.view{display:none}.view.active{display:block}
.vh{margin-bottom:16px}
.vh p{margin:0;font-size:13px}

.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:12px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 14px}
.kpi .l{font-size:12px;color:var(--ink-soft)} .kpi .v{font-size:17px;font-weight:700;margin-top:2px}
.kpi.hero .v{font-size:20px}
.pos{color:var(--accent)} .neg{color:var(--danger)}

.btn{border:1px solid var(--line);background:var(--card);border-radius:9px;padding:7px 13px;font-size:13px}
.btn:hover{background:var(--paper)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.07)}
.btn.small{padding:4px 10px;font-size:12px}
.btn.danger{color:var(--danger)}
.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.wrap{flex-wrap:wrap}.gap6{gap:6px}

/* 목표 카드 */
.goal-grid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:12px;margin-bottom:12px}
.field label{display:block;font-size:12px;color:var(--ink-soft);margin-bottom:3px}
.bar{position:relative;height:10px;border-radius:5px;background:var(--line);margin:10px 0 6px}
.bar>i{display:block;height:100%;border-radius:5px;background:var(--accent)}
.bar>b{position:absolute;top:-2px;width:1px;height:14px;background:var(--ink-faint)}
.note{font-size:13px;margin-top:8px}
.note.good{color:var(--accent)} .note.bad{color:var(--danger)}

/* 차트 + 시나리오 */
.chart svg{display:block;width:100%;height:auto}
.scn{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:8px}
.scn>div{border-radius:10px;padding:9px 12px;border:1px solid var(--line)}
.scn .t{font-size:12px} .scn .m{font-size:12px;color:var(--ink-soft)} .scn .d{font-size:15px;font-weight:700}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}

.ms{font-size:13px}
.ms>div{display:flex;gap:12px;padding:8px 0;border-top:1px solid var(--line)}
.ms>div:first-child{border-top:none}
.ms .d{flex:0 0 62px;color:var(--ink-soft)}

/* 목록 */
.list-h,.list-r{display:grid;gap:8px;align-items:center;padding:9px 6px}
.list-h{font-size:12px;color:var(--ink-faint);border-bottom:1px solid var(--line)}
.list-r{border-bottom:1px solid var(--line);font-size:13px}
.list-r.sel{background:var(--accent-soft);border-radius:8px}
.cols-assets{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr) minmax(0,.9fr) minmax(0,.6fr) minmax(0,.8fr) 52px}
.cols-loans{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr) minmax(0,.6fr) minmax(0,.9fr) minmax(0,.9fr) 52px}
.chip{display:inline-block;font-size:11px;padding:1px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.empty{text-align:center;padding:26px 10px;color:var(--ink-soft)}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}

/* 대출 시뮬레이터 */
.sim input[type=range]{padding:0;border:none;background:none;accent-color:var(--accent)}
.sim-res{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px}
.sim-res>div{background:var(--accent-soft);border-radius:10px;padding:9px 12px}
.sim-res .l{font-size:11px;color:var(--accent)} .sim-res .v{font-size:14px;font-weight:700;color:var(--accent)}

.check{display:inline-flex;align-items:center;gap:6px;font-size:13px;cursor:pointer}
.check input{width:auto;padding:0}
/* 100세 로드맵: 구불구불 이어지는 나이 줄 + 줄에 매달린 메모 카드 */
.snake-card{padding:14px 10px 16px;overflow:hidden}
.snake{position:relative;width:100%}
.sn-svg{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
.sn-tick{position:absolute;width:28px;height:28px;margin:-14px 0 0 -14px;border:none;background:none;padding:0;cursor:pointer}
.sn-tick::before{content:'';position:absolute;left:50%;top:50%;width:9px;height:9px;margin:-4.5px 0 0 -4.5px;border-radius:50%;background:var(--card);border:2px solid var(--accent);transition:transform .12s}
.sn-tick.has::before{width:13px;height:13px;margin:-6.5px 0 0 -6.5px;background:var(--accent)}
.sn-tick.now::before{background:var(--warn);border-color:var(--warn);width:15px;height:15px;margin:-7.5px 0 0 -7.5px}
.sn-tick:hover::before{transform:scale(1.3)}
.sn-age{position:absolute;left:50%;top:-10px;transform:translateX(-50%);font-size:11px;color:var(--ink-soft);white-space:nowrap;pointer-events:none}
.sn-tick.now .sn-age,.sn-tick.has .sn-age{color:var(--ink);font-weight:700}
.sn-now{position:absolute;left:50%;top:-32px;transform:translateX(-50%);font-size:11px;background:var(--warn);color:#fff;padding:1px 8px;border-radius:999px;pointer-events:none;white-space:nowrap}
.sn-card{position:absolute;border:1px solid var(--ink-faint);border-radius:9px;background:var(--card);overflow:hidden;cursor:pointer}
.sn-card:hover,.sn-card:focus{border-color:var(--accent);outline:none}
.sn-card.done{border-color:var(--accent);border-width:2px}
.sn-amt{background:var(--amt-bg,#F4FF3A);color:var(--amt-fg,#2b2b00);font-weight:700;font-size:12.5px;height:28px;line-height:28px;padding:0 8px;display:flex;justify-content:space-between;white-space:nowrap;overflow:hidden}
.sn-amt.empty{opacity:.6;font-weight:400}
.sn-memo{font-size:12px;line-height:1.35;padding:5px 8px;color:var(--ink);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
input.neon{background:var(--amt-bg,#F4FF3A);color:var(--amt-fg,#2b2b00);border-color:color-mix(in srgb,var(--amt-bg,#F4FF3A) 70%,#000);font-weight:700}
input.neon::placeholder{color:var(--amt-fg,#2b2b00);opacity:.45}
.amtc{display:inline-flex;align-items:center;gap:5px;flex-wrap:wrap}
.swatch{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);padding:0;cursor:pointer}
.swatch.on{border-color:var(--ink);box-shadow:inset 0 0 0 2px var(--card)}
.amtc input[type=color]{width:30px;height:26px;padding:0;border:1px solid var(--line);border-radius:6px;background:none;cursor:pointer}
.modal .hint{font-size:12px;color:var(--ink-soft);margin:-6px 0 10px}
/* 모달 */
.modal-bg{position:fixed;inset:0;background:rgba(40,30,20,.38);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal-bg.show{display:flex}
.modal{background:var(--card);border-radius:16px;padding:20px 22px;width:100%;max-width:400px;max-height:90vh;overflow:auto}
.modal h2{margin-bottom:12px}
.modal .f{margin-bottom:10px}
.modal .btns{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}

#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--ink);color:var(--card);padding:8px 16px;border-radius:20px;font-size:12.5px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:80}
#toast.show{opacity:.92}

.bottom{display:none}

@media(max-width:820px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  .main{padding:18px 14px 96px}
  .bottom{display:flex;position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);z-index:40;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .bottom button{flex:1;background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:11px;color:var(--ink-soft);padding:6px 0}
  .bottom button .nav-ico{font-size:18px}
  .bottom button.active{color:var(--accent);font-weight:700}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .goal-grid,.life-top{grid-template-columns:minmax(0,1fr)}
  .scn{grid-template-columns:minmax(0,1fr)}
  /* 표는 줄 단위 카드로 */
  .list-h{display:none}
  .cols-assets,.cols-loans{grid-template-columns:minmax(0,1fr) auto auto}
  .list-r .hide-m{display:none}
}
</style>
</head>
<body>

<!-- 로그인 -->
<div id="loginWrap" class="hide">
  <div class="login-card">
    <h1>자산관리</h1>
    <p class="muted" style="margin:0 0 18px">저축 · 대출 · 목표 자산 · 100세 로드맵</p>
    <button class="btn primary" id="loginBtn" style="width:100%;padding:10px">Google로 로그인</button>
  </div>
</div>

<!-- 앱 -->
<div id="appWrap" class="app hide">
  <aside class="side">
    <div class="brand">💰 자산관리</div>
    <button class="nav-btn" data-view="home"><span class="nav-ico">🗺</span>목표 로드맵</button>
    <button class="nav-btn" data-view="assets"><span class="nav-ico">🐷</span>저축·자산</button>
    <button class="nav-btn" data-view="loans"><span class="nav-ico">🏦</span>대출</button>
    <button class="nav-btn" data-view="life"><span class="nav-ico">🌱</span>100세 로드맵</button>
    <button class="nav-btn" data-view="settings"><span class="nav-ico">⚙️</span>설정</button>
    <div class="side-foot">
      <div class="muted" style="font-size:11px">순자산</div>
      <div class="nw" id="sideNW">-</div>
      <a href="/">← 플래너로 돌아가기</a>
      <button id="logoutBtn">로그아웃</button>
    </div>
  </aside>

  <main class="main">

    <!-- 목표 로드맵 -->
    <section class="view" id="v-home"></section>

    <!-- 저축·자산 -->
    <section class="view" id="v-assets"></section>

    <!-- 대출 -->
    <section class="view" id="v-loans"></section>

    <!-- 100세 로드맵 -->
    <section class="view" id="v-life"></section>

    <!-- 설정 -->
    <section class="view" id="v-settings"></section>

  </main>
</div>

<nav class="bottom" id="bottomNav" style="display:none">
  <button data-view="home"><span class="nav-ico">🗺</span>로드맵</button>
  <button data-view="assets"><span class="nav-ico">🐷</span>저축</button>
  <button data-view="loans"><span class="nav-ico">🏦</span>대출</button>
  <button data-view="life"><span class="nav-ico">🌱</span>100세</button>
  <button data-view="settings"><span class="nav-ico">⚙️</span>설정</button>
</nav>

<div class="modal-bg" id="modalBg"><div class="modal" id="modal"></div></div>
<div id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-auth.js";
import { getFirestore, doc, setDoc, getDoc, collection, getDocs } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBkSmyAwRUlpgZBUz0kXqCVoS29dYht7No",
  authDomain: "my-planner-3728c.firebaseapp.com",
  projectId: "my-planner-3728c",
  storageBucket: "my-planner-3728c.firebasestorage.app",
  messagingSenderId: "179812397978",
  appId: "1:179812397978:web:3525714542291e818e0023"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const provider = new GoogleAuthProvider();

/* ══════════ 플래너와 같은 테마 색 적용 ══════════ */
(function applyPlannerTheme(){
  try{
    const t=JSON.parse(localStorage.getItem('planner_theme_v2')||'null');
    if(!t)return;
    const r=document.documentElement.style;
    if(t.accent)r.setProperty('--accent',t.accent);
    if(t.accentLight)r.setProperty('--accent-soft',t.accentLight);
    if(t.pagebg)r.setProperty('--paper',t.pagebg);
    if(t.appbg)r.setProperty('--card',t.appbg);
    if(t.text)r.setProperty('--ink',t.text);
    if(t.bordercol)r.setProperty('--line',t.bordercol);
  }catch(e){}
})();

/* ══════════ 작은 도우미 ══════════ */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{const n=parseFloat(String(v==null?'':v).replace(/[^0-9.\-]/g,''));return isNaN(n)?0:n;};
const won=n=>Math.round(n).toLocaleString('ko-KR')+'원';
const wonShort=n=>{
  const a=Math.abs(n),sg=n<0?'-':'';
  if(a>=1e8){const v=Math.round(a/1e7)/10;return sg+(Number.isInteger(v)?v:v.toFixed(1))+'억';}
  if(a>=1e7&&a%1e7===0)return sg+(a/1e7)+'천만';
  if(a>=1e4)return sg+Math.round(a/1e4).toLocaleString('ko-KR')+'만';
  return sg+Math.round(a).toLocaleString('ko-KR');
};
const comma=n=>n?Math.round(n).toLocaleString('ko-KR'):'';
const ymStr=(y,m)=>y+'.'+String(m).padStart(2,'0');
const toYM=s=>{const m=/^(\d{4})-(\d{1,2})$/.exec(s||'');return m?{y:+m[1],m:+m[2]}:null;};
const addMonths=(y,m,k)=>{const t=y*12+(m-1)+k;return {y:Math.floor(t/12),m:t%12+1};};
const diffMonths=(y1,m1,y2,m2)=>(y2*12+m2)-(y1*12+m1);
const NOW=()=>{const d=new Date();return {y:d.getFullYear(),m:d.getMonth()+1};};

/* ══════════ 계산 (화면과 분리된 순수 함수) ══════════ */
// 대출: 매달 이자를 붙이고 월 상환액을 갚는 방식으로 완납까지 계산
function loanSchedule(bal,ratePct,pmt){
  if(bal<=0)return {months:0,interest:0,never:false};
  const r=ratePct/1200;
  if(pmt<=0||pmt<=bal*r+1e-9)return {months:null,interest:null,never:true}; // 이자도 못 갚는 상환액이면 끝나지 않음
  let b=bal,n=0,interest=0;
  while(b>0.5&&n<1200){const i=b*r;interest+=i;b=b+i-pmt;n++;}
  return {months:n,interest,never:n>=1200};
}
// 앞으로의 순자산(= 저축·투자 − 대출) 변화를 한 달씩 계산.
// factor: 수입이 변할 때 "저축액"이 변하는 비율 (대출 상환액은 의무라서 그대로). 끝난 대출의 상환액·만기 지난 납입액은 저축으로 돌린다고 가정(옵션).
function simulate(p,factor,maxMonths){
  maxMonths=maxMonths||480;
  const now=NOW();
  const accts=(p.accounts||[]).map(a=>({name:a.name,bal:num(a.balance),dep:num(a.monthly),rate:num(a.rate),mat:toYM(a.maturity),matDone:false}));
  const loans=(p.loans||[]).map(l=>({name:l.name,bal:num(l.balance),rate:num(l.rate),pmt:num(l.monthly),orig:num(l.monthly),paid:false}));
  let pool=0;
  const nwNow=()=>accts.reduce((s,a)=>s+a.bal,0)+pool-loans.reduce((s,l)=>s+l.bal,0);
  const series=[nwNow()],events=[];
  for(let t=1;t<=maxMonths;t++){
    const d=addMonths(now.y,now.m,t);
    const key=d.y*100+d.m;
    accts.forEach(a=>{
      if(p.includeInterest&&a.rate>0)a.bal*=1+a.rate/1200;
      const mk=a.mat?a.mat.y*100+a.mat.m:null;
      if(!mk||key<=mk)a.bal+=a.dep*factor;
      else if(p.redirectFreed)pool+=a.dep*factor;
      if(mk&&key===mk&&!a.matDone){a.matDone=true;events.push({t,type:'maturity',name:a.name,amount:a.bal});}
    });
    loans.forEach(l=>{
      if(l.bal<=0.5){if(l.orig>0&&p.redirectFreed)pool+=l.orig*factor;return;}
      const owed=l.bal+l.bal*l.rate/1200;
      const pay=Math.min(l.pmt,owed);
      if(l.pmt>owed&&p.redirectFreed)pool+=(l.pmt-owed)*factor;
      l.bal=Math.max(0,owed-pay);
      if(l.bal<=0.5&&!l.paid){l.paid=true;l.bal=0;events.push({t,type:'payoff',name:l.name,pmt:l.orig});}
    });
    series.push(nwNow());
  }
  return {series,events};
}
const firstReach=(series,goal)=>{if(!goal)return null;for(let t=0;t<series.length;t++)if(series[t]>=goal)return t;return null;};

/* ══════════ 데이터 ══════════ */
const NOWY=NOW().y;
const DEFAULT_PLAN=()=>({
  birthYear:1993,endAge:100,ageMode:'man',amtColor:'#F4FF3A',
  goalAmount:100000000,goalYM:(NOWY+5)+'-12',
  scenarioPct:20,includeInterest:true,redirectFreed:true,
  accounts:[],loans:[],yearGoals:{}
});
let plan=DEFAULT_PLAN();
let user=null,loaded=false,saveTimer=null,model=null;
let view='home',selLoan=null,extraPay=100000;

const planRef=()=>doc(db,'users',user.uid,'settings','assetPlan');
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('show'),1600);}
function scheduleSave(){
  if(!loaded||!user)return; // 불러오기 전에는 저장하지 않음(빈 화면으로 덮어쓰는 사고 방지)
  clearTimeout(saveTimer);

function chartSVG(){
  const m=model,now=NOW();
  const W=680,H=240,L=58,R=668,T=22,B=206;
  let Tm=Math.max(m.deadline&&m.deadline>0?m.deadline:0,...['low','base','high'].map(k=>m.arrive[k]||0),24)+6;
  Tm=Math.min(Tm,360);
  let yMax=Math.max(m.goal*1.1,...['low','base','high'].map(k=>Math.max(...m.sims[k].series.slice(0,Tm+1))),1);
  let yMin=Math.min(0,...['low','base','high'].map(k=>Math.min(...m.sims[k].series.slice(0,Tm+1))));
  const X=t=>L+t*(R-L)/Tm, Y=v=>B-(v-yMin)/(yMax-yMin)*(B-T);
  const col={low:'var(--warn)',base:'var(--accent)',high:'var(--info)'};
  let g='';
  // y 눈금
  const raw=(yMax-yMin)/4,mag=Math.pow(10,Math.floor(Math.log10(raw))),nr=raw/mag;
  const tstep=(nr<=1?1:nr<=2?2:nr<=5?5:10)*mag; // 1·2·5 단위로 딱 떨어지는 눈금 (예: 0, 5천만, 1억, 1.5억)
  for(let v=Math.ceil(yMin/tstep)*tstep;v<=yMax+1e-6;v+=tstep){g+=`<line x1="${L}" y1="${Y(v)}" x2="${R}" y2="${Y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${Y(v)+4}" text-anchor="end" font-size="11" fill="var(--ink-faint)">${v===0?'0':wonShort(v)}</text>`;}
  // x 눈금(해마다, 간격 자동)
  const years=Math.ceil(Tm/12);const step=years>14?5:years>7?2:1;
  for(let y=now.y+1;y<=now.y+years+1;y++){
    if((y-now.y)%step)continue;
    const t=(y-now.y)*12+(1-now.m);if(t<=0||t>Tm)continue;
    g+=`<text x="${X(t)}" y="${H-10}" text-anchor="middle" font-size="11" fill="var(--ink-faint)">${y}</text>`;
  }
  // 목표선 + 기한
  if(m.goal>0&&m.goal<=yMax)g+=`<line x1="${L}" y1="${Y(m.goal)}" x2="${R}" y2="${Y(m.goal)}" stroke="var(--ink-faint)" stroke-width="1" stroke-dasharray="5 4"/><text x="${R}" y="${Y(m.goal)-5}" text-anchor="end" font-size="11" fill="var(--ink-soft)">목표 ${wonShort(m.goal)}</text>`;
  if(m.deadline!=null&&m.deadline>0&&m.deadline<=Tm){const x=X(m.deadline);g+=`<line x1="${x}" y1="${T-6}" x2="${x}" y2="${B}" stroke="var(--danger)" stroke-width="1" stroke-dasharray="3 3"/><text x="${x-4}" y="${T-9}" text-anchor="end" font-size="11" fill="var(--danger)">목표 기한 ${plan.goalYM.replace('-','.')}</text>`;}
  // 시나리오 선 (목표에 도달하면 그 지점에서 끝냄)
  ['low','base','high'].forEach(k=>{
    const s=m.sims[k].series,end=m.arrive[k]!=null?Math.min(m.arrive[k],Tm):Tm;
    let pts=[];for(let t=0;t<=end&&t<s.length;t++)pts.push(X(t).toFixed(1)+','+Y(s[t]).toFixed(1));
    g+=`<polyline points="${pts.join(' ')}" fill="none" stroke="${col[k]}" stroke-width="2.2" stroke-linejoin="round"/>`;
    if(m.arrive[k]!=null&&m.arrive[k]<=Tm)g+=`<circle cx="${X(m.arrive[k])}" cy="${Y(s[m.arrive[k]])}" r="4" fill="${col[k]}"><title>${arriveLabel(m.arrive[k])} 도달</title></circle>`;
  });
  g+=`<circle cx="${X(0)}" cy="${Y(m.nw0)}" r="4.5" fill="var(--ink)"><title>지금 ${won(m.nw0)}</title></circle>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="시나리오별 순자산 전망 그래프">${g}</svg>`;
}
function milestones(){
  const m=model,now=NOW(),items=[];
  m.sims.base.events.forEach(e=>{
    const d=addMonths(now.y,now.m,e.t);
    if(e.type==='maturity')items.push({t:e.t,txt:`${esc(e.name)} 만기 · 예상 ${won(e.amount)} — 재예치할지 옮길지 정해야 해요`});
    if(e.type==='payoff')items.push({t:e.t,txt:`${esc(e.name)} 완납${e.pmt>0&&plan.redirectFreed?` · 월 ${won(e.pmt)}을 저축으로 돌릴 수 있어요`:''}`});
  });
  if(m.goal>0&&m.nw0<m.goal){
    [0.25,0.5,0.75].forEach(r=>{
      const t=firstReach(m.sims.base.series,m.goal*r);
      if(t!=null&&t>0&&m.sims.base.series[0]<m.goal*r)items.push({t,txt:`순자산 ${wonShort(m.goal*r)} 돌파 (기본 시나리오)`});
    });
    if(m.arrive.base!=null)items.push({t:m.arrive.base,txt:`<b>목표 ${wonShort(m.goal)} 도달</b> (기본 시나리오)`});
  }
  return items.sort((a,b)=>a.t-b.t).slice(0,9).map(i=>{const d=addMonths(now.y,now.m,i.t);return `<div><span class="d">${ymStr(d.y,d.m)}</span><span>${i.txt}</span></div>`;}).join('');
}

function simPanel(r){

// 금액 칸 색: 카드 맨 위 칸과 입력 창의 목표 금액 칸에 같이 적용. 글자색은 배경이 밝으면 어둡게, 어두우면 밝게 자동으로.
const AMT_PRESETS=[['#F4FF3A','형광 노랑'],['#B6FF3B','형광 연두'],['#5EF0C8','민트'],['#6EDCFF','하늘'],['#FF8FD6','분홍'],['#FFB84D','주황'],['#C9B3FF','연보라']];

const amtColor=()=>/^#[0-9a-fA-F]{6}$/.test(plan.amtColor||'')?plan.amtColor:AMT_DEFAULT;
function amtTextColor(hex){
  const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return (0.299*r+0.587*g+0.114*b)/255>0.6?'#26260a':'#ffffff';
}
function applyAmtColor(){

  r.setProperty('--amt-bg',c);r.setProperty('--amt-fg',amtTextColor(c));
}
const yg=y=>plan.yearGoals[y]||{};
const ygHas=y=>{const g=yg(y);return !!(num(g.asset)||(g.goal&&g.goal.trim())||(g.note&&g.note.trim())||g.done);};
let showPast=false;
// 나이 표기: 만 나이(생일 기준, 기본) 또는 세는 나이(태어난 해를 1살로 셈). 저장은 연도로 하니까 표기를 바꿔도 적어둔 목표는 그대로.
const ageOff=()=>plan.ageMode==='korean'?1:0;
const dispAge=a=>a+ageOff();
function lifeParams(){
  const by=num(plan.birthYear),endAge=Math.max(50,Math.min(120,num(plan.endAge)||100)),off=ageOff();
  const curAge=NOWY-by,endInternal=endAge-off;
  const startAge=showPast?0:Math.max(0,Math.min(curAge,endInternal));
  return {by,endAge,off,curAge,endInternal,startAge};
}
const SN={GAP:34,PAD:28,CARD_W:124,CARD_H:84,STEM:22,LABEL0:50,LABEL:30,BOTTOM:22,R:24};
// 화면 너비에 맞게 줄 바꿈(꺾임) 위치와 카드 자리를 계산.
// 메모가 있는 나이는 카드 폭만큼 줄 위에서 자리를 더 차지해서, 카드가 아래로 쌓이지 않고 오른쪽으로 나란히 놓임.
// 각 나이 점은 자기 카드의 왼쪽 위 모서리 바로 위에 있어서 어느 나이의 메모인지 바로 보임. 줄마다 방향이 번갈아 바뀜(→ ← →).
function snakeLayout(W,startAge,endAge,hasCard){
  const {GAP,PAD,CARD_W,CARD_H,STEM,LABEL0,LABEL,BOTTOM}=SN;
  const SLOT_CARD=CARD_W+10,TICK_IN=16;
  const avail=W-2*PAD;
  // 1) 나이를 줄 단위로 나눔 (메모 있는 나이는 넓은 칸, 없는 나이는 좁은 칸)
  const rowsAges=[];let curRow=[],sum=0;
  for(let a=startAge;a<=endAge;a++){
    const w=hasCard(a)?SLOT_CARD:GAP;
    if(curRow.length&&sum+w>avail){rowsAges.push(curRow);curRow=[];sum=0;}
    curRow.push({a,w});sum+=w;
  }
  if(curRow.length)rowsAges.push(curRow);
  const rows=rowsAges.length;
  const pts=[],cards=[],rowInfo=[];let top=0,perRow=0;
  rowsAges.forEach((items,r)=>{
    perRow=Math.max(perRow,items.length);
    const sumW=items.reduce((t,i)=>t+i.w,0);
    const extra=r<rows-1?(avail-sumW)/items.length:0; // 마지막 줄 말고는 줄 끝까지 꽉 채워서 꺾이는 곳에서 이어지게
    const anyCard=items.some(i=>hasCard(i.a));
    const lab=r===0?LABEL0:LABEL;
    const lineY=top+lab;
    let cum=0;
    items.forEach(it=>{
      const w=it.w+extra;
      const slotLeft=r%2===0?PAD+cum:PAD+avail-cum-w;
      cum+=w;
      if(hasCard(it.a)){
        const left=slotLeft+(w-CARD_W)/2,tx=left+TICK_IN;
        pts.push({age:it.a,row:r,x:tx,y:lineY});
        cards.push({age:it.a,left,top:lineY+STEM,tickX:tx,lineY,lane:0});
      }else pts.push({age:it.a,row:r,x:slotLeft+w/2,y:lineY});
    });
    const h=lab+(anyCard?STEM+CARD_H:16)+BOTTOM;
    rowInfo.push({top,lineY,lanes:anyCard?1:0,h});
    top+=h;
  });
  pts.sort((x,y)=>x.age-y.age);
  return {pts,rowInfo,cards,H:top,perRow,rows};
}
function roundedPath(v,R){
  let d='M'+v[0][0]+','+v[0][1];
  for(let i=1;i<v.length-1;i++){
    const p0=v[i-1],p1=v[i],p2=v[i+1];
    const d1=Math.hypot(p1[0]-p0[0],p1[1]-p0[1]),d2=Math.hypot(p2[0]-p1[0],p2[1]-p1[1]);
    const r=Math.min(R,d1/2,d2/2);
    const a=[p1[0]-(p1[0]-p0[0])/d1*r,p1[1]-(p1[1]-p0[1])/d1*r];
    const b=[p1[0]+(p2[0]-p1[0])/d2*r,p1[1]+(p2[1]-p1[1])/d2*r];
    d+=` L${a[0].toFixed(1)},${a[1].toFixed(1)} Q${p1[0]},${p1[1]} ${b[0].toFixed(1)},${b[1].toFixed(1)}`;
  }
  const l=v[v.length-1];return d+` L${l[0].toFixed(1)},${l[1].toFixed(1)}`;
}
function renderLife(){

  const left=Math.max(0,endAge-dispAge(curAge));
  const count=Object.keys(plan.yearGoals).filter(y=>ygHas(+y)).length;
  el.innerHTML=`
  <div class="vh row between wrap"><div><h1>100세 로드맵</h1><p class="muted">${by}년생 · 올해 ${dispAge(curAge)}세(${plan.ageMode==='korean'?'세는 나이':'만 나이'}) · ${endAge}세까지 ${left}년. 줄을 따라 나이가 이어져요. 나이를 눌러 그 해의 목표 금액과 메모를 적어보세요.</p></div>
    <div class="row gap6 wrap"><span class="amtc"><span class="muted" style="font-size:12px">금액 칸 색</span>${AMT_PRESETS.map(([c,n])=>`<button class="swatch${c.toLowerCase()===amtColor().toLowerCase()?' on':''}" style="background:${c}" data-act="amt-color" data-c="${c}" title="${n}" aria-label="${n}"></button>`).join('')}<input type="color" id="amtColorPick" value="${amtColor()}" title="직접 고르기" aria-label="금액 칸 색 직접 고르기"></span><label class="check"><input type="checkbox" id="showPast" ${showPast?'checked':''}> 지난 나이도 보기</label><button class="btn primary" data-act="year-edit" data-age="${Math.max(0,Math.min(curAge,endInternal))}">＋ 올해 목표</button></div></div>
  <div class="card snake-card"><div class="snake" id="snake"></div>${count?'':'<div class="muted" style="font-size:13px;text-align:center;padding-top:8px">아직 적어둔 목표가 없어요. 줄 위의 나이를 눌러 첫 목표를 적어보세요.</div>'}</div>`;

function buildSnake(){
  const box=$('#snake');if(!box)return;
  const {by,startAge,endInternal}=lifeParams();
  const W=Math.max(280,box.clientWidth||900);
  const L=snakeLayout(W,startAge,endInternal,age=>ygHas(by+age));
  const {PAD,CARD_W,CARD_H,R}=SN;
  const xL=PAD-16,xR=W-PAD+16;
  // 줄(경로): 줄마다 왼쪽 끝과 오른쪽 끝을 이어서 구불구불하게
  const v=[];
  const lastRow=L.rows-1,lastPt=L.pts[L.pts.length-1];
  for(let r=0;r<L.rows;r++){
    const y=L.rowInfo[r].lineY;
    if(r%2===0){if(r===0)v.push([xL,y]);v.push([r===lastRow?lastPt.x+22:xR,y]);}
    else{v.push([xR,y]);v.push([r===lastRow?lastPt.x-22:xL,y]);}
    if(r<lastRow){const ny=L.rowInfo[r+1].lineY;v.splice(v.length-1,1,[r%2===0?xR:xL,y]);v.push([r%2===0?xR:xL,ny]);}
  }
  // 정리: 연속된 같은 점 제거
  const verts=v.filter((p,i)=>i===0||p[0]!==v[i-1][0]||p[1]!==v[i-1][1]);
  const dir=lastRow%2===0?1:-1;
  let svg=`<path d="${roundedPath(verts,R)}" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>`;
  const end=verts[verts.length-1];
  svg+=`<path d="M${end[0]-dir*9},${end[1]-6} L${end[0]},${end[1]} L${end[0]-dir*9},${end[1]+6}" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>`;
  L.cards.forEach(c=>{svg+=`<line x1="${c.tickX}" y1="${c.lineY+6}" x2="${c.tickX}" y2="${c.top}" stroke="var(--ink-faint)" stroke-width="1.5"/>`;});
  let html=`<svg class="sn-svg" width="${W}" height="${L.H}" viewBox="0 0 ${W} ${L.H}" aria-hidden="true">${svg}</svg>`;
  L.pts.forEach(p=>{
    const year=by+p.age,has=ygHas(year),now=year===NOWY;
    html+=`<button class="sn-tick${has?' has':''}${now?' now':''}" style="left:${p.x}px;top:${p.y}px" data-act="year-edit" data-age="${p.age}" title="${dispAge(p.age)}세 · ${year}년${yg(year).goal?' — '+esc(yg(year).goal):''}"><span class="sn-age">${dispAge(p.age)}</span>${now?'<span class="sn-now">지금</span>':''}</button>`;
  });
  L.cards.forEach(c=>{
    const year=by+c.age,g=yg(year),a=num(g.asset);
    html+=`<div class="sn-card${g.done?' done':''}" tabindex="0" role="button" data-act="year-edit" data-age="${c.age}" style="left:${c.left}px;top:${c.top}px;width:${CARD_W}px;height:${CARD_H}px" title="${dispAge(c.age)}세 · ${year}년${a?' · 목표 '+won(a):''}"><div class="sn-amt${a?'':' empty'}"><span>${a?wonShort(a)+'원':'목표 금액'}</span>${g.done?'<span>✓</span>':''}</div><div class="sn-memo">${esc(g.goal||g.note||'')}</div></div>`;
  });
  box.style.height=L.H+'px';
  box.innerHTML=html;
}

    const base=sbS.exists()?(sbS.data().items||{}):{};
    const tags=[...new Set([...Object.keys(base),...Object.keys(totals)])];
    const loans=lnS.exists()?(lnS.data().items||[]):[];

    newAccts.forEach(t=>plan.accounts.push({id:'ac_'+Date.now()+Math.random().toString(36).slice(2,6),name:t,type:'적금',balance:(num(base[t])||0)+(totals[t]||0),monthly:0,rate:0,maturity:'',src:'tag:'+t}));

    changed();
    toast('가져왔어요 — 월 납입·상환액을 입력해주세요');
  }catch(e){console.error(e);toast('불러오기에 실패했어요');}
}

/* ══════════ 모달 ══════════ */
function openModal({title,hint,fields,values,onSave,onDelete,extra}){
  const m=$('#modal');
  m.innerHTML=`<h2>${esc(title)}</h2>${hint?`<div class="hint">${esc(hint)}</div>`:''}<form id="mForm">`+fields.map(f=>{
    const v=values[f.k];
    const cls=f.cls?` class="${f.cls}"`:'';
    let inp='';
    if(f.type==='check')return `<div class="f"><label class="check"><input type="checkbox" name="${f.k}" ${v?'checked':''}> ${esc(f.label)}</label></div>`;
    if(f.type==='select')inp=`<select name="${f.k}">${f.opts.map(o=>`<option ${o===v?'selected':''}>${esc(o)}</option>`).join('')}</select>`;
    else if(f.type==='textarea')inp=`<textarea name="${f.k}" rows="3" placeholder="${esc(f.ph||'')}">${esc(v||'')}</textarea>`;
    else if(f.type==='month')inp=`<input name="${f.k}" type="month" value="${esc(v||'')}">`;
    else if(f.type==='money')inp=`<input name="${f.k}"${cls} inputmode="numeric" value="${comma(num(v))}" placeholder="0">`;
    else if(f.type==='number')inp=`<input name="${f.k}" inputmode="decimal" value="${v?esc(v):''}" placeholder="0">`;
    else inp=`<input name="${f.k}" type="text" value="${esc(v||'')}" placeholder="${esc(f.ph||'')}">`;
    return `<div class="f"><label class="muted" style="font-size:12px;display:block;margin-bottom:3px">${esc(f.label)}</label>${inp}</div>`;
  }).join('')+`<div class="btns">${onDelete?'<button type="button" class="btn danger" id="mDel" style="margin-right:auto">삭제</button>':''}${extra?'<button type="button" class="btn" id="mExtra">'+esc(extra.label)+'</button>':''}<button type="button" class="btn" id="mCancel">취소</button><button type="submit" class="btn primary">저장</button></div></form>`;
  $('#modalBg').classList.add('show');
  $$('input[inputmode="numeric"]',m).forEach(i=>i.addEventListener('blur',()=>{i.value=comma(num(i.value));}));
  const close=()=>$('#modalBg').classList.remove('show');
  const readForm=()=>{const fd=new FormData($('#mForm')),v={};fields.forEach(f=>{v[f.k]=f.type==='check'?fd.get(f.k)!==null:fd.get(f.k);});return v;};
  $('#mCancel').onclick=close;
  if(onDelete)$('#mDel').onclick=()=>{if(confirm('삭제할까요?')){onDelete();close();}};
  if(extra)$('#mExtra').onclick=()=>{if(extra.onClick(readForm())!==false)close();};
  $('#mForm').onsubmit=e=>{e.preventDefault();if(onSave(readForm())!==false)close();};
  setTimeout(()=>{const first=$('#mForm input,#mForm select,#mForm textarea');if(first)first.focus();},30);
}
$('#modalBg').addEventListener('mousedown',e=>{if(e.target.id==='modalBg')e.target.classList.remove('show');});

/* ══════════ 이벤트 연결 ══════════ */
document.addEventListener('click',e=>{
  const nav=e.target.closest('[data-view]');
  if(nav){go(nav.dataset.view);return;}
  const a=e.target.closest('[data-act]');
  if(!a)return;
  const act=a.dataset.act,id=a.dataset.id;
  if(act==='add-account')accountModal();
  else if(act==='edit-account'){e.stopPropagation();accountModal(id);}
  else if(act==='add-loan')loanModal();
  else if(act==='edit-loan'){e.stopPropagation();loanModal(id);}
  else if(act==='sel-loan'){selLoan=id;renderLoans();}
  else if(act==='import')importFromPlanner();
  else if(act==='export'){
    const blob=new Blob([JSON.stringify(plan,null,1)],{type:'application/json'});
    const l=document.createElement('a');l.href=URL.createObjectURL(blob);l.download='자산관리백업_'+new Date().toISOString().slice(0,10).replace(/-/g,'')+'.json';
    document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(l.href),1500);
  }
  else if(act==='year-edit')yearModal(+a.dataset.age);
  else if(act==='amt-color'){plan.amtColor=a.dataset.c;applyAmtColor();scheduleSave();renderLife();}
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='amtColorPick'){ // 색을 고르는 동안 바로 반영 (창이 닫히지 않게 화면을 다시 그리지는 않음)
    plan.amtColor=t.value;applyAmtColor();scheduleSave();
    $$('.swatch').forEach(b=>b.classList.toggle('on',b.dataset.c.toLowerCase()===t.value.toLowerCase()));
  }
  else if(t.id==='extraRange'){
    extraPay=+t.value;
    const pm=plan.loans.find(l=>l.id===selLoan);
    if(pm){const tmp=document.createElement('div');tmp.innerHTML=simPanel({l:pm});$('#simRes').innerHTML=$('#simRes',tmp).innerHTML;$('#extraVal').textContent='+'+won(extraPay);}
  }
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='goalAmount'){plan.goalAmount=num(t.value);changed();}
  else if(t.id==='goalYM'){plan.goalYM=t.value;changed();}
  else if(t.id==='showPast'){showPast=t.checked;renderLife();}
  else if(t.id==='amtColorPick'){renderLife();}
  else if(t.id==='sBirth'){const v=Math.round(num(t.value));if(v>=1900&&v<=2100){plan.birthYear=v;changed();}}
  else if(t.id==='sAgeMode'){plan.ageMode=t.value==='korean'?'korean':'man';changed();}
  else if(t.id==='sEnd'){const v=Math.round(num(t.value));if(v>=50&&v<=120){plan.endAge=v;changed();}}
  else if(t.id==='sPct'){plan.scenarioPct=Math.max(0,Math.min(90,num(t.value)));changed();}
  else if(t.id==='sInt'){plan.includeInterest=t.checked;changed();}
  else if(t.id==='sRedir'){plan.redirectFreed=t.checked;changed();}
});
document.addEventListener('focusout',e=>{if(e.target.id==='goalAmount')e.target.value=comma(num(e.target.value));});
let _rt=null;
window.addEventListener('resize',()=>{if(view!=='life')return;clearTimeout(_rt);_rt=setTimeout(buildSnake,120);}); // 창 크기가 바뀌면 줄 꺾임을 다시 계산
window.addEventListener('hashchange',()=>{const v=location.hash.slice(1);if(['home','assets','loans','life','settings'].includes(v)&&v!==view)go(v);});

/* ══════════ Ctrl+S 저장 ══════════ */
// 평소엔 입력하면 자동으로 저장되지만, Ctrl+S(맥은 Cmd+S)를 누르면 기다리지 않고 바로 저장함. 브라우저의 "페이지 저장" 창은 뜨지 않게 막음.
async function saveNow(){
  if(!user||!loaded){toast('아직 불러오는 중이에요');return;}
  clearTimeout(saveTimer);
  try{await setDoc(planRef(),plan);toast('저장됨 (Ctrl+S)');}
  catch(e){console.error(e);toast('저장 실패 — 인터넷 연결을 확인해주세요');}
}
window.addEventListener('keydown',async e=>{
  if(e.isComposing||e.keyCode===229)return; // 한글 입력 조합 중이면 무시
  if(!((e.ctrlKey||e.metaKey)&&!e.altKey&&(e.key==='s'||e.key==='S')))return;
  e.preventDefault();e.stopPropagation();
  if($('#modalBg').classList.contains('show')){const b=$('#mForm button[type="submit"]');if(b)b.click();} // 열려 있는 입력 창은 저장 버튼을 누른 것처럼
  const a=document.activeElement;
  if(a&&a!==document.body&&['INPUT','TEXTAREA','SELECT'].includes(a.tagName)&&!$('#modalBg').classList.contains('show')){a.dispatchEvent(new Event('change',{bubbles:true}));a.blur();} // 입력 중이던 칸의 내용을 확정
  await new Promise(r=>setTimeout(r,0)); // 위 변경이 반영된 뒤에 저장
  await saveNow();
},{capture:true});

/* ══════════ 로그인 ══════════ */
$('#loginBtn').onclick=async()=>{try{await signInWithPopup(auth,provider);}catch(e){alert('로그인 실패: '+e.message);}};
$('#logoutBtn').onclick=()=>signOut(auth);

// 다른 컴퓨터에서 고친 내용 따라가기: 창으로 돌아올 때(2분 이상 지났으면) 다시 읽음. 입력 중이거나 창이 열려 있으면 건너뜀.
let hiddenAt=0;
document.addEventListener('visibilitychange',async()=>{
  if(document.visibilityState==='hidden'){hiddenAt=Date.now();return;}
  if(!user||!loaded||!hiddenAt||Date.now()-hiddenAt<120000)return;
  const a=document.activeElement;
  if(a&&(a.tagName==='INPUT'||a.tagName==='TEXTAREA'||a.tagName==='SELECT'))return;
  if($('#modalBg').classList.contains('show'))return;
  try{await loadPlan();refreshModel();renderSide();renderView();}catch(e){console.warn(e);}
  hiddenAt=0;
});

onAuthStateChanged(auth,async u=>{
  user=u;
  if(!u){loaded=false;$('#appWrap').classList.add('hide');$('#bottomNav').style.display='none';$('#loginWrap').classList.remove('hide');return;}
  $('#loginWrap').classList.add('hide');
  try{await loadPlan();}
  catch(e){console.error(e);alert('데이터를 불러오지 못했어요. 저장된 내용은 안전해요. 새로고침해주세요.');return;} // 불러오기 실패 시 저장이 막힌 채로 멈춤
  $('#appWrap').classList.remove('hide');
  $('#bottomNav').style.display='';
  refreshModel();renderSide();
  const v=location.hash.slice(1);
  go(['home','assets','loans','life','settings'].includes(v)?v:'home');
});

// 테스트용으로 계산 함수를 바깥에서 쓸 수 있게 노출
window.__asset={loanSchedule,simulate,firstReach,addMonths,diffMonths,toYM,num,won,wonShort,snakeLayout};
</script>
