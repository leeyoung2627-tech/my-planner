<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>글 콘티 노트</title>
<link rel="icon" type="image/x-icon" href="/favicon/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon/favicon-32x32.png">
<link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700;800&family=Nanum+Myeongjo:wght@400;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
<style>
:root{
  --bg:#FAF9F5; --card:#ffffff; --soft:#F3F1EC; --tint:#ECEAE3;
  --text:#2e2e2e; --sub:#5f5f5f; --border:#ebe8e0; --border2:#e3dfd5;
  --danger:#a64545; --accent:#2e2e2e; --accent-on:#ffffff;
  --memo-bg:#FBF4DC; --memo-border:#E9D9A6;
  --font:'Nanum Gothic','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  box-sizing:border-box;
}
:root[data-theme="dark"]{
  --bg:#1d1b18; --card:#262320; --soft:#2c2925; --tint:#37332d;
  --text:#ece8e1; --sub:#aaa39a; --border:#36322d; --border2:#45403a;
  --danger:#e08a7a; --memo-bg:#332e22; --memo-border:#4d4431;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--font);overflow:hidden;opacity:0;transition:opacity .25s ease}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#loginScreen,#appScreen{display:none}

/* ── 로그인 ── */
.login-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;gap:16px}
.login-box{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:40px;width:320px;display:flex;flex-direction:column;align-items:center;gap:16px}
.login-title{font-size:18px;font-weight:800}
.login-sub{font-size:13px;color:var(--sub);text-align:center;line-height:1.6}
.google-btn{display:flex;align-items:center;gap:10px;padding:10px 20px;border-radius:10px;border:1px solid var(--border2);background:var(--card);cursor:pointer;font-size:14px;width:100%;justify-content:center}
.google-btn:hover{background:var(--soft)}
.google-btn img{width:20px;height:20px}
.back-link{font-size:12px;color:var(--sub);text-decoration:none}

/* ── 전체 배치 ── */
#appScreen{height:100vh}
.side{width:250px;flex-shrink:0;height:100vh;border-right:1px solid var(--border);padding:22px 14px;display:flex;flex-direction:column;gap:4px;overflow-y:auto}
.back{font-size:13px;color:var(--sub);text-decoration:none;padding:0 10px 14px}
.back:hover{color:var(--text)}
.brand{display:flex;align-items:center;gap:6px;padding:0 10px 4px;font-size:12px;color:var(--sub)}
.work-title{border:none;outline:none;background:transparent;font-size:18px;font-weight:800;padding:4px 10px 14px;width:100%;border-radius:8px}
.work-title:hover{background:var(--soft)}
.work-title:focus{background:var(--card);box-shadow:0 0 0 1px var(--border2)}
.side-label{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--sub);padding:12px 10px 6px}
.mini-add{border:1px solid var(--border2);background:var(--card);border-radius:8px;font-size:11px;color:var(--sub);padding:3px 8px;cursor:pointer}
.mini-add:hover{color:var(--text)}
.folder{display:flex;flex-direction:column;gap:2px;margin-bottom:6px}
.folder-row,.ep-row{display:flex;align-items:center;border-radius:10px;border:1px solid transparent}
.folder-row:hover,.ep-row:hover{background:var(--soft)}
.row-main{flex:1;min-width:0;display:flex;align-items:center;gap:8px;min-height:38px;padding:0 4px 0 10px;border:none;background:none;cursor:pointer;text-align:left;font-size:14px}
.folder-row .row-main{font-weight:700}
.chev{width:14px;color:var(--sub);font-size:10px;flex-shrink:0}
.nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-count{font-size:11px;color:var(--sub);font-weight:400;white-space:nowrap}
.ep-list{display:flex;flex-direction:column;gap:2px;padding-left:16px}
.ep-row .row-main{min-height:36px;font-size:13.5px;color:var(--sub)}
.ep-row.active{background:var(--card);border-color:var(--border)}
.ep-row.active .row-main{color:var(--text);font-weight:700}
.opt{width:26px;height:26px;border:none;background:none;border-radius:6px;cursor:pointer;color:var(--sub);font-size:13px;opacity:0;flex-shrink:0;margin-right:4px}
.folder-row:hover .opt,.ep-row:hover .opt,.opt:focus-visible{opacity:1}
.opt:hover{background:var(--tint);color:var(--text)}
.add-ep{align-self:flex-start;margin:2px 0 0 26px;border:none;background:none;font-size:12px;color:var(--sub);cursor:pointer;padding:4px 6px;border-radius:6px}
.add-ep:hover{color:var(--text);background:var(--soft)}
.side-foot{margin-top:auto;padding-top:16px;display:flex;align-items:center;gap:10px;position:relative}
.gear{width:44px;height:44px;border:1px solid var(--border);border-radius:12px;background:var(--card);color:var(--sub);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
.gear:hover{color:var(--text)}
.foot-text{font-size:12px;color:var(--sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.settings-pop{position:absolute;left:0;bottom:56px;width:300px;background:var(--card);border:1px solid var(--border2);border-radius:14px;padding:16px;display:none;z-index:30;box-shadow:0 8px 24px rgba(0,0,0,.08)}
.settings-pop.open{display:block}
.settings-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:10px}
.settings-row:last-child{margin-bottom:0}
.settings-label{font-size:13px;color:var(--sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seg-mini{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.seg-mini button{border:1px solid var(--border2);background:var(--bg);padding:6px 10px;border-radius:8px;font-size:12px;cursor:pointer}
.seg-mini button.active{background:var(--accent);border-color:var(--accent);color:var(--accent-on)}
input[type=color]{width:44px;height:32px;border:1px solid var(--border2);border-radius:8px;padding:2px;background:var(--card);cursor:pointer}
.logout-link{font-size:12px;color:var(--sub);background:none;border:none;cursor:pointer;text-decoration:underline;flex-shrink:0}

.main{flex:1;min-width:0;display:flex;flex-direction:column;height:100vh}
.head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;padding:20px 28px 14px;border-bottom:1px solid var(--border)}
.crumb{font-size:12px;color:var(--sub);margin-bottom:2px}
.ep-title{border:none;outline:none;background:transparent;font-size:21px;font-weight:800;padding:2px 6px;margin-left:-6px;border-radius:8px;width:320px;max-width:100%}
.ep-title:hover{background:var(--soft)}
.ep-title:focus{background:var(--card);box-shadow:0 0 0 1px var(--border2)}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.save-state{font-size:12px;color:var(--sub);min-width:56px;text-align:right}
.save-state.pending{color:#a17d1b}
.save-state.error{color:var(--danger)}
.btn{min-height:36px;padding:0 14px;border:1px solid var(--border2);border-radius:10px;background:var(--card);font-size:13px;cursor:pointer}
.btn:hover{background:var(--soft)}
.btn-primary{min-height:36px;padding:0 16px;border:none;border-radius:10px;background:var(--accent);color:var(--accent-on);font-size:13px;font-weight:800;cursor:pointer}

.work{flex:1;min-height:0;display:flex}
.editor{flex:1;min-width:0;overflow-y:auto;padding:18px 28px 60px;display:flex;flex-direction:column;gap:12px}

/* 줄거리 */
.summary{background:var(--soft);border-radius:16px;padding:14px 18px;display:flex;flex-direction:column;gap:6px}
.summary-title{font-size:13px;font-weight:800}
.summary textarea{width:100%;border:1px solid var(--border);border-radius:10px;background:var(--card);padding:10px 12px;font-size:14px;line-height:1.6;resize:none;overflow:hidden;min-height:44px;outline:none}

/* 컷 */
.cut-list{display:flex;flex-direction:column;gap:10px}
.cut{display:grid;grid-template-columns:52px 1fr 1.2fr;background:var(--card);border:1px solid var(--border);border-radius:16px;overflow:hidden}
.cut.dialog-only{grid-template-columns:52px 1fr}
.cut.space{grid-template-columns:52px 1fr;background:transparent;border:1px dashed var(--border2)}
.cut.dragging{opacity:.45}
.cut-no{display:flex;align-items:flex-start;justify-content:center;padding-top:12px;border:none;border-right:1px solid var(--border);background:none;cursor:grab;user-select:none;min-height:60px}
.cut.space .cut-no{border-right:1px dashed var(--border2);align-items:center;padding-top:0}
.cut-no span{display:inline-flex;align-items:center;justify-content:center;min-width:28px;height:28px;padding:0 6px;border-radius:14px;background:var(--soft);font-weight:800;font-size:13px;color:var(--sub)}
.cut-no:hover span{background:var(--accent);color:var(--accent-on)}
.cell{display:flex;flex-direction:column;border-right:1px solid var(--border);min-width:0}
.cell:last-child{border-right:none}
.cell-head{display:flex;justify-content:space-between;align-items:center;padding:8px 12px 0;font-size:12px;font-weight:700;color:var(--sub)}
.icon-btn{border:none;background:none;color:var(--sub);cursor:pointer;width:26px;height:26px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;font-size:12px}
.icon-btn:hover{background:var(--soft);color:var(--text)}
.icon-btn.danger:hover{color:var(--danger)}
.ta{width:100%;border:none;outline:none;background:transparent;padding:6px 12px 10px;font-size:14px;line-height:1.65;resize:none;overflow:hidden;min-height:42px;display:block}
.ta::placeholder,.space-in::placeholder,.summary textarea::placeholder{color:var(--sub);opacity:.6}
.dlg{border-top:1px dashed var(--border)}
.dlg:first-of-type{border-top:none}
.dlg-head{display:flex;justify-content:space-between;align-items:center;padding:6px 8px 0 12px;font-size:11px;color:var(--sub)}
.dlg-head .acts{display:flex;gap:2px}
.space-cell{display:flex;align-items:center;padding:8px 12px}
.space-in{border:none;outline:none;background:transparent;width:100%;font-size:13px;color:var(--sub);font-style:italic}
.add-cut-area{display:flex;gap:8px}
.add-cut{flex:1;min-height:40px;border:1.5px dashed var(--border2);background:transparent;border-radius:12px;cursor:pointer;color:var(--sub);font-size:13px}
.add-cut:hover{border-color:var(--sub);color:var(--text);background:var(--card)}

/* 메모 패널 */
.memo-panel{width:270px;flex-shrink:0;border-left:1px solid var(--border);display:flex;flex-direction:column;min-height:0}
.memo-head{display:flex;justify-content:space-between;align-items:center;padding:16px 16px 10px;font-size:14px;font-weight:800}
.memo-list{flex:1;overflow-y:auto;padding:0 14px 20px;display:flex;flex-direction:column;gap:10px}
.memo{background:var(--memo-bg);border:1px solid var(--memo-border);border-radius:14px;overflow:hidden}
.memo-top{display:flex;align-items:center;gap:4px;padding:6px 6px 0 12px}
.memo-title{flex:1;min-width:0;border:none;outline:none;background:transparent;font-size:12px;font-weight:800}
.memo .ta{font-size:13px;min-height:70px;padding:4px 12px 12px}
.add-memo{min-height:38px;border:1.5px dashed var(--memo-border);background:transparent;border-radius:12px;cursor:pointer;color:var(--sub);font-size:13px}
.add-memo:hover{background:var(--memo-bg);color:var(--text)}

/* 메뉴·알림 */
.ctx{position:fixed;display:none;flex-direction:column;z-index:1000;background:var(--card);border:1px solid var(--border2);border-radius:12px;padding:6px;min-width:170px;box-shadow:0 8px 24px rgba(0,0,0,.1)}
.ctx button{display:block;width:100%;text-align:left;border:none;background:none;padding:9px 10px;border-radius:8px;font-size:13px;cursor:pointer}
.ctx button:hover{background:var(--soft)}
.ctx button.danger{color:var(--danger)}
.ctx hr{border:none;border-top:1px solid var(--border);margin:4px 0}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(10px);background:var(--accent);color:var(--accent-on);padding:10px 16px;border-radius:12px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:3000}
#toast.show{opacity:1;transform:translateX(-50%)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div id="loginScreen" class="login-wrap">
  <div class="login-box">
    <div class="login-title">글 콘티 노트</div>
    <div class="login-sub">플래너와 같은 계정으로 로그인하면<br>어디서든 저장돼요.</div>
    <button class="google-btn" id="loginBtn">
      <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="">
      Google로 로그인
    </button>
  </div>
  <a class="back-link" href="/">← 플래너로 돌아가기</a>
</div>

<div id="appScreen">
  <aside class="side">
    <a class="back" href="/">← 플래너로</a>
    <div class="brand">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#c9a94a" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></svg>
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#6fae8c" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="7.5" r="3.5"/><circle cx="7.5" cy="12" r="3.5"/><circle cx="16.5" cy="12" r="3.5"/><circle cx="12" cy="16.5" r="3.5"/><path d="M12 16.5l2 5"/></svg>
      글 콘티 노트
    </div>
    <input class="work-title" id="workTitle" spellcheck="false" aria-label="작품 이름" placeholder="작품 이름">
    <div class="side-label"><span>폴더</span><button class="mini-add" id="addFolderBtn">+ 폴더</button></div>
    <div id="folderList"></div>
    <div class="side-foot">
      <button class="gear" id="settingsBtn" aria-label="설정">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>
      </button>
      <span class="foot-text" id="userEmail"></span>
      <div class="settings-pop" id="settingsPanel">
        <div class="settings-row">
          <span class="settings-label">테마</span>
          <div class="seg-mini" id="themeGroup">
            <button data-v="system">시스템</button><button data-v="light">라이트</button><button data-v="dark">다크</button>
          </div>
        </div>
        <div class="settings-row">
          <span class="settings-label">강조 색상</span>
          <input type="color" id="accentPicker" aria-label="강조 색상">
        </div>
        <div class="settings-row">
          <span class="settings-label">글꼴</span>
          <div class="seg-mini" id="fontGroup">
            <button data-v="nanum">나눔</button><button data-v="system">시스템</button><button data-v="serif">명조</button><button data-v="mono">모노</button>
          </div>
        </div>
        <div class="settings-row">
          <span class="settings-label" id="settingsEmail"></span>
          <button class="logout-link" id="logoutBtn">로그아웃</button>
        </div>
      </div>
    </div>
  </aside>

  <div class="main">
    <div class="head">
      <div>
        <div class="crumb" id="crumb"></div>
        <input class="ep-title" id="epTitle" spellcheck="false" aria-label="화 제목" placeholder="화 제목">
      </div>
      <div class="tools">
        <span class="save-state" id="saveState" role="status" aria-live="polite"></span>
        <button class="btn" id="exportBtn">내보내기</button>
        <button class="btn" id="importBtn">불러오기</button>
        <button class="btn-primary" id="saveBtn">저장</button>
      </div>
    </div>
    <div class="work">
      <div class="editor" id="editor">
        <div class="summary">
          <span class="summary-title">이 화 줄거리</span>
          <textarea id="summaryInput" placeholder="이 화의 핵심 내용을 기록하세요..." spellcheck="false" aria-label="이 화 줄거리"></textarea>
        </div>
        <div class="cut-list" id="cutList"></div>
        <div class="add-cut-area">
          <button class="add-cut" data-type="cut">+ 컷 추가</button>
          <button class="add-cut" data-type="dialog">+ 대사만</button>
          <button class="add-cut" data-type="space">+ 여백</button>
        </div>
      </div>
      <aside class="memo-panel">
        <div class="memo-head"><span>메모</span><button class="mini-add" id="addMemoTop">+ 메모</button></div>
        <div class="memo-list" id="memoList"></div>
      </aside>
    </div>
  </div>
</div>

<div class="ctx" id="ctxMenu" role="menu"></div>
<div id="toast" role="status" aria-live="polite"></div>
<input type="file" id="importInput" accept=".json" style="display:none">

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBkSmyAwRUlpgZBUz0kXqCVoS29dYht7No",
  authDomain: "my-planner-3728c.firebaseapp.com",
  projectId: "my-planner-3728c",
  storageBucket: "my-planner-3728c.firebasestorage.app",
  messagingSenderId: "179812397978",
  appId: "1:179812397978:web:3525714542291e818e0023"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const provider = new GoogleAuthProvider();

const $ = id => document.getElementById(id);
function h(tag, cls, text){
  const e = document.createElement(tag);
  if(cls) e.className = cls;
  if(text != null) e.textContent = text;
  return e;
}
function autoResize(ta){ ta.style.height = 'auto'; ta.style.height = ta.scrollHeight + 'px'; }

let currentUser = null;
let saveTimer = null;
let unsaved = false;

// ── 데이터 (저장 형식은 기존과 동일: users/{uid}/writing/main) ──
function uid(p){ return p + Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
function makeCut(type){
  const id = uid('c');
  if(type === 'dialog') return { id, type:'dialog', dialogs:[''] };
  if(type === 'space') return { id, type:'space', text:'' };
  return { id, type:'cut', scene:'', dialogs:[''] };
}
function makeEpisode(title, cutCount){
  return { id: uid('e'), title, summary:'', cuts: Array.from({ length: cutCount }, () => makeCut('cut')), memos: [] };
}
function defaultState(){
  return { title:'새 작품', folders:[{ id:'f0', title:'기본 폴더', collapsed:false, episodes:[ makeEpisode('1화', 3) ] }] };
}
let state = defaultState();
let curFIdx = 0, curEIdx = 0;

function normalize(s){
  if(!s || typeof s !== 'object') s = defaultState();
  if(typeof s.title !== 'string') s.title = '새 작품';
  if(!Array.isArray(s.folders) || !s.folders.length) s.folders = defaultState().folders;
  s.folders.forEach(f => {
    if(!f.id) f.id = uid('f');
    if(typeof f.title !== 'string') f.title = '폴더';
    f.collapsed = !!f.collapsed;
    if(!Array.isArray(f.episodes) || !f.episodes.length) f.episodes = [ makeEpisode('1화', 1) ];
    f.episodes.forEach(ep => {
      if(!ep.id) ep.id = uid('e');
      if(typeof ep.title !== 'string') ep.title = '';
      if(typeof ep.summary !== 'string') ep.summary = '';
      if(!Array.isArray(ep.cuts) || !ep.cuts.length) ep.cuts = [ makeCut('cut') ];
      ep.cuts.forEach(c => {
        if(!c.id) c.id = uid('c');
        if(c.type !== 'dialog' && c.type !== 'space') c.type = 'cut';
        if(c.type !== 'space' && (!Array.isArray(c.dialogs) || !c.dialogs.length)) c.dialogs = [''];
      });
      if(!Array.isArray(ep.memos)) ep.memos = [];
    });
  });
  return s;
}
function curFolder(){ return state.folders[curFIdx]; }
function curEp(){ const f = curFolder(); return f ? f.episodes[curEIdx] : null; }
function clampCur(){
  curFIdx = Math.min(Math.max(0, curFIdx), state.folders.length - 1);
  curEIdx = Math.min(Math.max(0, curEIdx), curFolder().episodes.length - 1);
}
function rememberCur(){ try{ const ep = curEp(); if(ep) localStorage.setItem('writing-last-ep', ep.id); }catch(e){} }
function restoreCur(){
  let id = null;
  try{ id = localStorage.getItem('writing-last-ep'); }catch(e){}
  curFIdx = 0; curEIdx = 0;
  if(!id) return;
  state.folders.forEach((f, fi) => f.episodes.forEach((ep, ei) => { if(ep.id === id){ curFIdx = fi; curEIdx = ei; } }));
}

// ── 로그인 ──
$('loginBtn').onclick = async () => { try{ await signInWithPopup(auth, provider); }catch(e){ alert('로그인 실패: ' + e.message); } };
$('logoutBtn').onclick = async () => {
  if(unsaved) await saveNow(true);
  if(confirm('로그아웃할까요?')) await signOut(auth);
};
onAuthStateChanged(auth, async user => {
  document.body.style.opacity = '1';
  if(user){
    currentUser = user;
    $('loginScreen').style.display = 'none';
    $('appScreen').style.display = 'flex';
    $('userEmail').textContent = user.email || '';
    $('settingsEmail').textContent = user.email || '';
    await loadData();
    restoreCur();
    renderAll();
    setSaveState('saved');
  } else {
    currentUser = null;
    $('appScreen').style.display = 'none';
    $('loginScreen').style.display = 'flex';
  }
});

// ── 저장 ──
async function loadData(){
  try{
    const snap = await getDoc(doc(db,'users',currentUser.uid,'writing','main'));
    state = normalize(snap.exists() ? snap.data() : null);
  }catch(e){
    console.error('로드 실패', e);
    alert('글 콘티를 불러오지 못했어요. 새로고침 해주세요.\n(' + e.message + ')');
    state = normalize(null);
  }
}
function setSaveState(s){
  const el = $('saveState');
  el.className = 'save-state' + (s === 'pending' ? ' pending' : s === 'error' ? ' error' : '');
  el.textContent = s === 'pending' ? '저장 중...' : s === 'error' ? '저장 실패' : '저장됨';
}
async function saveNow(quiet){
  if(!currentUser) return;
  clearTimeout(saveTimer);
  try{
    await setDoc(doc(db,'users',currentUser.uid,'writing','main'), state);
    unsaved = false;
    setSaveState('saved');
    if(!quiet) toast('저장했어요');
  }catch(e){
    setSaveState('error');
    toast('저장 실패. 잠시 후 다시 시도해 주세요');
    console.error(e);
  }
}
function scheduleSave(){
  unsaved = true;
  setSaveState('pending');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => saveNow(true), 1200);
}
$('saveBtn').onclick = () => saveNow();
document.addEventListener('keydown', e => {
  if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's'){ e.preventDefault(); if(currentUser) saveNow(); }
});
window.addEventListener('beforeunload', e => { if(unsaved){ e.preventDefault(); e.returnValue = ''; } });

// ── 렌더 ──
function renderAll(){
  clampCur();
  rememberCur();
  const wt = $('workTitle');
  if(document.activeElement !== wt) wt.value = state.title || '';
  renderSidebar();
  renderEditor();
}
function renderSidebar(){
  const box = $('folderList'); box.innerHTML = '';
  state.folders.forEach((f, fi) => {
    const wrap = h('div','folder');
    const row = h('div','folder-row');
    const main = h('button','row-main');
    main.setAttribute('aria-expanded', f.collapsed ? 'false' : 'true');
    main.appendChild(h('span','chev', f.collapsed ? '▶' : '▼'));
    main.appendChild(h('span','nm', f.title || '이름 없는 폴더'));
    main.appendChild(h('span','row-count', f.episodes.length + '화'));
    main.onclick = () => { f.collapsed = !f.collapsed; scheduleSave(); renderSidebar(); };
    main.ondblclick = () => renameFolder(fi);
    row.appendChild(main);
    const opt = h('button','opt','⋮'); opt.setAttribute('aria-label','폴더 메뉴');
    opt.onclick = e => openCtx(e, [
      { label:'이름 바꾸기', action:() => renameFolder(fi) },
      { label:'화 추가', action:() => addEpisode(fi) },
      'divider',
      { label:'폴더 삭제', cls:'danger', action:() => deleteFolder(fi) }
    ]);
    row.appendChild(opt);
    wrap.appendChild(row);

    if(!f.collapsed){
      const list = h('div','ep-list');
      f.episodes.forEach((ep, ei) => {
        const er = h('div', 'ep-row' + (fi === curFIdx && ei === curEIdx ? ' active' : ''));
        const em = h('button','row-main');
        em.appendChild(h('span','nm', ep.title || '제목 없는 화'));
        em.appendChild(h('span','row-count', '컷 ' + ep.cuts.length));
        em.onclick = () => { curFIdx = fi; curEIdx = ei; renderAll(); $('editor').scrollTop = 0; };
        er.appendChild(em);
        const eo = h('button','opt','⋮'); eo.setAttribute('aria-label','화 메뉴');
        eo.onclick = e => openCtx(e, [
          { label:'화 복제', action:() => duplicateEpisode(fi, ei) },
          'divider',
          { label:'화 삭제', cls:'danger', action:() => deleteEpisode(fi, ei) }
        ]);
        er.appendChild(eo);
        list.appendChild(er);
      });
      wrap.appendChild(list);
      const add = h('button','add-ep','+ 화 추가');
      add.onclick = () => addEpisode(fi);
      wrap.appendChild(add);
    }
    box.appendChild(wrap);
  });
}
function renderEditor(){
  const ep = curEp(); if(!ep) return;
  $('crumb').textContent = curFolder().title || '이름 없는 폴더';
  const et = $('epTitle');
  if(document.activeElement !== et) et.value = ep.title || '';
  const sm = $('summaryInput');
  sm.value = ep.summary || '';
  requestAnimationFrame(() => autoResize(sm));
  renderCuts();
  renderMemos();
}

// 컷 목록 (끌어서 순서 바꾸기는 번호를 잡고 끌기)
function renderCuts(){
  const list = $('cutList'); list.innerHTML = '';
  const ep = curEp(); if(!ep) return;
  ep.cuts.forEach((cut, ci) => list.appendChild(buildCut(cut, ci)));
}
let sortable = null;
function initSortable(){
  if(sortable || !window.Sortable) return;
  sortable = Sortable.create($('cutList'), {
    handle: '.cut-no', animation: 150, ghostClass: 'dragging',
    onEnd: evt => {
      if(evt.oldIndex === evt.newIndex) return;
      const cuts = curEp().cuts;
      const [moved] = cuts.splice(evt.oldIndex, 1);
      cuts.splice(evt.newIndex, 0, moved);
      scheduleSave(); renderCuts(); renderSidebar();
    }
  });
}
function cutNo(ci){
  const b = h('button','cut-no');
  b.appendChild(h('span', null, String(ci + 1)));
  b.setAttribute('aria-label', `컷 ${ci + 1} 메뉴 (끌어서 순서 바꾸기)`);
  b.title = '누르면 메뉴, 끌면 순서 바꾸기';
  b.onclick = e => openCutMenu(e, ci);
  return b;
}
function textArea(value, placeholder, label, onInput){
  const ta = h('textarea','ta');
  ta.rows = 1; ta.spellcheck = false;
  ta.value = value || ''; ta.placeholder = placeholder;
  ta.setAttribute('aria-label', label);
  ta.addEventListener('input', () => { onInput(ta.value); autoResize(ta); scheduleSave(); });
  requestAnimationFrame(() => autoResize(ta));
  return ta;
}
function copyBtn(getText){
  const b = h('button','icon-btn','⧉');
  b.title = '복사'; b.setAttribute('aria-label','복사');
  b.onclick = () => copyText(getText());
  return b;
}
function buildCut(cut, ci){
  if(cut.type === 'space'){
    const el = h('div','cut space');
    el.appendChild(cutNo(ci));
    const cell = h('div','space-cell');
    const inp = h('input','space-in');
    inp.spellcheck = false; inp.value = cut.text || '';
    inp.placeholder = '여백 / 장면전환 / 지문...';
    inp.setAttribute('aria-label', `컷 ${ci + 1} 여백 내용`);
    inp.addEventListener('input', () => { cut.text = inp.value; scheduleSave(); });
    cell.appendChild(inp);
    el.appendChild(cell);
    return el;
  }
  const el = h('div', 'cut' + (cut.type === 'dialog' ? ' dialog-only' : ''));
  el.appendChild(cutNo(ci));
  if(cut.type === 'cut'){
    const scene = h('div','cell');
    const hd = h('div','cell-head');
    hd.appendChild(h('span', null, '장면'));
    hd.appendChild(copyBtn(() => cut.scene || ''));
    scene.appendChild(hd);
    scene.appendChild(textArea(cut.scene, '장면 묘사를 입력하세요...', `컷 ${ci + 1} 장면`, v => { cut.scene = v; }));
    el.appendChild(scene);
  }
  el.appendChild(buildDialogCell(cut, ci));
  return el;
}
function buildDialogCell(cut, ci){
  const cell = h('div','cell');
  const hd = h('div','cell-head');
  hd.appendChild(h('span', null, '대사'));
  hd.appendChild(copyBtn(() => (cut.dialogs || []).join('\n')));
  cell.appendChild(hd);
  (cut.dialogs || ['']).forEach((dlg, di) => {
    const row = h('div','dlg');
    const rh = h('div','dlg-head');
    rh.appendChild(h('span', null, '대사 ' + (di + 1)));
    const acts = h('div','acts');
    const add = h('button','icon-btn','+'); add.title = '아래에 대사 추가'; add.setAttribute('aria-label','아래에 대사 추가');
    add.onclick = () => { cut.dialogs.splice(di + 1, 0, ''); scheduleSave(); renderCuts(); };
    acts.appendChild(add);
    if(cut.dialogs.length > 1){
      const del = h('button','icon-btn danger','✕'); del.title = '이 대사 삭제'; del.setAttribute('aria-label','이 대사 삭제');
      del.onclick = () => { cut.dialogs.splice(di, 1); scheduleSave(); renderCuts(); };
      acts.appendChild(del);
    }
    rh.appendChild(acts);
    row.appendChild(rh);
    row.appendChild(textArea(dlg, '대사/내레이션...', `컷 ${ci + 1} 대사 ${di + 1}`, v => { cut.dialogs[di] = v; }));
    cell.appendChild(row);
  });
  return cell;
}

function renderMemos(){
  const ep = curEp(); if(!ep) return;
  const list = $('memoList'); list.innerHTML = '';
  ep.memos.forEach((memo, mi) => {
    const card = h('div','memo');
    const top = h('div','memo-top');
    const title = h('input','memo-title');
    title.spellcheck = false; title.value = memo.title || '';
    title.placeholder = '메모 제목';
    title.setAttribute('aria-label','메모 제목');
    title.addEventListener('input', () => { memo.title = title.value; scheduleSave(); });
    top.appendChild(title);
    const del = h('button','icon-btn danger','✕'); del.setAttribute('aria-label','메모 삭제'); del.title = '메모 삭제';
    del.onclick = () => {
      if((memo.content || '').trim() && !confirm('이 메모를 삭제할까요?')) return;
      ep.memos.splice(mi, 1); scheduleSave(); renderMemos();
    };
    top.appendChild(del);
    card.appendChild(top);
    card.appendChild(textArea(memo.content, '메모...', '메모 내용', v => { memo.content = v; }));
    list.appendChild(card);
  });
  const add = h('button','add-memo','+ 메모 추가');
  add.onclick = addMemo;
  list.appendChild(add);
}
function addMemo(){
  const ep = curEp(); if(!ep) return;
  ep.memos.push({ id: uid('m'), title:'메모', content:'' });
  scheduleSave(); renderMemos();
  const titles = $('memoList').querySelectorAll('.memo .ta');
  if(titles.length) titles[titles.length - 1].focus();
}
$('addMemoTop').onclick = addMemo;

// ── 입력 ──
$('workTitle').addEventListener('input', e => { state.title = e.target.value; scheduleSave(); });
$('epTitle').addEventListener('input', e => { const ep = curEp(); if(!ep) return; ep.title = e.target.value; scheduleSave(); renderSidebar(); });
$('summaryInput').addEventListener('input', e => { const ep = curEp(); if(!ep) return; ep.summary = e.target.value; autoResize(e.target); scheduleSave(); });
document.querySelectorAll('.add-cut').forEach(b => b.onclick = () => {
  curEp().cuts.push(makeCut(b.dataset.type));
  scheduleSave(); renderCuts(); renderSidebar();
  const ed = $('editor'); ed.scrollTop = ed.scrollHeight;
});

// ── 컷 메뉴 ──
function openCutMenu(e, ci){
  const cuts = curEp().cuts;
  openCtx(e, [
    { label:'컷 복제', action:() => { const c = JSON.parse(JSON.stringify(cuts[ci])); c.id = uid('c'); cuts.splice(ci + 1, 0, c); scheduleSave(); renderCuts(); renderSidebar(); } },
    { label:'위로 이동', action:() => { if(ci === 0) return; [cuts[ci - 1], cuts[ci]] = [cuts[ci], cuts[ci - 1]]; scheduleSave(); renderCuts(); } },
    { label:'아래로 이동', action:() => { if(ci >= cuts.length - 1) return; [cuts[ci], cuts[ci + 1]] = [cuts[ci + 1], cuts[ci]]; scheduleSave(); renderCuts(); } },
    'divider',
    { label:'컷 삭제', cls:'danger', action:() => {
      if(cuts.length <= 1) return toast('마지막 컷은 삭제할 수 없어요');
      cuts.splice(ci, 1); scheduleSave(); renderCuts(); renderSidebar();
    } }
  ]);
}

// ── 폴더·화 ──
function renameFolder(fi){
  const f = state.folders[fi];
  const name = prompt('폴더 이름', f.title);
  if(name == null || !name.trim()) return;
  f.title = name.trim(); scheduleSave(); renderAll();
}
function addEpisode(fi){
  const f = state.folders[fi];
  f.collapsed = false;
  f.episodes.push(makeEpisode((f.episodes.length + 1) + '화', 3));
  curFIdx = fi; curEIdx = f.episodes.length - 1;
  scheduleSave(); renderAll();
  setTimeout(() => $('epTitle').focus(), 0);
}
function duplicateEpisode(fi, ei){
  const orig = state.folders[fi].episodes[ei];
  const copy = JSON.parse(JSON.stringify(orig));
  copy.id = uid('e'); copy.title = (orig.title || '') + ' (복사)';
  copy.cuts.forEach(c => c.id = uid('c'));
  copy.memos.forEach(m => m.id = uid('m'));
  state.folders[fi].episodes.splice(ei + 1, 0, copy);
  curFIdx = fi; curEIdx = ei + 1;
  scheduleSave(); renderAll();
}
function deleteEpisode(fi, ei){
  const eps = state.folders[fi].episodes;
  if(eps.length <= 1) return toast('폴더에 화가 하나만 남아 있어요');
  if(!confirm(`'${eps[ei].title || '제목 없는 화'}'를 삭제할까요?`)) return;
  eps.splice(ei, 1);
  if(fi === curFIdx){
    if(ei < curEIdx) curEIdx--;
    else if(ei === curEIdx) curEIdx = Math.min(ei, eps.length - 1);
  }
  scheduleSave(); renderAll();
}
function addFolder(){
  const name = prompt('새 폴더 이름', '새 폴더');
  if(name == null) return;
  state.folders.push({ id: uid('f'), title: name.trim() || '새 폴더', collapsed:false, episodes:[ makeEpisode('1화', 1) ] });
  curFIdx = state.folders.length - 1; curEIdx = 0;
  scheduleSave(); renderAll();
}
$('addFolderBtn').onclick = addFolder;
function deleteFolder(fi){
  if(state.folders.length <= 1) return toast('폴더가 하나뿐이에요');
  const f = state.folders[fi];
  if(!confirm(`'${f.title}' 폴더와 안의 화 ${f.episodes.length}개를 모두 삭제할까요?`)) return;
  state.folders.splice(fi, 1);
  if(fi < curFIdx) curFIdx--;
  else if(fi === curFIdx){ curFIdx = Math.min(fi, state.folders.length - 1); curEIdx = 0; }
  scheduleSave(); renderAll();
}

// ── 내보내기 / 불러오기 ──
$('exportBtn').onclick = () => {
  const blob = new Blob([JSON.stringify(state, null, 2)], { type:'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = (state.title || '글콘티').replace(/[\\/:*?"<>|]/g, '_') + '.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  toast('내보내기 완료');
};
$('importBtn').onclick = () => $('importInput').click();
$('importInput').addEventListener('change', e => {
  const file = e.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    let data;
    try{ data = JSON.parse(ev.target.result); }catch(err){ toast('파일 형식이 올바르지 않아요'); return; }
    if(!data || !Array.isArray(data.folders)){ toast('글 콘티 파일이 아니에요'); return; }
    if(!confirm('불러온 파일로 지금 내용을 모두 바꿀까요?\n(혹시 모르니 먼저 내보내기로 백업해 두는 걸 추천해요)')) return;
    state = normalize(data); curFIdx = 0; curEIdx = 0;
    scheduleSave(); renderAll(); toast('불러오기 완료');
  };
  reader.readAsText(file);
  e.target.value = '';
});

// ── 메뉴·복사·알림 ──
function openCtx(e, items){
  e.preventDefault(); e.stopPropagation();
  const menu = $('ctxMenu'); menu.innerHTML = '';
  items.forEach(it => {
    if(it === 'divider'){ menu.appendChild(h('hr')); return; }
    const b = h('button', it.cls || '', it.label);
    b.setAttribute('role','menuitem');
    b.onclick = ev => { ev.stopPropagation(); closeCtx(); it.action(); };
    menu.appendChild(b);
  });
  menu.style.display = 'flex';
  const r = e.currentTarget && e.currentTarget.getBoundingClientRect ? e.currentTarget.getBoundingClientRect() : null;
  let x = e.clientX || (r ? r.right : 0), y = e.clientY || (r ? r.bottom : 0);
  const mw = menu.offsetWidth, mh = menu.offsetHeight;
  if(x + mw > window.innerWidth - 10) x = window.innerWidth - mw - 10;
  if(y + mh > window.innerHeight - 10) y = Math.max(10, y - mh);
  menu.style.left = x + 'px'; menu.style.top = y + 'px';
  const first = menu.querySelector('button'); if(first) first.focus();
}
function closeCtx(){ $('ctxMenu').style.display = 'none'; }
document.addEventListener('click', e => {
  if(!e.target.closest('#ctxMenu')) closeCtx();
  if(!e.target.closest('#settingsPanel') && !e.target.closest('#settingsBtn')) $('settingsPanel').classList.remove('open');
});
document.addEventListener('keydown', e => { if(e.key === 'Escape') closeCtx(); });
async function copyText(text){
  try{ await navigator.clipboard.writeText(text); toast('복사했어요'); }
  catch(e){ toast('복사하지 못했어요. 브라우저 권한을 확인해 주세요'); }
}
function toast(msg){
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 1800);
}

// ── 설정 (테마·강조색·글꼴, 기기별 저장) ──
const FONTS = {
  nanum: "'Nanum Gothic','Apple SD Gothic Neo','Malgun Gothic',sans-serif",
  system: "'Apple SD Gothic Neo','Malgun Gothic',sans-serif",
  serif: "'Nanum Myeongjo','Noto Serif KR',Georgia,serif",
  mono: "'D2Coding','Courier New',monospace"
};
function loadSettings(){
  const d = { theme:'system', accent:'#2e2e2e', font:'nanum' };
  try{ const raw = localStorage.getItem('writing-settings-v2'); if(raw) return Object.assign(d, JSON.parse(raw)); }catch(e){}
  return d;
}
let settings = loadSettings();
function saveSettings(){ try{ localStorage.setItem('writing-settings-v2', JSON.stringify(settings)); }catch(e){} }
function lum(hex){
  hex = (hex || '#000000').replace('#','');
  if(hex.length === 3) hex = hex.split('').map(c => c + c).join('');
  const r = parseInt(hex.slice(0,2),16), g = parseInt(hex.slice(2,4),16), b = parseInt(hex.slice(4,6),16);
  return (0.299*r + 0.587*g + 0.114*b) / 255;
}
const darkMQ = window.matchMedia('(prefers-color-scheme: dark)');
function applySettings(){
  const root = document.documentElement;
  const t = settings.theme === 'system' ? (darkMQ.matches ? 'dark' : 'light') : settings.theme;
  root.setAttribute('data-theme', t);
  let acc = settings.accent || '#2e2e2e';
  if(t === 'dark' && lum(acc) < 0.22) acc = '#e8e3da';
  root.style.setProperty('--accent', acc);
  root.style.setProperty('--accent-on', lum(acc) > 0.6 ? '#2e2e2e' : '#ffffff');
  root.style.setProperty('--font', FONTS[settings.font] || FONTS.nanum);
  document.querySelectorAll('#themeGroup button').forEach(b => b.classList.toggle('active', b.dataset.v === settings.theme));
  document.querySelectorAll('#fontGroup button').forEach(b => b.classList.toggle('active', b.dataset.v === settings.font));
  $('accentPicker').value = settings.accent || '#2e2e2e';
}
if(darkMQ.addEventListener) darkMQ.addEventListener('change', () => { if(settings.theme === 'system') applySettings(); });
$('settingsBtn').onclick = e => { e.stopPropagation(); $('settingsPanel').classList.toggle('open'); };
document.querySelectorAll('#themeGroup button').forEach(b => b.onclick = () => { settings.theme = b.dataset.v; saveSettings(); applySettings(); });
document.querySelectorAll('#fontGroup button').forEach(b => b.onclick = () => { settings.font = b.dataset.v; saveSettings(); applySettings(); renderEditor(); });
$('accentPicker').oninput = e => { settings.accent = e.target.value; saveSettings(); applySettings(); };

applySettings();
initSortable();
</script>
