<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>아이디어 정리 — 두목의 플래너</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700;800&display=swap">
<style>
:root{
  --bg:#FAF9F5; --card:#ffffff; --soft:#F3F1EC; --tint:#ECEAE3;
  --text:#2e2e2e; --sub:#5f5f5f; --border:#ebe8e0; --border2:#e3dfd5;
  --danger:#a64545; --accent:#2e2e2e; --accent-on:#ffffff;
  --canvas:#ffffff; --grid:#efece5;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
:root[data-theme="dark"]{
  --bg:#1d1b18; --card:#262320; --soft:#2c2925; --tint:#37332d;
  --text:#ece8e1; --sub:#aaa39a; --border:#36322d; --border2:#45403a;
  --danger:#e08a7a; --canvas:#221f1c; --grid:#2f2b27;
}
*{box-sizing:border-box;}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:'Nanum Gothic','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  min-height:100vh; opacity:0; transition:opacity .25s ease;
}
button,input,select,textarea{font:inherit;color:inherit;}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
#loginWrap,#mainApp{display:none;}

/* ── 로그인 ── */
.login-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:16px}
.login-box{background:var(--card);border-radius:18px;padding:40px;width:320px;display:flex;flex-direction:column;align-items:center;gap:16px;border:1px solid var(--border)}
.login-title{font-size:18px;font-weight:800}
.login-sub{font-size:13px;color:var(--sub);text-align:center;line-height:1.6}
.google-btn{display:flex;align-items:center;gap:10px;padding:10px 20px;border-radius:10px;border:1px solid var(--border2);background:var(--card);cursor:pointer;font-size:14px;width:100%;justify-content:center}
.google-btn:hover{background:var(--soft)}
.google-btn img{width:20px;height:20px}
.back-link{font-size:12px;color:var(--sub);text-decoration:none}

/* ── 사이드바 ── */
.side{width:240px;flex-shrink:0;position:sticky;top:0;height:100vh;border-right:1px solid var(--border);padding:22px 14px;display:flex;flex-direction:column;gap:4px;overflow-y:auto}
.back{font-size:13px;color:var(--sub);text-decoration:none;padding:0 10px 14px}
.back:hover{color:var(--text)}
.brand{display:flex;align-items:center;gap:6px;padding:0 10px 16px}
.brand span{font-size:17px;font-weight:800;margin-left:2px}
.nav-item{display:flex;align-items:center;gap:10px;min-height:44px;padding:0 12px;border-radius:12px;border:none;background:none;font-size:15px;cursor:pointer;text-align:left;width:100%}
.nav-item:hover{background:var(--soft)}
.nav-item.active{background:var(--tint);font-weight:800}
.nav-item .count{margin-left:auto;font-size:12px;font-weight:400;color:var(--sub)}
.side-label{font-size:12px;color:var(--sub);padding:22px 10px 6px}
.side-list{display:flex;flex-direction:column;gap:2px}
.side-row{display:flex;align-items:center;border-radius:10px;border:1px solid transparent}
.side-row:hover{background:var(--soft)}
.side-row.active{background:var(--card);border-color:var(--border)}
.row-main{flex:1;min-width:0;display:flex;align-items:center;gap:10px;min-height:40px;padding:0 4px 0 12px;border:none;background:none;cursor:pointer;font-size:14px;text-align:left}
.side-row.active .row-main{font-weight:700}
.row-main .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-count{font-size:12px;color:var(--sub);font-weight:400}
.dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.row-act{display:none;padding-right:4px}
.side-row:hover .row-act,.side-row:focus-within .row-act{display:flex}
.mini{width:26px;height:26px;border:none;background:none;border-radius:6px;cursor:pointer;color:var(--sub);font-size:12px}
.mini:hover{background:var(--tint);color:var(--text)}
.small-btn{align-self:flex-start;margin-top:6px;min-height:32px;padding:0 12px;border:1px solid var(--border2);border-radius:8px;background:var(--card);color:var(--sub);font-size:12px;cursor:pointer}
.small-btn:hover{color:var(--text)}
.side-foot{margin-top:auto;padding-top:16px;display:flex;align-items:center;gap:10px;position:relative}
.gear{width:44px;height:44px;border:1px solid var(--border);border-radius:12px;background:var(--card);color:var(--sub);display:flex;align-items:center;justify-content:center;cursor:pointer}
.gear:hover{color:var(--text)}
.saving-tag{font-size:12px;color:var(--sub)}
.settings-pop{position:absolute;left:0;bottom:56px;width:290px;background:var(--card);border:1px solid var(--border2);border-radius:14px;padding:16px;display:none;z-index:30;box-shadow:0 8px 24px rgba(0,0,0,.08)}
.settings-pop.open{display:block}
.settings-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:10px}
.settings-row:last-child{margin-bottom:0}
.settings-label{font-size:13px;color:var(--sub);overflow:hidden;text-overflow:ellipsis}
.theme-group{display:flex;gap:4px}
.theme-group button{border:1px solid var(--border2);background:var(--bg);padding:6px 10px;border-radius:8px;font-size:12px;cursor:pointer}
.theme-group button.active{background:var(--accent);border-color:var(--accent);color:var(--accent-on)}
input[type=color]{width:44px;height:32px;border:1px solid var(--border2);border-radius:8px;padding:2px;background:var(--card);cursor:pointer}
.logout-link{font-size:12px;color:var(--sub);background:none;border:none;cursor:pointer;text-decoration:underline;flex-shrink:0}

/* ── 본문 공통 ── */
.main{flex:1;min-width:0;padding:22px 28px 40px}
.page-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}
h1{margin:0 0 4px;font-size:21px;font-weight:800;letter-spacing:-0.01em}
.sub{margin:0;font-size:13px;color:var(--sub)}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.search{min-height:38px;width:220px;border:1px solid var(--border2);border-radius:10px;background:var(--card);padding:0 12px;font-size:13px}
.seg{display:flex;background:var(--soft);border-radius:12px;padding:4px;gap:4px}
.seg button{min-height:32px;padding:0 14px;border:none;border-radius:9px;background:none;color:var(--sub);font-size:13px;cursor:pointer}
.seg button.active{background:var(--card);color:var(--text);font-weight:800}
.btn{min-height:36px;padding:0 14px;border:1px solid var(--border2);border-radius:10px;background:var(--card);font-size:13px;cursor:pointer}
.btn:hover{background:var(--soft)}
.btn.strong{font-weight:800}
.btn-primary{min-height:38px;padding:0 18px;border:none;border-radius:10px;background:var(--accent);color:var(--accent-on);font-size:13px;font-weight:800;cursor:pointer}
.sel{min-height:38px;border:1px solid var(--border2);border-radius:10px;padding:0 10px;background:var(--card);font-size:13px}
.sel.small{min-height:32px;font-size:12px;border-radius:8px}

/* ── 아이디어 정리 ── */
.box{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px 18px}
.add-box{display:flex;flex-direction:column;gap:8px;margin-bottom:20px}
.field{border:1px solid var(--border);border-radius:10px;background:var(--bg);padding:10px 12px;font-size:14px;width:100%}
textarea.field{min-height:64px;resize:vertical;line-height:1.5}
.add-row{display:flex;flex-wrap:wrap;gap:8px}
.add-row .field{flex:1 1 260px;width:auto;min-height:38px;padding:0 12px;font-size:13px}
.list-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
.list-title{font-size:14px;font-weight:800}
.list-title span{font-weight:400;color:var(--sub);margin-left:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;align-items:start}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px 18px;display:flex;flex-direction:column;gap:10px;transition:box-shadow .3s}
.card.flash{box-shadow:0 0 0 3px var(--accent)}
.card-top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.note-content{margin:0;font-size:15px;line-height:1.55;white-space:pre-wrap;word-break:break-word}
.pin{width:32px;height:32px;flex-shrink:0;border:none;border-radius:8px;background:none;color:var(--sub);display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:.5}
.pin:hover{opacity:1;background:var(--soft)}
.pin.on{opacity:1;color:var(--text)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;padding:3px 9px;border-radius:10px;color:#2e2e2e;white-space:nowrap}
.tag{font-size:12px;padding:3px 9px;border-radius:10px;background:var(--soft);color:var(--sub);white-space:nowrap;cursor:pointer;border:none}
.tag:hover{color:var(--text)}
.card-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;border-top:1px solid var(--border);padding-top:8px;flex-wrap:wrap}
.foot-left{display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-width:0}
.linked{font-size:12px;color:var(--sub);line-height:1.4}
.txt-btn{border:none;background:none;font-size:12px;color:var(--sub);cursor:pointer;padding:4px 6px;border-radius:6px}
.txt-btn:hover{color:var(--text);background:var(--soft)}
.txt-btn.danger:hover{color:var(--danger)}
.txt-btn.send{color:var(--text);padding-left:0}
.txt-btn.send:hover{background:none;text-decoration:underline}
.empty{color:var(--sub);text-align:center;padding:40px 0;font-size:14px;grid-column:1/-1}
.cloud{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.ctag{display:inline-flex;align-items:center;gap:2px;font-size:13px;padding:5px 6px 5px 12px;border-radius:14px;background:var(--soft);color:var(--text)}
.ctag.selected{background:var(--accent);color:var(--accent-on)}
.ctag .lbl{cursor:pointer;border:none;background:none;padding:0;font-size:13px;color:inherit}
.x-btn{border:none;background:none;color:inherit;opacity:.5;cursor:pointer;font-size:11px;padding:2px 4px}
.x-btn:hover{opacity:1}
.clear-filter{font-size:12px;color:var(--sub);background:none;border:none;cursor:pointer;text-decoration:underline;margin-bottom:12px;padding:0}
.edit-form .field{margin-bottom:0}
.edit-actions{display:flex;gap:8px;justify-content:flex-end}
.edit-actions button{border-radius:8px;padding:6px 14px;font-size:12px;cursor:pointer;border:1px solid var(--border2);background:var(--bg)}
.edit-actions .primary{background:var(--accent);border-color:var(--accent);color:var(--accent-on)}

/* ── 마인드맵 ── */
.map-body{display:flex;gap:16px;height:calc(100vh - 120px);min-height:480px}
.drawer{width:250px;flex-shrink:0;background:var(--soft);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px;min-height:0}
.drawer-title{font-size:14px;font-weight:800}
.drawer-hint{font-size:12px;color:var(--sub);line-height:1.5}
.drawer .search{width:100%}
.fchips{display:flex;flex-wrap:wrap;gap:6px}
.fchip{padding:4px 10px;border-radius:12px;border:2px solid transparent;font-size:12px;cursor:pointer;color:#2e2e2e}
.fchip.on{border-color:#2e2e2e}
.fchip.all{background:var(--card);color:var(--text);border-color:var(--border2)}
.fchip.all.on{background:var(--accent);color:var(--accent-on);border-color:var(--accent)}
.drawer-list{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding-right:2px}
.drawer-empty{font-size:12px;color:var(--sub);text-align:center;padding:20px 0}
.dnote{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.5;cursor:grab;flex-shrink:0}
.dnote:hover{border-color:var(--border2)}
.dnote:active{cursor:grabbing}
.dnote.used{opacity:.55}
.dnote .txt{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap;word-break:break-word}
.dnote .meta{display:flex;gap:6px;align-items:center;margin-top:6px;flex-wrap:wrap}
.dtag{font-size:11px;color:var(--sub)}
.viewport{flex:1;min-width:0;position:relative;overflow:hidden;background-color:var(--canvas);background-image:radial-gradient(var(--grid) 1.2px,transparent 1.2px);background-size:22px 22px;border:1px solid var(--border);border-radius:18px;cursor:grab;touch-action:none;user-select:none}
.viewport.panning{cursor:grabbing}
.viewport.drop{outline:2px dashed var(--accent);outline-offset:-6px}
#layer{position:absolute;left:0;top:0;transform-origin:0 0}
#edges{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;pointer-events:none}
.mm-node{position:absolute;transform:translate(-50%,-50%);border-radius:19px;padding:9px 16px;font-size:14px;width:max-content;max-width:240px;cursor:pointer;border:1.5px solid transparent;display:flex;align-items:center;gap:6px;line-height:1.45;text-align:center}
.mm-node .t{white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere}
.mm-node svg{flex-shrink:0}
.mm-node.root{font-size:16px;font-weight:800;padding:14px 24px;border-radius:24px;max-width:280px;background:var(--accent);color:var(--accent-on)}
.mm-node.l1{font-weight:700;color:#2e2e2e}
.mm-node.deep{background:var(--card);color:var(--text);font-size:13px;padding:7px 14px;border-radius:17px}
.mm-node.sel{box-shadow:0 0 0 3px var(--canvas),0 0 0 5px var(--text)}
.mm-node textarea{border:none;outline:none;background:transparent;font:inherit;color:inherit;width:200px;text-align:center;padding:0;resize:none;overflow:hidden;line-height:1.45;display:block}
.map-hint{position:absolute;left:14px;top:12px;font-size:12px;color:var(--sub);pointer-events:none}
.node-bar{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);display:none;flex-wrap:wrap;justify-content:center;align-items:center;gap:4px;background:var(--card);border:1px solid var(--border2);border-radius:14px;padding:6px;max-width:calc(100% - 32px);z-index:5;cursor:default}
.node-bar.show{display:flex}
.nb{min-height:36px;padding:0 12px;border:none;border-radius:10px;background:none;font-size:13px;cursor:pointer;white-space:nowrap}
.nb:hover{background:var(--soft)}
.nb.danger{color:var(--danger)}
.swatches{display:flex;gap:6px;padding:0 8px;align-items:center}
.sw{width:22px;height:22px;border-radius:50%;border:1px solid rgba(0,0,0,.08);cursor:pointer;padding:0}
.sw.on{outline:2px solid var(--text);outline-offset:1px}
.sw.none{background:var(--card);border:1.5px dashed var(--border2)}
.zoom{display:flex;align-items:center;border:1px solid var(--border2);border-radius:10px;background:var(--card);overflow:hidden}
.zoom button{height:36px;min-width:36px;border:none;background:none;cursor:pointer;font-size:16px}
.zoom button:hover{background:var(--soft)}
.zoom .zl{min-width:52px;font-size:12px;color:var(--sub)}
.map-empty{max-width:420px;padding-top:40px;display:flex;flex-direction:column;gap:14px;align-items:flex-start}

/* ── 팝업 ── */
.pop-menu{position:fixed;display:none;z-index:50;background:var(--card);border:1px solid var(--border2);border-radius:12px;padding:6px;min-width:220px;max-height:60vh;overflow-y:auto;box-shadow:0 8px 24px rgba(0,0,0,.1)}
.pop-menu.open{display:block}
.pm-title{font-size:12px;color:var(--sub);padding:6px 10px}
.pop-menu button{display:block;width:100%;text-align:left;border:none;background:none;padding:9px 10px;border-radius:8px;font-size:13px;cursor:pointer}
.pop-menu button:hover{background:var(--soft)}
.mm-node .memo-badge{position:absolute;top:-7px;right:-7px;width:20px;height:20px;border-radius:50%;background:var(--accent);color:var(--accent-on);display:flex;align-items:center;justify-content:center;border:2px solid var(--canvas)}
.memo-tip{position:fixed;display:none;z-index:45;max-width:300px;background:var(--card);color:var(--text);border:1px solid var(--border2);border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.55;white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere;box-shadow:0 8px 24px rgba(0,0,0,.1);pointer-events:none}
.memo-tip.show{display:block}
.memo-tip .mt-label{display:block;font-size:11px;color:var(--sub);margin-bottom:4px}
.memo-pop{position:fixed;display:none;z-index:55;width:320px;background:var(--card);border:1px solid var(--border2);border-radius:14px;padding:14px;box-shadow:0 10px 30px rgba(0,0,0,.12);flex-direction:column;gap:10px}
.memo-pop.open{display:flex}
.mp-title{font-size:13px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mp-text{min-height:120px;resize:none;overflow-y:hidden;font-size:13px;line-height:1.55;flex-shrink:0}
.mp-row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.mp-row .grow{flex:1}
.mp-sec{border-top:1px solid var(--border);padding-top:10px;display:flex;flex-direction:column;gap:8px}
.mp-sec-title{font-size:12px;color:var(--sub)}
.mp-sec .field{min-height:34px;padding:0 10px;font-size:12px}
.mp-check{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--sub);cursor:pointer}
.mp-hint{font-size:11px;color:var(--sub)}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(10px);background:var(--accent);color:var(--accent-on);padding:10px 16px;border-radius:12px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:60}
#toast.show{opacity:1;transform:translateX(-50%)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div id="loginWrap" class="login-wrap">
  <div class="login-box">
    <div class="login-title">아이디어 정리</div>
    <div class="login-sub">두목의 플래너 계정으로<br>로그인하면 기기 간에 메모가 동기화돼요.</div>
    <button class="google-btn" id="loginBtn">
      <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="">
      Google로 로그인
    </button>
  </div>
  <a class="back-link" href="/">← 플래너로 돌아가기</a>
</div>

<div id="mainApp">
  <aside class="side">
    <a class="back" href="/">← 플래너로</a>
    <div class="brand">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#c9a94a" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></svg>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6fae8c" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="7.5" r="3.5"/><circle cx="7.5" cy="12" r="3.5"/><circle cx="16.5" cy="12" r="3.5"/><circle cx="12" cy="16.5" r="3.5"/><path d="M12 16.5l2 5"/></svg>
      <span>아이디어 노트</span>
    </div>
    <button class="nav-item" id="navIdea">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="3"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>
      아이디어 정리
      <span class="count" id="ideaCount"></span>
    </button>
    <button class="nav-item" id="navMap">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="3.5" r="1.5"/><circle cx="20" cy="15" r="1.5"/><circle cx="4" cy="15" r="1.5"/><path d="M12 9V5M14.6 13.5l4 1M9.4 13.5l-4 1"/></svg>
      마인드맵
    </button>
    <div class="side-label" id="sideLabel"></div>
    <div class="side-list" id="sideList"></div>
    <button class="small-btn" id="sideAddBtn"></button>
    <div class="side-foot">
      <button class="gear" id="settingsBtn" aria-label="설정">

function loadSettings(){
  try{
    const raw = localStorage.getItem('idea-notes-settings-v2');
    if(raw) return Object.assign({ theme:'system', accent:'#2e2e2e' }, JSON.parse(raw));
  }catch(e){}
  let theme = 'system';
  try{
    const old = JSON.parse(localStorage.getItem('idea-notes-settings') || 'null');
    if(old && old.theme) theme = old.theme;
  }catch(e){}
  return { theme, accent:'#2e2e2e' };
}
function saveSettings(){ try{ localStorage.setItem('idea-notes-settings-v2', JSON.stringify(settings)); }catch(e){} }
function lum(hex){
  hex = (hex || '#000000').replace('#','');
  if(hex.length === 3) hex = hex.split('').map(c => c + c).join('');
  const r = parseInt(hex.slice(0,2),16), g = parseInt(hex.slice(2,4),16), b = parseInt(hex.slice(4,6),16);
  return (0.299*r + 0.587*g + 0.114*b) / 255;
}
const darkMQ = window.matchMedia('(prefers-color-scheme: dark)');
function resolvedTheme(){ return settings.theme === 'system' ? (darkMQ.matches ? 'dark' : 'light') : settings.theme; }
function applySettings(){
  const root = document.documentElement;
  const t = resolvedTheme();
  root.setAttribute('data-theme', t);
  let acc = settings.accent || '#2e2e2e';
  if(t === 'dark' && lum(acc) < 0.22) acc = '#e8e3da';
  root.style.setProperty('--accent', acc);
  root.style.setProperty('--accent-on', lum(acc) > 0.6 ? '#2e2e2e' : '#ffffff');
  document.querySelectorAll('#themeGroup button').forEach(b => b.classList.toggle('active', b.dataset.v === settings.theme));
  $('accentPicker').value = settings.accent || '#2e2e2e';
}
if(darkMQ.addEventListener) darkMQ.addEventListener('change', () => { if(settings.theme === 'system') applySettings(); });
$('settingsBtn').onclick = e => { e.stopPropagation(); $('settingsPanel').classList.toggle('open'); };
document.querySelectorAll('#themeGroup button').forEach(b => b.onclick = () => { settings.theme = b.dataset.v; saveSettings(); applySettings(); });
$('accentPicker').oninput = e => { settings.accent = e.target.value; saveSettings(); applySettings(); };

// ── Firestore 동기화 ──
function showSaving(){
  const el = $('savingTag');
  el.textContent = '저장 중...';
  clearTimeout(showSaving._t);
  showSaving._t = setTimeout(() => { el.textContent = ''; }, 900);
}
function ensureCatColors(){
  let changed = false;
  const cc = state.catColors;
  Object.keys(cc).forEach(k => { if(!state.categories.includes(k)){ delete cc[k]; changed = true; } });
  const used = new Set(Object.values(cc));
  state.categories.forEach((c, i) => {
    if(typeof cc[c] !== 'number'){
      let idx = PALETTE.findIndex((_, j) => !used.has(j));
      if(idx < 0) idx = i % PALETTE.length;
      cc[c] = idx; used.add(idx); changed = true;
    }
  });
  return changed;
}
async function loadCloudData(){
  const catRef = doc(db,'users',currentUser.uid,'settings','ideaCategories');
  const catSnap = await getDoc(catRef);
  const d = catSnap.exists() ? catSnap.data() : null;
  if(d && Array.isArray(d.list) && d.list.length){
    state.categories = d.list;
    state.catColors = (d.colors && typeof d.colors === 'object') ? { ...d.colors } : {};
  } else {
    state.categories = [...DEFAULT_CATS];
    state.catColors = {};
  }
  const changed = ensureCatColors();
  if(!d || changed) await saveCategories(true);
  activeCat = state.categories[0];

  const notesSnap = await getDocs(collection(db,'users',currentUser.uid,'ideaNotes'));
  state.notes = notesSnap.docs.map(x => ({ id:x.id, ...x.data() }))
    .map(n => ({ ...n, content: n.content || '', tags: Array.isArray(n.tags) ? n.tags : [], createdAt: n.createdAt || 0 }));

  mapLoadError = null;
  try{
    const mapSnap = await getDocs(collection(db,'users',currentUser.uid,'mindmaps'));
    state.maps = mapSnap.docs.map(x => ({ id:x.id, ...x.data() }))
      .map(m => ({ ...m, title: m.title || '제목 없음', nodes: Array.isArray(m.nodes) ? m.nodes : [], createdAt: m.createdAt || 0 }))
      .sort((a,b) => a.createdAt - b.createdAt);
  }catch(e){
    console.error(e);
    mapLoadError = e;
    state.maps = [];
  }
  if(!state.maps.some(m => m.id === activeMapId)) activeMapId = state.maps[0] ? state.maps[0].id : null;
}
async function saveCategories(silent){
  if(!silent) showSaving();
  markChanged();
  try{ await track(setDoc(doc(db,'users',currentUser.uid,'settings','ideaCategories'), { list: state.categories, colors: state.catColors })); }
  catch(e){ alert('카테고리 저장 중 오류가 발생했어요.\n(' + e.message + ')'); }
}
async function saveNote(note){
  showSaving();
  markChanged();
  try{
    await track(setDoc(doc(db,'users',currentUser.uid,'ideaNotes',note.id), {
      category: note.category, content: note.content, tags: note.tags, createdAt: note.createdAt, pinned: !!note.pinned
    }));

  catch(e){ alert('저장 중 오류가 발생했어요.\n(' + e.message + ')'); }
}
async function removeNoteDoc(id){

  try{ await track(deleteDoc(doc(db,'users',currentUser.uid,'ideaNotes',id))); }
  catch(e){ alert('삭제 중 오류가 발생했어요.\n(' + e.message + ')'); }
}
function mapError(e){
  if(e && e.code === 'permission-denied'){
    alert('마인드맵을 저장할 권한이 없어요. Firebase 보안 규칙에서 users/{uid}/mindmaps 경로를 허용해 주세요.');
  } else {
    alert('마인드맵 저장 중 오류가 발생했어요.\n(' + (e && e.message) + ')');
  }
}
const mapTimers = {};
function saveMap(map){
  map.updatedAt = Date.now();
  showSaving();
  markChanged();
  if(mapTimers[map.id]) clearTimeout(mapTimers[map.id].t);
  const run = async () => {
    if(mapTimers[map.id] && mapTimers[map.id].run === run){ clearTimeout(mapTimers[map.id].t); delete mapTimers[map.id]; }
    try{
      await track(setDoc(doc(db,'users',currentUser.uid,'mindmaps',map.id), {
        title: map.title, nodes: map.nodes.map(cleanNode), createdAt: map.createdAt, updatedAt: map.updatedAt
      }));
    }catch(e){ mapError(e); }
  };
  mapTimers[map.id] = { t: setTimeout(run, 500), run };
}
// 진행 중인 저장 추적 (Ctrl+S에서 끝날 때까지 기다림)
const pendingWrites = new Set();
function track(p){ pendingWrites.add(p); p.then(() => pendingWrites.delete(p), () => pendingWrites.delete(p)); return p; }
async function flushAll(){
  Object.values(mapTimers).map(m => m.run).forEach(run => run());
  await Promise.allSettled([...pendingWrites]);
}
window.addEventListener('beforeunload', e => {
  if(Object.keys(mapTimers).length || pendingWrites.size){ e.preventDefault(); e.returnValue = ''; }
});

// ── 되돌리기 / 다시 실행 ──
// 저장이 일어날 때마다 직전 상태를 기록해 둠. 같은 순간에 일어난 저장들은 한 단계로 묶음.
const HISTORY_MAX = 60;
let undoStack = [], redoStack = [];
let lastSnap = null, historyQueued = false, restoring = false;
function snapshot(){
  return JSON.stringify({ categories: state.categories, catColors: state.catColors, notes: state.notes, maps: state.maps.map(({ updatedAt, ...m }) => m) });
}
function markChanged(){
  if(restoring || historyQueued) return;
  historyQueued = true;
  queueMicrotask(commitHistory);
}
function commitHistory(){
  historyQueued = false;
  const cur = snapshot();
  if(lastSnap == null){ lastSnap = cur; return; }
  if(cur === lastSnap) return;
  undoStack.push({ snap: lastSnap, view, mapId: activeMapId });
  if(undoStack.length > HISTORY_MAX) undoStack.shift();
  redoStack = [];
  lastSnap = cur;
}
function resetHistory(){ undoStack = []; redoStack = []; lastSnap = snapshot(); }
function applySnapshot(entry){
  const target = JSON.parse(entry.snap);
  const cur = JSON.parse(lastSnap);
  restoring = true;
  try{
    state.categories = target.categories;
    state.catColors = target.catColors;
    state.notes = target.notes;
    state.maps = target.maps;
    if(JSON.stringify([cur.categories, cur.catColors]) !== JSON.stringify([target.categories, target.catColors])) saveCategories();
    const curNotes = new Map(cur.notes.map(n => [n.id, JSON.stringify(n)]));
    const tgtIds = new Set(target.notes.map(n => n.id));
    state.notes.forEach(n => { if(curNotes.get(n.id) !== JSON.stringify(n)) saveNote(n); });
    cur.notes.forEach(n => { if(!tgtIds.has(n.id)) removeNoteDoc(n.id); });
    const curMaps = new Map(cur.maps.map(m => [m.id, JSON.stringify(m)]));
    const tgtMapIds = new Set(target.maps.map(m => m.id));
    state.maps.forEach(m => { if(curMaps.get(m.id) !== JSON.stringify(m)) saveMap(m); });
    cur.maps.forEach(m => { if(!tgtMapIds.has(m.id)) removeMapDoc(m.id); });
  } finally {
    restoring = false;
  }
  lastSnap = entry.snap;
  // 화면 상태 정리
  editingId = null; editingNodeId = null;
  if(!state.categories.includes(activeCat)) activeCat = state.categories[0];
  if(drawerCat && !state.categories.includes(drawerCat)) drawerCat = null;
  view = entry.view;
  history.replaceState(null, '', view === 'map' ? '#mindmap' : location.pathname + location.search);
  if(entry.mapId && state.maps.some(m => m.id === entry.mapId)) activeMapId = entry.mapId;
  if(!state.maps.some(m => m.id === activeMapId)){ activeMapId = state.maps[0] ? state.maps[0].id : null; needCenter = true; }
  const map = curMap();
  if(!map || !findNode(map, selectedNodeId)) selectedNodeId = null;
  renderAll();
}
function undo(){
  closeMemoPop(true); closeSendMenu(); hideMemoTip();
  if(historyQueued) commitHistory();
  const entry = undoStack.pop();
  if(!entry){ toast('더 되돌릴 작업이 없어요'); return; }
  redoStack.push({ snap: lastSnap, view, mapId: activeMapId });
  applySnapshot(entry);
  toast('되돌렸어요 (다시 실행: Ctrl+Y)');
}
function redo(){
  closeMemoPop(true); closeSendMenu(); hideMemoTip();
  if(historyQueued) commitHistory();
  const entry = redoStack.pop();
  if(!entry){ toast('다시 실행할 작업이 없어요'); return; }
  undoStack.push({ snap: lastSnap, view, mapId: activeMapId });
  applySnapshot(entry);
  toast('다시 실행했어요');
}

const isSaveKey = ev => (ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === 's';
// ── Ctrl+S: 열려 있는 편집 내용을 확정하고 바로 저장 ──

  toast(had ? '저장했어요' : '모두 저장돼 있어요');
}
document.addEventListener('keydown', e => {
  if(!currentUser || !(e.ctrlKey || e.metaKey) || e.altKey) return;
  const k = e.key.toLowerCase();
  if(k === 's'){ e.preventDefault(); saveNow(); return; }
  if(k !== 'z' && k !== 'y') return;
  // 글자를 입력하는 칸 안에서는 브라우저 기본 되돌리기(글자 단위)를 그대로 씀
  const t = e.target;
  if(t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;
  e.preventDefault();
  if(k === 'y' || (k === 'z' && e.shiftKey)) redo(); else undo();
});
function cleanNode(n){
  const o = { id:n.id, text:n.text, x:n.x, y:n.y, parent: n.parent == null ? null : n.parent };
  if(typeof n.color === 'number') o.color = n.color;
  if(n.noteId) o.noteId = n.noteId;
  if(n.memo && n.memo.trim()) o.memo = n.memo;
  return o;
}
async function removeMapDoc(id){
  if(mapTimers[id]){ clearTimeout(mapTimers[id].t); delete mapTimers[id]; }
  showSaving();
  markChanged();
  try{ await track(deleteDoc(doc(db,'users',currentUser.uid,'mindmaps',id))); }
  catch(e){ mapError(e); }
}

function sortNotes(arr){
  return [...arr].sort((a,b) => (Number(!!b.pinned) - Number(!!a.pinned)) ||
    (sortOrder === 'new' ? b.createdAt - a.createdAt : a.createdAt - b.createdAt));
}
function titleWithCount(el, title, count){
  el.innerHTML = '';
  el.appendChild(document.createTextNode(title));
  el.appendChild(h('span', null, count + '개'));
}
function fillGrid(box, notes, emptyText){
  box.innerHTML = '';

}

function renderIdea(){
  const q = searchQ.trim().toLowerCase();
  $('modeCatBtn').classList.toggle('active', !q && mode === 'cat');
  $('modeTagBtn').classList.toggle('active', !q && mode === 'tag');
  $('catView').style.display = (!q && mode === 'cat') ? '' : 'none';
  $('tagView').style.display = (!q && mode === 'tag') ? '' : 'none';
  $('searchView').style.display = q ? '' : 'none';
  document.querySelectorAll('.sortSel').forEach(s => s.value = sortOrder);

  const sel = $('catSelect');
  sel.innerHTML = '';
  state.categories.forEach(c => {
    const o = document.createElement('option');
    o.value = c; o.textContent = c;
    if(c === activeCat) o.selected = true;
    sel.appendChild(o);
  });

  if(q){
    const res = sortNotes(state.notes.filter(n =>
      n.content.toLowerCase().includes(q) ||
      n.tags.some(t => t.toLowerCase().includes(q)) ||
      (n.category || '').toLowerCase().includes(q)));
    titleWithCount($('searchTitle'), '검색 결과', res.length);
    fillGrid($('searchList'), res, '검색 결과가 없어요. 다른 낱말로 찾아보세요.');
    return;
  }

  if(mode === 'cat'){
    const notes = sortNotes(state.notes.filter(n => n.category === activeCat));
    titleWithCount($('listTitle'), activeCat || '', notes.length);
    fillGrid($('noteList'), notes, '아직 메모가 없어요. 위 칸에 첫 아이디어를 적어보세요.');
  } else {
    const cloud = $('tagCloud'); cloud.innerHTML = '';
    const allTags = [...new Set(state.notes.flatMap(n => n.tags))].sort();
    if(activeTag && !allTags.includes(activeTag)) activeTag = null;
    allTags.forEach(t => {
      const tg = h('span', 'ctag' + (t === activeTag ? ' selected' : ''));
      const label = h('button', 'lbl', '#' + t);
      label.onclick = () => { activeTag = (activeTag === t) ? null : t; renderIdea(); };
      tg.appendChild(label);
      const edit = h('button','x-btn','✎'); edit.title = '태그 이름 수정'; edit.setAttribute('aria-label','태그 이름 수정');
      edit.onclick = e => { e.stopPropagation(); renameTag(t); };
      tg.appendChild(edit);
      const x = h('button','x-btn','✕'); x.title = '태그 삭제'; x.setAttribute('aria-label','태그 삭제');
      x.onclick = e => { e.stopPropagation(); deleteTag(t); };
      tg.appendChild(x);
      cloud.appendChild(tg);
    });
    const info = $('filterInfo'); info.innerHTML = '';
    if(activeTag){
      const c = h('button','clear-filter', `#${activeTag} 필터 해제`);
      c.onclick = () => { activeTag = null; renderIdea(); };
      info.appendChild(c);
    }
    const notes = sortNotes(state.notes.filter(n => activeTag ? n.tags.includes(activeTag) : true));
    titleWithCount($('tagListTitle'), activeTag ? '#' + activeTag : '전체 메모', notes.length);
    fillGrid($('tagNoteList'), notes, allTags.length === 0 ? '아직 태그가 달린 메모가 없어요.' : '해당 태그의 메모가 없어요.');
  }
}

function noteCard(n){
  const div = h('div','card');
  div.dataset.id = n.id;

  if(editingId === n.id){
    div.classList.add('edit-form');
    const ta = h('textarea','field'); ta.value = n.content; ta.setAttribute('aria-label','메모 내용');
    div.appendChild(ta);
    const tagIn = h('input','field'); tagIn.type = 'text'; tagIn.value = n.tags.join(', '); tagIn.placeholder = '태그 (쉼표로 구분)'; tagIn.setAttribute('aria-label','태그');
    div.appendChild(tagIn);
    const actions = h('div','edit-actions');
    const cancel = h('button', null, '취소');
    cancel.onclick = () => { editingId = null; renderIdea(); };
    const ok = h('button','primary','저장');
    ok.onclick = () => {
      const newContent = ta.value.trim();
      if(!newContent) return;
      n.content = newContent;
      n.tags = tagIn.value.trim() ? [...new Set(tagIn.value.split(',').map(t => t.trim()).filter(Boolean))] : [];
      editingId = null;
      saveNote(n); renderIdea();
    };
    actions.appendChild(cancel); actions.appendChild(ok);
    div.appendChild(actions);
    setTimeout(() => ta.focus(), 0);
    return div;
  }

  if(n.pinned) div.style.borderColor = catPal(n.category).dot;

  const top = h('div','card-top');
  top.appendChild(h('p','note-content', n.content));
  const pin = h('button', 'pin' + (n.pinned ? ' on' : ''));
  pin.appendChild(icon(n.pinned ? PIN_ON_SVG : PIN_SVG));
  pin.setAttribute('aria-label', n.pinned ? '고정 해제' : '맨 위에 고정');
  pin.title = n.pinned ? '고정 해제' : '맨 위에 고정';
  pin.onclick = () => { n.pinned = !n.pinned; saveNote(n); renderIdea(); };
  top.appendChild(pin);
  div.appendChild(top);

  const chips = h('div','chips');
  const cl = h('span','chip', n.category); cl.style.background = catPal(n.category).fill;
  chips.appendChild(cl);
  n.tags.forEach(t => {
    const tg = h('button','tag', '#' + t);
    tg.onclick = () => { mode = 'tag'; activeTag = t; clearSearch(); renderAll(); };
    chips.appendChild(tg);
  });
  div.appendChild(chips);

  const foot = h('div','card-foot');
  const left = h('div','foot-left');
  const maps = state.maps.filter(m => m.nodes.some(x => x.noteId === n.id));
  if(maps.length) left.appendChild(h('span','linked', '마인드맵 ' + maps.map(m => `'${m.title}'`).join(', ') + '에 있음'));
  const send = h('button','txt-btn send','+ 마인드맵에 보내기');
  send.onclick = e => { e.stopPropagation(); openSendMenu(n, send); };
  left.appendChild(send);

  const actions = h('div');
  actions.style.display = 'flex';
  const edit = h('button','txt-btn','수정');
  edit.onclick = () => { editingId = n.id; renderIdea(); };
  const del = h('button','txt-btn danger','삭제');
  del.onclick = () => {
    if(confirm('이 메모를 삭제할까요?')){
      state.notes = state.notes.filter(x => x.id !== n.id);
      removeNoteDoc(n.id); renderAll();
    }
  };
  actions.appendChild(edit); actions.appendChild(del);
  foot.appendChild(actions);
  div.appendChild(foot);
  return div;
}

function addCategory(){
  const name = prompt('새 카테고리 이름');
  if(!name || !name.trim()) return;
  const nm = name.trim();
  if(state.categories.includes(nm)){ alert('이미 있는 카테고리 이름이에요.'); return; }
  state.categories.push(nm);
  ensureCatColors();
  activeCat = nm; mode = 'cat'; clearSearch();
  saveCategories(); renderAll();
}
function renameCategory(c){
  const name = prompt('새 카테고리 이름', c);
  if(!name || !name.trim() || name.trim() === c) return;
  const newName = name.trim();
  if(state.categories.includes(newName)){ alert('이미 있는 카테고리 이름이에요.'); return; }
  state.categories = state.categories.map(x => x === c ? newName : x);
  if(typeof state.catColors[c] === 'number'){ state.catColors[newName] = state.catColors[c]; delete state.catColors[c]; }
  ensureCatColors();
  state.notes.forEach(n => { if(n.category === c){ n.category = newName; saveNote(n); } });
  if(activeCat === c) activeCat = newName;
  if(drawerCat === c) drawerCat = newName;
  saveCategories(); renderAll();
}
function deleteCategory(c){
  if(state.categories.length <= 1){ alert('카테고리가 최소 1개는 있어야 해요.'); return; }
  const notesInCat = state.notes.filter(n => n.category === c);
  const msg = notesInCat.length > 0
    ? `'${c}' 카테고리를 삭제하면 그 안의 메모 ${notesInCat.length}개도 함께 삭제돼요. 계속할까요?`
    : `'${c}' 카테고리를 삭제할까요?`;
  if(!confirm(msg)) return;
  state.categories = state.categories.filter(x => x !== c);
  ensureCatColors();
  notesInCat.forEach(n => removeNoteDoc(n.id));
  state.notes = state.notes.filter(n => n.category !== c);
  if(activeCat === c) activeCat = state.categories[0];
  if(drawerCat === c) drawerCat = null;
  saveCategories(); renderAll();
}
function renameTag(t){
  const name = prompt('새 태그 이름', t);
  if(!name || !name.trim() || name.trim() === t) return;
  const newTag = name.trim();
  state.notes.forEach(n => {
    if(n.tags.includes(t)){
      n.tags = [...new Set(n.tags.map(x => x === t ? newTag : x))];
      saveNote(n);
    }
  });
  if(activeTag === t) activeTag = newTag;
  renderIdea();
}
function deleteTag(t){
  if(!confirm(`태그 '#${t}'를 모든 메모에서 없앨까요? (메모 자체는 남아요)`)) return;
  state.notes.forEach(n => {
    if(n.tags.includes(t)){ n.tags = n.tags.filter(x => x !== t); saveNote(n); }

  if(activeTag === t) activeTag = null;

}
function addNote(){

// ── 마인드맵 데이터 ──
function curMap(){ return state.maps.find(m => m.id === activeMapId) || null; }
function findNode(map, id){ return map.nodes.find(n => n.id === id) || null; }
function getRoot(map){ return map.nodes.find(n => n.parent == null) || map.nodes[0]; }
function childrenOf(map, id){ return map.nodes.filter(n => n.parent === id); }
function depthOf(map, nd){
  let d = 0, cur = nd, guard = 0;
  while(cur && cur.parent != null && guard++ < 500){ cur = findNode(map, cur.parent); d++; }
  return d;
}
function branchColor(map, nd){
  let cur = nd, guard = 0;
  while(cur && guard++ < 500){
    if(typeof cur.color === 'number') return cur.color;
    if(cur.parent == null) return null;
    cur = findNode(map, cur.parent);
  }
  return null;
}
function subtreeIds(map, id){
  const out = [id];
  for(let i = 0; i < out.length; i++) childrenOf(map, out[i]).forEach(c => out.push(c.id));
  return out;
}
function nextL1Color(map){
  const root = getRoot(map);
  const counts = PALETTE.map(() => 0);
  childrenOf(map, root.id).forEach(c => { if(typeof c.color === 'number') counts[((c.color % PALETTE.length) + PALETTE.length) % PALETTE.length]++; });
  const min = Math.min(...counts);
  return counts.indexOf(min);
}
function placeNewChild(map, parent){
  const root = getRoot(map);
  const kids = childrenOf(map, parent.id);
  if(parent === root){
    const i = kids.length;
    const ring = Math.floor(i / 6);
    const a = -Math.PI / 2 + (i % 6) * (Math.PI / 3) + ring * (Math.PI / 6);
    const r = 210 + ring * 70;
    return { x: root.x + r * Math.cos(a), y: root.y + r * Math.sin(a) };
  }
  const base = parent.parent != null ? (findNode(map, parent.parent) || root) : root;
  let a = Math.atan2(parent.y - base.y, parent.x - base.x);
  if(parent.x === base.x && parent.y === base.y) a = 0;
  const i = kids.length;
  const off = i === 0 ? 0 : Math.ceil(i / 2) * 0.45 * (i % 2 ? 1 : -1);
  return { x: parent.x + 170 * Math.cos(a + off), y: parent.y + 170 * Math.sin(a + off) };
}
function noteLabel(note){
  const text = (note.content || '').trim();
  return text.length > 300 ? text.slice(0, 300) + '…' : (text || '메모');
}
function addNoteToMap(map, note, parentId, pos){
  const parent = (parentId && findNode(map, parentId)) || getRoot(map);
  const p = pos || placeNewChild(map, parent);
  const nd = { id:newId(), text:noteLabel(note), x:Math.round(p.x), y:Math.round(p.y), parent:parent.id, noteId:note.id };
  const cc = state.catColors[note.category];
  if(typeof cc === 'number') nd.color = cc;
  else if(parent.parent == null) nd.color = nextL1Color(map);
  map.nodes.push(nd);
  saveMap(map);
  return nd;
}

function createMap(){
  const name = prompt('새 마인드맵 이름');
  if(!name || !name.trim()) return null;
  const title = name.trim();
  const now = Date.now();
  const map = { id:newId(), title, createdAt:now, updatedAt:now, nodes:[{ id:newId(), text:title, x:0, y:0, parent:null }] };
  state.maps.push(map);
  activeMapId = map.id;
  try{ localStorage.setItem('idea-notes-active-map', map.id); }catch(e){}
  selectedNodeId = null; editingNodeId = null; needCenter = true;
  saveMap(map);
  return map;
}
function openMap(id){
  closeMemoPop(true);
  activeMapId = id;
  try{ localStorage.setItem('idea-notes-active-map', id); }catch(e){}
  selectedNodeId = null; editingNodeId = null; needCenter = true;
  renderAll();
}
function renameMap(m){
  const name = prompt('마인드맵 이름', m.title);
  if(!name || !name.trim() || name.trim() === m.title) return;
  m.title = name.trim();
  const root = getRoot(m); if(root) root.text = m.title;
  saveMap(m); renderAll();
}
function deleteMap(m){
  if(!confirm(`'${m.title}' 마인드맵을 삭제할까요? 노드 ${m.nodes.length}개가 모두 지워져요. (아이디어 메모는 그대로 남아요)`)) return;
  state.maps = state.maps.filter(x => x.id !== m.id);
  removeMapDoc(m.id);
  if(activeMapId === m.id){ activeMapId = state.maps[0] ? state.maps[0].id : null; selectedNodeId = null; needCenter = true; }
  renderAll();
}

function addChild(parentId){
  const map = curMap(); if(!map) return;
  const parent = (parentId && findNode(map, parentId)) || getRoot(map);
  const pos = placeNewChild(map, parent);
  const nd = { id:newId(), text:'새 노드', x:Math.round(pos.x), y:Math.round(pos.y), parent:parent.id };
  if(parent.parent == null) nd.color = nextL1Color(map);
  map.nodes.push(nd);
  selectedNodeId = nd.id; editingNodeId = nd.id;
  saveMap(map); renderMap(); renderSidebar();
}
function addSibling(id){
  const map = curMap(); if(!map) return;
  const nd = findNode(map, id); if(!nd) return;
  addChild(nd.parent == null ? nd.id : nd.parent);
}
function deleteNode(id){
  const map = curMap(); if(!map) return;
  const nd = findNode(map, id); if(!nd) return;
  if(nd.parent == null){ alert('가운데 노드는 지울 수 없어요. 맵 전체를 지우려면 사이드바에서 삭제해 주세요.'); return; }
  const ids = subtreeIds(map, id);
  if(ids.length > 1 && !confirm(`하위 노드 ${ids.length - 1}개도 함께 지울까요?`)) return;
  const set = new Set(ids);
  map.nodes = map.nodes.filter(n => !set.has(n.id));
  selectedNodeId = nd.parent;
  saveMap(map); renderMap(); renderDrawer(map); renderSidebar();
}
function setNodeColor(idx){
  const map = curMap(); if(!map) return;
  const nd = findNode(map, selectedNodeId); if(!nd || nd.parent == null) return;
  if(idx == null) delete nd.color; else nd.color = idx;
  saveMap(map); renderMap();
}
function autoLayout(){
  const map = curMap(); if(!map) return;
  const root = getRoot(map);
  const leafMemo = {};
  const leaves = id => {
    if(leafMemo[id] != null) return leafMemo[id];
    const k = childrenOf(map, id);
    return (leafMemo[id] = k.length ? k.reduce((s, c) => s + leaves(c.id), 0) : 1);
  };
  const place = (id, a0, a1, depth) => {
    const kids = childrenOf(map, id);
    const total = kids.reduce((s, c) => s + leaves(c.id), 0) || 1;
    let cur = a0;
    kids.forEach(kid => {
      const span = (a1 - a0) * leaves(kid.id) / total;
      const mid = cur + span / 2;
      const r = 210 + (depth - 1) * 170;
      kid.x = Math.round(root.x + r * Math.cos(mid));
      kid.y = Math.round(root.y + r * Math.sin(mid));
      place(kid.id, cur, cur + span, depth + 1);
      cur += span;
    });
  };
  const first = childrenOf(map, root.id)[0];
  const totalAll = leaves(root.id) || 1;
  const start = -Math.PI / 2 - (first ? Math.PI * leaves(first.id) / totalAll : 0);
  place(root.id, start, start + Math.PI * 2, 1);
  saveMap(map); renderMap(); centerOnRoot();
}

function renderMap(){

  hideMemoTip();

  layer.querySelectorAll('.mm-node').forEach(e => e.remove());
  Object.keys(nodeEls).forEach(k => delete nodeEls[k]);
  const root = getRoot(map);
  map.nodes.forEach(nd => {
    const isRoot = nd === root;
    const d = isRoot ? 0 : depthOf(map, nd);
    const e = h('div', 'mm-node ' + (isRoot ? 'root' : d === 1 ? 'l1' : 'deep'));
    e.dataset.id = nd.id;
    const ci = branchColor(map, nd);
    const p = ci == null ? null : pal(ci);
    if(!isRoot){
      if(d === 1){
        e.style.background = p ? p.fill : 'var(--soft)';
        if(!p) e.style.color = 'var(--text)';
      } else {
        e.style.borderColor = p ? p.dot : 'var(--border2)';
      }
    }
    const note = nd.noteId ? state.notes.find(n => n.id === nd.noteId) : null;
    if(note) e.appendChild(icon(NOTE_SVG));
    if(nd.memo && nd.memo.trim()){

      e.addEventListener('mouseleave', hideMemoTip);
    } else {
      e.title = note ? note.content : nd.text;
    }
    if(nd.id === editingNodeId){
      const inp = document.createElement('textarea');
      inp.value = nd.text;
      inp.rows = 1;
      inp.setAttribute('aria-label','노드 내용');
      const grow = () => { inp.style.height = 'auto'; inp.style.height = inp.scrollHeight + 'px'; };
      inp.addEventListener('input', grow);
      inp.addEventListener('keydown', ev => {
        if(!isSaveKey(ev)) ev.stopPropagation();
        if(ev.key === 'Enter' && !ev.shiftKey && !ev.isComposing){ ev.preventDefault(); commitEdit(nd.id, inp.value); }
        else if(ev.key === 'Escape'){ editingNodeId = null; renderMap(); }
      });
      inp.addEventListener('blur', () => commitEdit(nd.id, inp.value));
      e.appendChild(inp);
      setTimeout(() => { grow(); inp.focus(); inp.select(); }, 0);
    } else {
      e.appendChild(h('span','t', nd.text));

function positionAll(){
  const map = curMap(); if(!map) return;
  map.nodes.forEach(nd => { const e = nodeEls[nd.id]; if(e){ e.style.left = nd.x + 'px'; e.style.top = nd.y + 'px'; } });

  while(svg.firstChild) svg.removeChild(svg.firstChild);
  const idx = {};
  map.nodes.forEach(n => { idx[n.id] = n; });
  map.nodes.forEach(nd => {
    if(nd.parent == null) return;

    const ln = document.createElementNS('http://www.w3.org/2000/svg','line');
    ln.setAttribute('x1', p.x); ln.setAttribute('y1', p.y);

const vp = $('viewport');
function applyTransform(){
  $('layer').style.transform = `translate(${panX}px, ${panY}px) scale(${zoom})`;
  $('zoomLabel').textContent = Math.round(zoom * 100) + '%';
}
function centerOnRoot(){
  const map = curMap(); if(!map) return;
  const root = getRoot(map);
  const r = vp.getBoundingClientRect();
  panX = r.width / 2 - root.x * zoom;
  panY = r.height / 2 - root.y * zoom;
  applyTransform();
}
function zoomAt(f, cx, cy){
  const nz = Math.min(2.5, Math.max(0.3, zoom * f));
  const wx = (cx - panX) / zoom, wy = (cy - panY) / zoom;
  zoom = nz;
  panX = cx - wx * zoom; panY = cy - wy * zoom;
  applyTransform();
}
function zoomCenter(f){ const r = vp.getBoundingClientRect(); zoomAt(f, r.width / 2, r.height / 2); }
$('zoomIn').onclick = () => zoomCenter(1.2);
$('zoomOut').onclick = () => zoomCenter(1 / 1.2);
$('zoomLabel').onclick = () => { zoom = 1; centerOnRoot(); };
$('addNodeBtn').onclick = () => { const m = curMap(); if(m) addChild(selectedNodeId || getRoot(m).id); };

vp.addEventListener('wheel', e => {
  e.preventDefault();
  const r = vp.getBoundingClientRect();
  zoomAt(e.deltaY < 0 ? 1.1 : 1 / 1.1, e.clientX - r.left, e.clientY - r.top);
}, { passive:false });

let drag = null;
vp.addEventListener('pointerdown', e => {
  if(e.button !== 0) return;
  if(e.target.closest('#nodeBar')) return;
  if(e.target.tagName === 'TEXTAREA') return;
  const map = curMap(); if(!map) return;
  finishEditing();
  const ne = e.target.closest('.mm-node');
  if(ne){
    const nd = findNode(map, ne.dataset.id); if(!nd) return;
    const ids = subtreeIds(map, nd.id);
    drag = { type:'node', id:nd.id, sx:e.clientX, sy:e.clientY, moved:false,
      orig: ids.map(id => { const n = findNode(map, id); return { n, x:n.x, y:n.y }; }) };
  } else {
    drag = { type:'pan', sx:e.clientX, sy:e.clientY, px:panX, py:panY, moved:false };
    vp.classList.add('panning');
  }
  e.preventDefault();
});
window.addEventListener('pointermove', e => {
  if(!drag) return;
  const dx = e.clientX - drag.sx, dy = e.clientY - drag.sy;
  if(!drag.moved && Math.hypot(dx, dy) < 4) return;
  drag.moved = true;
  hideMemoTip();
  if(drag.type === 'pan'){
    panX = drag.px + dx; panY = drag.py + dy; applyTransform();
  } else {
    drag.orig.forEach(o => { o.n.x = Math.round(o.x + dx / zoom); o.n.y = Math.round(o.y + dy / zoom); });
    positionAll();
  }
});
window.addEventListener('pointerup', () => {
  if(!drag) return;
  const d = drag; drag = null;
  vp.classList.remove('panning');
  const map = curMap(); if(!map) return;
  if(d.type === 'node'){
    if(d.moved) saveMap(map);
    else selectNode(d.id);
  } else if(!d.moved && selectedNodeId){
    selectNode(null);
  }
});
vp.addEventListener('dblclick', e => {

function moveMemoToNote(id, memo, category, tagsRaw, withNodeText){

  const tags = tagsRaw.trim() ? [...new Set(tagsRaw.split(',').map(t => t.trim()).filter(Boolean))] : [];
  const content = withNodeText ? nd.text + '\n' + memo : memo;
  const note = { id: Date.now() + '_' + Math.random().toString(36).slice(2,7), category, content, tags, createdAt: Date.now(), pinned: false };
  state.notes.push(note);
  saveNote(note);
  delete nd.memo;
  if(!nd.noteId) nd.noteId = note.id;
  saveMap(map);
  $('memoPop').classList.remove('open');
  memoNodeId = null;
  renderMap(); renderDrawer(map); renderSidebar();
  toast(`아이디어 노트 '${category}'에 옮겼어요`);
}

// 서랍에서 끌어와 놓기
vp.addEventListener('dragover', e => {
  if(!curMap()) return;
  e.preventDefault();
  e.dataTransfer.dropEffect = 'copy';
  vp.classList.add('drop');
});
vp.addEventListener('dragleave', e => { if(!vp.contains(e.relatedTarget)) vp.classList.remove('drop'); });
vp.addEventListener('drop', e => {
  e.preventDefault();
  vp.classList.remove('drop');
  const data = e.dataTransfer.getData('text/plain') || '';
  if(!data.startsWith('idea-note:')) return;
  const note = state.notes.find(n => n.id === data.slice(10));
  const map = curMap();
  if(!note || !map) return;
  const ne = e.target.closest('.mm-node');
  let parentId, pos = null;
  if(ne) parentId = ne.dataset.id;
  else {
    parentId = selectedNodeId || getRoot(map).id;
    const r = vp.getBoundingClientRect();
    pos = { x:(e.clientX - r.left - panX) / zoom, y:(e.clientY - r.top - panY) / zoom };
  }
  const nd = addNoteToMap(map, note, parentId, pos);
  selectedNodeId = nd.id;
  renderMap(); renderDrawer(map); renderSidebar();
});

// 단축키
document.addEventListener('keydown', e => {
  if(view !== 'map' || !selectedNodeId || editingNodeId) return;
  const t = e.target;
  if(t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT' || t.isContentEditable)) return;
  if(t && t.tagName === 'BUTTON' && (e.key === 'Enter' || e.key === ' ')) return;
  if(t && t.classList && t.classList.contains('dnote') && (e.key === 'Enter' || e.key === ' ')) return;
  if(e.key === 'Tab'){ e.preventDefault(); addChild(selectedNodeId); }
  else if(e.key === 'Enter'){ e.preventDefault(); addSibling(selectedNodeId); }
  else if(e.key === 'Delete' || e.key === 'Backspace'){ e.preventDefault(); deleteNode(selectedNodeId); }
  else if(e.key === 'F2'){ e.preventDefault(); startEdit(selectedNodeId); }
  else if(e.key === 'Escape'){ selectNode(null); }
});

// ── 이미지로 저장 ──
function roundRect(ctx, x, y, w, hh, r){
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + hh, r);
  ctx.arcTo(x + w, y + hh, x, y + hh, r);
  ctx.arcTo(x, y + hh, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
// 화면과 같은 규칙으로 줄바꿈: 직접 넣은 줄바꿈 유지, 띄어쓰기 단위로 넘기고, 너무 긴 낱말은 글자 단위로 자름
function wrapText(ctx, text, maxW){
  const out = [];
  String(text || '').split('\n').forEach(para => {
    const words = para.split(/(\s+)/).filter(w => w.length);
    let line = '';
    words.forEach(w => {
      const test = line + w;
      if(ctx.measureText(test).width <= maxW){ line = test; return; }
      if(line.trim()) out.push(line.trimEnd());
      line = /^\s+$/.test(w) ? '' : w;
      while(ctx.measureText(line).width > maxW && line.length > 1){
        let cut = line.length - 1;
        while(cut > 1 && ctx.measureText(line.slice(0, cut)).width > maxW) cut--;
        out.push(line.slice(0, cut));
        line = line.slice(cut);
      }
    });
    out.push(line.trimEnd());
  });
  return out.length ? out : [''];
}
async function exportImage(){
  const map = curMap(); if(!map || !map.nodes.length) return;
  try{ await document.fonts.ready; }catch(e){}
  const cs = getComputedStyle(document.documentElement);
  const v = name => cs.getPropertyValue(name).trim();
  const FONT = "'Nanum Gothic', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif";
  const c = document.createElement('canvas');
  const ctx = c.getContext('2d');
  const root = getRoot(map);
  const info = map.nodes.map(nd => {
    const isRoot = nd === root;
    const d = isRoot ? 0 : depthOf(map, nd);
    const size = isRoot ? 16 : d === 1 ? 14 : 13;
    const weight = isRoot ? 800 : d === 1 ? 700 : 400;
    ctx.font = `${weight} ${size}px ${FONT}`;
    const padX = isRoot ? 24 : d === 1 ? 16 : 14;
    const padY = isRoot ? 14 : d === 1 ? 9 : 7;
    const maxText = (isRoot ? 280 : 240) - padX * 2;
    const lines = wrapText(ctx, nd.text, maxText);
    const lineH = Math.round(size * 1.45);
    const textW = Math.max(...lines.map(l => ctx.measureText(l).width), 1);
    return { nd, isRoot, d, size, weight, lines, lineH, w: Math.ceil(textW) + padX * 2, h: lines.length * lineH + padY * 2 + 3 };
  });
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  info.forEach(o => {
    minX = Math.min(minX, o.nd.x - o.w / 2); maxX = Math.max(maxX, o.nd.x + o.w / 2);
    minY = Math.min(minY, o.nd.y - o.h / 2); maxY = Math.max(maxY, o.nd.y + o.h / 2);
  });
  const pad = 60, scale = 2;
  const W = maxX - minX + pad * 2, H = maxY - minY + pad * 2;
  c.width = Math.ceil(W * scale); c.height = Math.ceil(H * scale);
  ctx.scale(scale, scale);
  ctx.translate(pad - minX, pad - minY);
  ctx.fillStyle = v('--canvas') || '#ffffff';
  ctx.fillRect(minX - pad, minY - pad, W, H);

  const idx = {};
  map.nodes.forEach(n => { idx[n.id] = n; });
  ctx.lineWidth = 2; ctx.lineCap = 'round';
  map.nodes.forEach(nd => {
    if(nd.parent == null) return;
    const p = idx[nd.parent]; if(!p) return;
    const ci = branchColor(map, nd);
    ctx.strokeStyle = ci == null ? v('--border2') : pal(ci).dot;
    ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(nd.x, nd.y); ctx.stroke();
  });
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  info.forEach(o => {
    const { nd } = o;
    const ci = branchColor(map, nd);
    const p = ci == null ? null : pal(ci);
    roundRect(ctx, nd.x - o.w / 2, nd.y - o.h / 2, o.w, o.h, o.isRoot ? 24 : o.d === 1 ? 19 : 17);
    let textColor;
    if(o.isRoot){ ctx.fillStyle = v('--accent'); ctx.fill(); textColor = v('--accent-on'); }
    else if(o.d === 1){ ctx.fillStyle = p ? p.fill : v('--soft'); ctx.fill(); textColor = p ? '#2e2e2e' : v('--text'); }
    else {
      ctx.fillStyle = v('--card'); ctx.fill();
      ctx.lineWidth = 1.5; ctx.strokeStyle = p ? p.dot : v('--border2'); ctx.stroke();
      textColor = v('--text');
    }
    ctx.fillStyle = textColor;
    ctx.font = `${o.weight} ${o.size}px ${FONT}`;
    const top = nd.y - (o.lines.length * o.lineH) / 2 + o.lineH / 2 + 1;
    o.lines.forEach((l, i) => ctx.fillText(l, nd.x, top + i * o.lineH));
    if(nd.memo && nd.memo.trim()){
      const bx = nd.x + o.w / 2 - 4, by = nd.y - o.h / 2 + 4;
      ctx.beginPath(); ctx.arc(bx, by, 7, 0, Math.PI * 2);
      ctx.fillStyle = v('--accent'); ctx.fill();
      ctx.lineWidth = 2; ctx.strokeStyle = v('--canvas'); ctx.stroke();
    }
  });
  c.toBlob(blob => {
    if(!blob){ alert('이미지를 만들지 못했어요. 맵이 너무 크면 노드를 줄여서 다시 시도해 주세요.'); return; }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = (map.title || '마인드맵').replace(/[\\/:*?"<>|]/g, '_') + '.png';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }, 'image/png');
}
