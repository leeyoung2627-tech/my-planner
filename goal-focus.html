<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>프로젝트</title>
<style>

  /* =========================================================
     폰트
     - 지금은 MemomentKkukkukk.otf 파일이 이 html과 같은 폴더에
       있다고 보고 상대경로로 연결해뒀어요 (미리보기용).
     - 실제 두목님 사이트에 이 페이지를 넣으실 때는, 이미 사이트에
       올려두신 폰트 경로로 아래 src 한 줄만 바꿔주시면 돼요.
       (사이트 전역에 이미 @font-face가 선언되어 있다면 이 블록은
       통째로 지우고 font-family 이름만 재사용하셔도 됩니다.)
     ========================================================= */
  @font-face {
    font-family: 'MemomentKkukkukk';
    src: url('./MemomentKkukkukk.woff2') format('woff2');
    font-weight: 400;
    font-display: swap;
  }

  :root{
    --paper: #FAF5EA;
    --paper-soft: #FFFDF8;
    --ink: #382E24;
    --ink-soft: #8A7B6C;
    --accent: #4F7965;
    --accent-soft: #DCE6DE;
    --highlight: #D68C45;
    --highlight-soft: #F3E1C8;
    --line: #E4D9C5;
    --danger: #B5654A;

    --font-hand: 'MemomentKkukkukk', 'Gaegu', cursive;
    --font-body: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo',
                 'Malgun Gothic', 'Pretendard', sans-serif;
  }

  *{ box-sizing: border-box; }

  html, body{ height: 100%; }

  body{
    margin:0;
    padding: 48px 20px 96px;
    background: var(--paper);
    /* 모눈종이 격자 배경 */
    background-image:
      linear-gradient(rgba(138,123,108,0.16) 1px, transparent 1px),
      linear-gradient(90deg, rgba(138,123,108,0.16) 1px, transparent 1px);
    background-size: 26px 26px;
    color: var(--ink);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- 로그인 화면 ---------- */
  #loginWrap, #mainWrap, #savingIndicator{ display:none; }

  .login-wrap{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    min-height: 80vh; gap:16px; width:100%;
  }
  .login-box{
    background:#fff; border-radius:16px; padding:40px; width:320px;
    display:flex; flex-direction:column; align-items:center; gap:16px;
    box-shadow:0 4px 24px rgba(56,46,36,0.08); border:0.5px solid var(--line);
  }
  .login-title{ font-family: var(--font-hand); font-size:24px; color: var(--ink); }
  .login-sub{ font-size:13px; color: var(--ink-soft); text-align:center; line-height:1.6; }
  .google-btn{
    display:flex; align-items:center; gap:10px; padding:10px 20px; border-radius:8px;
    border:0.5px solid var(--line); background:#fff; cursor:pointer; font-size:14px;
    color:#222; font-family: inherit; width:100%; justify-content:center;
  }
  .google-btn:hover{ background:#f5f5f5; }
  .google-btn img{ width:20px; height:20px; }

  .saving-indicator{
    position:fixed; bottom:20px; right:20px;
    background: var(--accent); color:#fff; padding:8px 14px; border-radius:8px;
    font-size:12px; display:none; z-index:999;
  }

  .page{
    max-width: 720px;
    margin: 0 auto;
  }

  /* ---------- 상단: 목표 + 진행도 링 (히어로) ---------- */

  .hero{
    text-align: center;
    margin-bottom: 44px;
  }

  .hero-eyebrow{
    font-family: var(--font-hand);
    font-size: 17px;
    color: var(--ink-soft);
    margin: 0 0 6px;
  }

  .goal-title{
    font-family: var(--font-hand);
    font-size: 34px;
    line-height: 1.35;
    color: var(--ink);
    margin: 0 auto 26px;
    max-width: 520px;
    background: transparent;
    border: none;
    text-align: center;
    width: 100%;
    resize: none;
    outline: none;
    overflow: hidden;
  }
  .goal-title::placeholder{ color: var(--ink-soft); opacity: .6; }

  .ring-wrap{
    position: relative;
    width: 208px;
    height: 208px;
    margin: 0 auto 14px;
  }
  .ring-wrap svg{ width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring-track{
    fill: none;
    stroke: var(--accent-soft);
    stroke-width: 12;
  }
  .ring-fill{
    fill: none;
    stroke: var(--accent);
    stroke-width: 12;
    stroke-linecap: round;
    filter: url(#wobble);
    transition: stroke-dashoffset .6s cubic-bezier(.4,1.4,.4,1);
  }
  .ring-center{
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .ring-percent{
    font-family: var(--font-hand);
    font-size: 40px;
    color: var(--ink);
    line-height: 1;
  }
  .ring-caption{
    font-size: 12.5px;
    color: var(--ink-soft);
    margin-top: 4px;
  }

  .hero-sub{
    font-size: 13.5px;
    color: var(--ink-soft);
  }

  .new-goal-btn{
    display: inline-block;
    margin-top: 10px;
    font-family: var(--font-body);
    font-size: 13px;
    color: var(--ink-soft);
    background: none;
    border: none;
    text-decoration: underline dashed var(--line);
    text-underline-offset: 3px;
    cursor: pointer;
  }
  .new-goal-btn:hover{ color: var(--danger); }

  /* ---------- 섹션 공통 ---------- */

  .section{ margin-bottom: 40px; }

  .section-title{
    font-family: var(--font-hand);
    font-size: 22px;
    margin: 0 0 4px;
  }
  .section-desc{
    font-size: 13px;
    color: var(--ink-soft);
    margin: 0 0 18px;
  }

  /* ---------- 작은 목표 카드 (스티키노트) ---------- */

  .subgoals{
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .subgoal-card{
    position: relative;
    background: var(--paper-soft);
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: 20px 22px 16px;
    box-shadow: 2px 3px 0 rgba(56,46,36,0.05);
  }
  .subgoal-card:nth-child(odd){ transform: rotate(-0.6deg); }
  .subgoal-card:nth-child(even){ transform: rotate(0.5deg); }

  .subgoal-card::before{
    content: "";
    position: absolute;
    top: -9px;
    left: 26px;
    width: 46px;
    height: 16px;
    background: var(--highlight-soft);
    opacity: .85;
    transform: rotate(-3deg);
    border-radius: 1px;
  }

  .subgoal-head{
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 10px;
  }

  .subgoal-name{
    font-family: var(--font-hand);
    font-size: 19px;
    background: transparent;
    border: none;
    border-bottom: 1px dashed transparent;
    outline: none;
    flex: 1;
    color: var(--ink);
  }
  .subgoal-name:focus{ border-bottom-color: var(--line); }

  .subgoal-progress-label{
    font-size: 12px;
    color: var(--ink-soft);
    white-space: nowrap;
  }

  .subgoal-bar{
    height: 5px;
    border-radius: 3px;
    background: var(--accent-soft);
    overflow: hidden;
    margin-bottom: 14px;
  }
  .subgoal-bar-fill{
    height: 100%;
    background: var(--accent);
    border-radius: 3px;
    transition: width .45s ease;
  }

  .checklist{
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .check-item{
    display: flex;
    align-items: flex-start;
    gap: 10px;
  }

  .check-box{
    flex: none;
    width: 19px;
    height: 19px;
    margin-top: 1px;
    border: 1.5px solid var(--ink-soft);
    border-radius: 4px;
    cursor: pointer;
    position: relative;
    background: var(--paper-soft);
  }
  .check-box svg{
    position:absolute; inset:0; width:100%; height:100%;
    stroke: var(--accent);
    stroke-width: 2.6;
    fill:none;
    stroke-linecap:round; stroke-linejoin:round;
    stroke-dasharray: 20;
    stroke-dashoffset: 20;
    transition: stroke-dashoffset .28s ease;
  }
  .check-item.done .check-box{ border-color: var(--accent); }
  .check-item.done .check-box svg{ stroke-dashoffset: 0; }

  .check-text{
    flex: 1;
    font-size: 14.5px;
    line-height: 1.5;
    padding-top: 1px;
    outline: none;
    word-break: break-word;
  }
  .check-item.done .check-text{
    color: var(--ink-soft);
    text-decoration: line-through;
    text-decoration-color: var(--ink-soft);
  }

  .check-remove{
    flex: none;
    background: none;
    border: none;
    color: var(--line);
    font-size: 15px;
    cursor: pointer;
    padding: 0 2px;
    opacity: 0;
    transition: opacity .15s;
  }
  .check-item:hover .check-remove{ opacity: 1; }
  .check-remove:hover{ color: var(--danger); }

  .add-item-row{
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px dashed var(--line);
  }
  .add-item-row input{
    flex: 1;
    border: none;
    background: transparent;
    font-family: var(--font-body);
    font-size: 13.5px;
    outline: none;
    color: var(--ink);
    padding: 2px 0;
  }
  .add-item-row input::placeholder{ color: var(--ink-soft); }
  .add-item-row button{
    background: none;
    border: none;
    color: var(--accent);
    font-size: 13px;
    cursor: pointer;
    font-weight: 600;
  }

  .subgoal-remove{
    position: absolute;
    top: 10px;
    right: 12px;
    background: none;
    border: none;
    color: var(--line);
    font-size: 14px;
    cursor: pointer;
    opacity: 0;
    transition: opacity .15s;
  }
  .subgoal-card:hover .subgoal-remove{ opacity: 1; }
  .subgoal-remove:hover{ color: var(--danger); }

  .add-subgoal-btn{
    align-self: flex-start;
    margin-top: 2px;
    font-family: var(--font-hand);
    font-size: 16px;
    color: var(--ink-soft);
    background: none;
    border: 1.5px dashed var(--line);
    border-radius: 6px;
    padding: 10px 18px;
    cursor: pointer;
    transition: border-color .15s, color .15s;
  }
  .add-subgoal-btn:hover{
    color: var(--accent);
    border-color: var(--accent);
  }

  /* ---------- 생각 기록 (저널) ---------- */

  .journal-input-row{
    display: flex;
    gap: 8px;
    margin-bottom: 18px;
  }
  .journal-input-row textarea{
    flex: 1;
    min-height: 46px;
    resize: vertical;
    border: 1px solid var(--line);
    background: var(--paper-soft);
    border-radius: 6px;
    padding: 10px 12px;
    font-family: var(--font-body);
    font-size: 13.5px;
    color: var(--ink);
    outline: none;
  }
  .journal-input-row textarea:focus{ border-color: var(--accent); }
  .journal-submit{
    flex: none;
    align-self: flex-end;
    background: var(--highlight);
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 10px 16px;
    font-family: var(--font-hand);
    font-size: 14px;
    cursor: pointer;
  }
  .journal-submit:hover{ opacity: .9; }

  .journal-list{
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .journal-entry{
    position: relative;
    padding: 12px 14px 12px 16px;
    border-left: 2px solid var(--accent-soft);
    font-size: 13.5px;
    line-height: 1.6;
    color: var(--ink);
  }
  .journal-date{
    display: block;
    font-size: 11.5px;
    color: var(--ink-soft);
    margin-bottom: 3px;
  }
  .journal-remove{
    position: absolute;
    right: 4px;
    top: 10px;
    background: none;
    border: none;
    color: var(--line);
    cursor: pointer;
    font-size: 13px;
    opacity: 0;
    transition: opacity .15s;
  }
  .journal-entry:hover .journal-remove{ opacity: 1; }
  .journal-remove:hover{ color: var(--danger); }

  .empty-note{
    font-size: 13px;
    color: var(--ink-soft);
  }

  /* ---------- 빈 상태 (목표 없음) ---------- */

  .empty-state{
    text-align: center;
    padding: 60px 20px;
  }
  .empty-state p{
    font-family: var(--font-hand);
    font-size: 20px;
    color: var(--ink-soft);
    margin: 0 0 18px;
    line-height: 1.6;
  }
  .empty-start-btn{
    font-family: var(--font-hand);
    font-size: 17px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 12px 26px;
    cursor: pointer;
  }
  .empty-start-btn:hover{ opacity: .92; }

  [hidden]{ display: none !important; }

  a, button, input, textarea{ font: inherit; }
  button:focus-visible, input:focus-visible, textarea:focus-visible, [contenteditable]:focus-visible{
    outline: 2px solid var(--highlight);
    outline-offset: 2px;
  }

  @media (prefers-reduced-motion: reduce){
    *{ transition: none !important; }
  }

  @media (max-width: 560px){
    .goal-title{ font-size: 27px; }
    .ring-wrap{ width: 168px; height: 168px; }
    .ring-percent{ font-size: 32px; }
  }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute">
  <filter id="wobble">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="1" seed="3" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.4"/>
  </filter>
</svg>

<!-- 로그인 전 -->
<div class="login-wrap" id="loginWrap">
  <div class="login-box">
    <div style="font-size:40px">🎯</div>
    <div class="login-title">프로젝트</div>
    <div class="login-sub">구글 계정으로 로그인하면<br>어디서든 진행도가 동기화돼요</div>
    <button class="google-btn" id="googleLoginBtn">
      <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google"/>
      Google로 로그인
    </button>
  </div>
</div>

<div class="saving-indicator" id="savingIndicator">저장 중...</div>

<!-- 로그인 후 -->
<div id="mainWrap">
<div class="page">

  <!-- 목표가 없을 때 -->
  <div class="empty-state" id="emptyState" hidden>
    <p>지금 집중하고 있는 목표가 없어요.<br>이번엔 뭘 완성해보고 싶으세요?</p>
    <button class="empty-start-btn" id="emptyStartBtn">새 목표 시작하기</button>
  </div>

  <!-- 메인 컨텐츠 -->
  <div id="mainContent">

    <div class="hero">
      <p class="hero-eyebrow">지금 집중하고 있는 프로젝트</p>
      <textarea class="goal-title" id="goalTitle" rows="1"
        placeholder="예: 인스타그램에 일주일에 한 번 그림 올리기"></textarea>

      <div class="ring-wrap">
        <svg viewBox="0 0 100 100">
          <circle class="ring-track" cx="50" cy="50" r="42"></circle>
          <circle class="ring-fill" id="ringFill" cx="50" cy="50" r="42"
            stroke-dasharray="264" stroke-dashoffset="264"></circle>
        </svg>
        <div class="ring-center">
          <div class="ring-percent" id="ringPercent">0%</div>
          <div class="ring-caption" id="ringCaption">0 / 0 완료</div>
        </div>
      </div>

      <div class="hero-sub">체크리스트를 하나씩 해나갈수록 채워져요 · Ctrl+S로 저장</div>
      <br>
      <button class="new-goal-btn" id="resetBtn">다른 목표로 새로 시작하기</button>
    </div>

    <div class="section">
      <h2 class="section-title">작은 목표 &amp; 체크리스트</h2>
      <p class="section-desc">목표를 이루기 위해 필요한 일들을 작게 쪼개서 적어보세요.</p>

      <div class="subgoals" id="subgoalsList"></div>

      <button class="add-subgoal-btn" id="addSubgoalBtn" style="margin-top:18px;">
        + 작은 목표 추가하기
      </button>
    </div>

    <div class="section">
      <h2 class="section-title">생각 기록</h2>
      <p class="section-desc">아직 체크리스트로 정리되지 않은 생각이나 아이디어를 편하게 적어두는 곳이에요.</p>

      <div class="journal-input-row">
        <textarea id="journalInput" placeholder="예: 다음 그림 컨셉은 야간 배경으로 해볼까..."></textarea>
        <button class="journal-submit" id="journalSubmit">기록하기</button>
      </div>

      <div class="journal-list" id="journalList"></div>
    </div>

  </div>

</div>
</div>

<script type="module">
/* =========================================================
   Firebase — 두목님 my-planner 사이트와 같은 프로젝트를 그대로 사용.
   이 페이지를 사이트와 같은 도메인(같은 my-planner-3728c 로그인
   세션)에 올려두시면, 메인 사이트에서 로그인한 상태 그대로
   여기서도 자동으로 로그인돼 있어요.
   ========================================================= */
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-auth.js";
import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBkSmyAwRUlpgZBUz0kXqCVoS29dYht7No",
  authDomain: "my-planner-3728c.firebaseapp.com",
  projectId: "my-planner-3728c",
  storageBucket: "my-planner-3728c.firebasestorage.app",
  messagingSenderId: "179812397978",
  appId: "1:179812397978:web:3525714542291e818e0023"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const provider = new GoogleAuthProvider();

let currentUser = null;

document.getElementById('googleLoginBtn').onclick = async () => {
  try{ await signInWithPopup(auth, provider); }
  catch(e){ alert('로그인 실패: ' + e.message); }
};

/* ---------- 데이터 모델 ----------
   state = {
     goalTitle: string,
     subgoals: [ { id, title, items: [ { id, text, done } ] } ],
     journal: [ { id, text, date } ]
   }
   저장 위치: users/{uid}/focus/current  (다이어리·습관탭 등과 같은 방식)
------------------------------------- */

let state = { goalTitle: "", subgoals: [], journal: [] };
let saveTimer = null;

function showSaving(){
  const el = document.getElementById('savingIndicator');
  el.style.display = 'block';
  clearTimeout(showSaving._t);
  showSaving._t = setTimeout(() => { el.style.display = 'none'; }, 1200);
}

async function loadState(){
  if(!currentUser) return;
  try{
    const snap = await getDoc(doc(db,'users',currentUser.uid,'focus','current'));
    if(snap.exists()){
      const d = snap.data();
      state = {
        goalTitle: d.goalTitle || "",
        subgoals: d.subgoals || [],
        journal: d.journal || []
      };
    }
  }catch(err){
    console.error('불러오기 실패:', err);
  }
}

async function saveStateNow(){
  if(!currentUser) return;
  try{
    await setDoc(doc(db,'users',currentUser.uid,'focus','current'), state, { merge:true });
    showSaving();
  }catch(err){
    console.error('저장 실패:', err);
    alert('저장 중 오류가 발생했어요. 잠시 후 다시 시도해주세요.\n(' + err.message + ')');
  }
}

// 변경이 생기면 잠시 후 조용히 자동저장 (인디케이터도 함께 뜸)
function queueSave(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveStateNow, 800);
}

// Ctrl+S / Cmd+S 는 즉시 저장 + 저장중 표시
document.addEventListener('keydown', (e) => {
  if((e.ctrlKey || e.metaKey) && e.key === 's'){
    e.preventDefault();
    clearTimeout(saveTimer);
    saveStateNow();
  }
});

onAuthStateChanged(auth, async (user) => {
  if(user){
    currentUser = user;
    document.getElementById('loginWrap').style.display = 'none';
    document.getElementById('mainWrap').style.display = 'block';
    await loadState();
    render();
  } else {
    currentUser = null;
    document.getElementById('loginWrap').style.display = 'flex';
    document.getElementById('mainWrap').style.display = 'none';
  }
});

function uid(){
  return Math.random().toString(36).slice(2, 10);
}

/* ---------- 렌더링 ---------- */

const emptyState = document.getElementById('emptyState');
const mainContent = document.getElementById('mainContent');
const goalTitleEl = document.getElementById('goalTitle');
const ringFill = document.getElementById('ringFill');
const ringPercent = document.getElementById('ringPercent');
const ringCaption = document.getElementById('ringCaption');
const subgoalsList = document.getElementById('subgoalsList');
const journalList = document.getElementById('journalList');

const RING_CIRC = 264; // 2 * PI * 42, 대략

function hasActiveGoal(){
  return state.goalTitle.trim().length > 0;
}

function render(){
  if (!hasActiveGoal()){
    emptyState.hidden = false;
    mainContent.hidden = true;
    return;
  }
  emptyState.hidden = true;
  mainContent.hidden = false;

  if (document.activeElement !== goalTitleEl){
    goalTitleEl.value = state.goalTitle;
  }
  autoGrow(goalTitleEl);

  renderProgress();
  renderSubgoals();
  renderJournal();
}

function renderProgress(){
  let total = 0, done = 0;
  state.subgoals.forEach(sg => {
    total += sg.items.length;
    done += sg.items.filter(i => i.done).length;
  });
  const pct = total === 0 ? 0 : Math.round((done / total) * 100);
  const offset = RING_CIRC - (RING_CIRC * pct / 100);
  ringFill.style.strokeDashoffset = offset;
  ringPercent.textContent = pct + '%';
  ringCaption.textContent = done + ' / ' + total + ' 완료';
}

function renderSubgoals(){
  subgoalsList.innerHTML = '';
  state.subgoals.forEach(sg => {
    subgoalsList.appendChild(buildSubgoalCard(sg));
  });
}

function buildSubgoalCard(sg){
  const card = document.createElement('div');
  card.className = 'subgoal-card';

  const removeBtn = document.createElement('button');
  removeBtn.className = 'subgoal-remove';
  removeBtn.textContent = '✕';
  removeBtn.setAttribute('aria-label', '작은 목표 삭제');
  removeBtn.onclick = () => {
    state.subgoals = state.subgoals.filter(s => s.id !== sg.id);
    queueSave(); render();
  };
  card.appendChild(removeBtn);

  const head = document.createElement('div');
  head.className = 'subgoal-head';

  const nameInput = document.createElement('input');
  nameInput.className = 'subgoal-name';
  nameInput.value = sg.title;
  nameInput.placeholder = '작은 목표 이름';
  nameInput.oninput = () => { sg.title = nameInput.value; queueSave(); };
  head.appendChild(nameInput);

  const doneCount = sg.items.filter(i => i.done).length;
  const progLabel = document.createElement('span');
  progLabel.className = 'subgoal-progress-label';
  progLabel.textContent = doneCount + '/' + sg.items.length;
  head.appendChild(progLabel);

  card.appendChild(head);

  const bar = document.createElement('div');
  bar.className = 'subgoal-bar';
  const barFill = document.createElement('div');
  barFill.className = 'subgoal-bar-fill';
  const pct = sg.items.length ? (doneCount / sg.items.length) * 100 : 0;
  barFill.style.width = pct + '%';
  bar.appendChild(barFill);
  card.appendChild(bar);

  const list = document.createElement('ul');
  list.className = 'checklist';
  sg.items.forEach(item => list.appendChild(buildCheckItem(sg, item)));
  card.appendChild(list);

  const addRow = document.createElement('div');
  addRow.className = 'add-item-row';
  const addInput = document.createElement('input');
  addInput.placeholder = '체크리스트 항목 추가...';
  const addBtn = document.createElement('button');
  addBtn.textContent = '추가';
  const commit = () => {
    const val = addInput.value.trim();
    if (!val) return;
    sg.items.push({ id: uid(), text: val, done: false });
    addInput.value = '';
    queueSave(); render();
  };
  addBtn.onclick = commit;
  addInput.onkeydown = (e) => { if (e.key === 'Enter'){ e.preventDefault(); commit(); } };
  addRow.appendChild(addInput);
  addRow.appendChild(addBtn);
  card.appendChild(addRow);

  return card;
}

function buildCheckItem(sg, item){
  const li = document.createElement('li');
  li.className = 'check-item' + (item.done ? ' done' : '');

  const box = document.createElement('div');
  box.className = 'check-box';
  box.setAttribute('role', 'checkbox');
  box.setAttribute('aria-checked', item.done ? 'true' : 'false');
  box.tabIndex = 0;
  box.innerHTML = '<svg viewBox="0 0 20 20"><path d="M4 10.5 L8.3 14.5 L16 5.5"/></svg>';
  const toggle = () => {
    item.done = !item.done;
    queueSave(); render();
  };
  box.onclick = toggle;
  box.onkeydown = (e) => { if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); toggle(); } };
  li.appendChild(box);

  const text = document.createElement('div');
  text.className = 'check-text';
  text.contentEditable = 'true';
  text.textContent = item.text;
  text.oninput = () => { item.text = text.textContent; };
  text.onblur = () => { queueSave(); };
  li.appendChild(text);

  const remove = document.createElement('button');
  remove.className = 'check-remove';
  remove.textContent = '✕';
  remove.setAttribute('aria-label', '항목 삭제');
  remove.onclick = () => {
    sg.items = sg.items.filter(i => i.id !== item.id);
    queueSave(); render();
  };
  li.appendChild(remove);

  return li;
}

function renderJournal(){
  journalList.innerHTML = '';
  if (state.journal.length === 0){
    const p = document.createElement('p');
    p.className = 'empty-note';
    p.textContent = '아직 기록된 생각이 없어요.';
    journalList.appendChild(p);
    return;
  }
  state.journal.forEach(entry => {
    const div = document.createElement('div');
    div.className = 'journal-entry';

    const date = document.createElement('span');
    date.className = 'journal-date';
    date.textContent = entry.date;
    div.appendChild(date);

    const text = document.createElement('div');
    text.textContent = entry.text;
    div.appendChild(text);

    const remove = document.createElement('button');
    remove.className = 'journal-remove';
    remove.textContent = '✕';
    remove.setAttribute('aria-label', '기록 삭제');
    remove.onclick = () => {
      state.journal = state.journal.filter(j => j.id !== entry.id);
      queueSave(); render();
    };
    div.appendChild(remove);

    journalList.appendChild(div);
  });
}

function autoGrow(el){
  el.style.height = 'auto';
  el.style.height = el.scrollHeight + 'px';
}

/* ---------- 이벤트 바인딩 ---------- */

goalTitleEl.addEventListener('input', () => {
  state.goalTitle = goalTitleEl.value;
  autoGrow(goalTitleEl);
  queueSave();
});

document.getElementById('addSubgoalBtn').onclick = () => {
  state.subgoals.push({ id: uid(), title: '', items: [] });
  queueSave(); render();
  const inputs = document.querySelectorAll('.subgoal-name');
  if (inputs.length) inputs[inputs.length - 1].focus();
};

document.getElementById('resetBtn').onclick = () => {
  if (state.subgoals.length && !confirm('지금 목표를 정리하고 새로 시작할까요? 현재 체크리스트는 사라져요.')) return;
  state = { goalTitle: '', subgoals: [], journal: state.journal };
  queueSave(); render();
};

document.getElementById('emptyStartBtn').onclick = () => {
  render();
  goalTitleEl.hidden = false;
  emptyState.hidden = true;
  mainContent.hidden = false;
  setTimeout(() => goalTitleEl.focus(), 50);
};

const journalInput = document.getElementById('journalInput');
document.getElementById('journalSubmit').onclick = () => {
  const val = journalInput.value.trim();
  if (!val) return;
  const now = new Date();
  const dateStr = (now.getMonth()+1) + '월 ' + now.getDate() + '일 ' +
    String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
  state.journal.unshift({ id: uid(), text: val, date: dateStr });
  journalInput.value = '';
  queueSave(); render();
};
</script>

</body>
</html>
